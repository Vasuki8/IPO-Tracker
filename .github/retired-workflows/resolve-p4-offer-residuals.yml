name: Resolve P4 verified offer residuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_verified_offer_residuals_v2.py"
      - "tests/test_verified_offer_residuals_v2.py"
      - ".github/workflows/resolve-p4-offer-residuals.yml"

permissions:
  contents: write

concurrency:
  group: p4-verified-offer-residuals
  cancel-in-progress: false

jobs:
  resolve-offer-residuals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Test deterministic offer residuals
        run: |
          uv run python -m unittest discover -s tests -p "test_verified_offer_residuals_v2.py" -v
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Apply verified offer residuals
        run: |
          uv run python scripts/apply_verified_offer_residuals_v2.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish verified offer residuals safely
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"

          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during verified offer residual pass; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/)" ]; then
            echo "No verified offer residual gains to publish"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: resolve verified P4 offer residuals"
          git push origin HEAD:main

      - name: Report remaining offer gaps
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/missing_queue.json > /tmp/current-missing-queue.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/current-missing-queue.json').read_text(encoding='utf-8'))
          gaps = payload.get('fieldGapCounts') or {}
          offer = {k: v for k, v in gaps.items() if k.startswith('offer.')}
          print('Remaining offer gaps:', offer)
          print('P4 queue count:', (payload.get('priorityCounts') or {}).get('P4 recent history (2y)', 0))
          if any(offer.values()):
              raise SystemExit('Offer gaps remain after deterministic residual pass')
          PY
