name: P4 legacy debt cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/prune_p4_legacy_debt_symbols.py"
      - "tests/test_prune_p4_legacy_debt_symbols.py"
      - ".github/workflows/cleanup-p4-legacy-debt.yml"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  cleanup-p4-legacy-debt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run cleanup regression tests
        run: |
          uv run python -m unittest discover -s tests -p "test_prune_p4_legacy_debt_symbols.py" -v
          uv run python -m unittest discover -s tests -p "test_update_data_v2.py" -v
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Remove legacy P4 debt rows
        run: |
          uv run python scripts/prune_p4_legacy_debt_symbols.py --history-days 730
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish cleanup safely
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"

          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed while cleanup ran; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/)" ]; then
            echo "No legacy P4 debt rows required cleanup"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: remove legacy P4 debt rows"
          git push origin HEAD:main

      - name: Report cleaned P4 coverage
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/completeness.json > /tmp/current-completeness.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/current-completeness.json').read_text(encoding='utf-8'))
          recent = ((payload.get('coverage') or {}).get('recentExchange2Y') or {})
          for key in ('priceBand', 'lotSize', 'issueSizeCr', 'issueComposition'):
              item = recent.get(key) or {}
              print(
                  f"{key}: {item.get('present', 0)}/{item.get('expected', 0)} "
                  f"({item.get('pct', 0)}%), missing={item.get('missing', 0)}"
              )
          PY
