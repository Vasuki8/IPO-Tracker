name: SEBI offer-document enrichment

on:
  workflow_dispatch:
    inputs:
      deep_offer_docs:
        description: "Extract all currently eligible official offer documents"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "scripts/enrich_offer_docs.py"
      - "scripts/run_offer_docs_v2.py"
      - "scripts/run_offer_docs_v3.py"
      - "scripts/run_offer_docs_v4.py"
      - "scripts/run_offer_docs_v5.py"
      - "scripts/run_offer_docs_v6.py"
      - "scripts/run_offer_docs_v7.py"
      - "scripts/run_offer_docs_v8.py"
      - "scripts/run_offer_docs_v9.py"
      - "scripts/run_offer_docs_v10.py"
      - "scripts/run_offer_docs_v11.py"
      - "scripts/run_offer_docs_v12.py"
      - "scripts/run_offer_docs_v13.py"
      - "scripts/enrich_issuer_offer_docs.py"
      - "scripts/run_issuer_offer_docs.py"
      - "scripts/run_issuer_offer_docs_v2.py"
      - "scripts/run_issuer_offer_docs_v3.py"
      - "scripts/run_critical_offer_backfill.py"
      - "scripts/enrich_sebi_document_links.py"
      - "scripts/enrich_sebi_priority_registers.py"
      - "scripts/enrich_sebi_priority_registers_v2.py"
      - "scripts/enrich_recent_offer_terms.py"
      - "scripts/apply_verified_lot_sizes.py"
      - "scripts/apply_verified_recent_issue_terms.py"
      - "scripts/apply_verified_recent_offer_fields.py"
      - "scripts/apply_verified_filing_offer_fields.py"
      - "scripts/critical_backfill.py"
      - "scripts/audit_data_completeness.py"
      - "scripts/build_missing_queue.py"
      - "tests/test_offer_docs.py"
      - "tests/test_offer_docs_v2.py"
      - "tests/test_offer_docs_v3.py"
      - "tests/test_offer_docs_v4.py"
      - "tests/test_offer_docs_v5.py"
      - "tests/test_offer_docs_v6.py"
      - "tests/test_offer_docs_v7.py"
      - "tests/test_offer_docs_v8.py"
      - "tests/test_offer_docs_v9.py"
      - "tests/test_offer_docs_v10.py"
      - "tests/test_offer_docs_v11.py"
      - "tests/test_offer_docs_v12.py"
      - "tests/test_offer_docs_v13.py"
      - "tests/test_issuer_offer_docs.py"
      - "tests/test_issuer_offer_docs_v2.py"
      - "tests/test_issuer_offer_docs_v3.py"
      - "tests/test_critical_offer_backfill.py"
      - "tests/test_sebi_document_links.py"
      - "tests/test_sebi_priority_registers.py"
      - "tests/test_sebi_priority_registers_v2.py"
      - "tests/test_recent_offer_terms.py"
      - "tests/test_verified_lot_sizes.py"
      - "tests/test_verified_recent_issue_terms.py"
      - "tests/test_verified_recent_offer_fields.py"
      - "tests/test_verified_filing_offer_fields.py"
      - "tests/test_critical_backfill.py"
      - "tests/test_data_completeness.py"
      - "tests/test_missing_queue.py"
      - ".github/workflows/enrich-offer-docs.yml"
      - "pyproject.toml"
  schedule:
    - cron: "43 13 * * *"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run offer-document parser v1 regression tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs.py" -v
      - name: Run offer-document parser v3 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v3.py" -v
      - name: Run offer-document parser v4 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v4.py" -v
      - name: Run offer-document parser v5 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v5.py" -v
      - name: Run offer-document parser v6 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v6.py" -v
      - name: Run offer-document parser v7 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v7.py" -v
      - name: Run offer-document parser v8 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v8.py" -v
      - name: Run offer-document parser v9 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v9.py" -v
      - name: Run offer-document parser v10 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v10.py" -v
      - name: Run offer-document parser v11 tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v11.py" -v
      - name: Run offer-document parser v12 recognition tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v12.py" -v
      - name: Run offer-document parser v13 deep-term tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v13.py" -v
      - name: Run issuer-document fallback tests
        run: uv run python -m unittest discover -s tests -p "test_issuer_offer_docs.py" -v
      - name: Run issuer-document v12 term tests
        run: uv run python -m unittest discover -s tests -p "test_issuer_offer_docs_v2.py" -v
      - name: Run issuer-document v13 deep-term tests
        run: uv run python -m unittest discover -s tests -p "test_issuer_offer_docs_v3.py" -v
      - name: Run safe full-document fallback tests
        run: uv run python -m unittest discover -s tests -p "test_critical_offer_backfill.py" -v
      - name: Run SEBI document-link tests
        run: uv run python -m unittest discover -s tests -p "test_sebi_document_links.py" -v
      - name: Run SEBI priority-register tests
        run: uv run python -m unittest discover -s tests -p "test_sebi_priority_registers.py" -v
      - name: Run SEBI priority-search v2 tests
        run: uv run python -m unittest discover -s tests -p "test_sebi_priority_registers_v2.py" -v
      - name: Run recent offer-term tests
        run: uv run python -m unittest discover -s tests -p "test_recent_offer_terms.py" -v
      - name: Run verified lot-size tests
        run: uv run python -m unittest discover -s tests -p "test_verified_lot_sizes.py" -v
      - name: Run verified recent issue-term tests
        run: uv run python -m unittest discover -s tests -p "test_verified_recent_issue_terms.py" -v
      - name: Run verified recent offer-field tests
        run: uv run python -m unittest discover -s tests -p "test_verified_recent_offer_fields.py" -v
      - name: Run verified filing offer-field tests
        run: uv run python -m unittest discover -s tests -p "test_verified_filing_offer_fields.py" -v
      - name: Run critical-backfill tests
        run: uv run python -m unittest discover -s tests -p "test_critical_backfill.py" -v
      - name: Run completeness-audit tests
        run: uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
      - name: Run missing-queue tests
        run: uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Resolve and extract priority offer intelligence
        shell: bash
        run: |
          if [ "${{ github.event.inputs.deep_offer_docs }}" = "true" ]; then
            DOC_LIMIT=0
            LINK_LIMIT=0
            ISSUER_LIMIT=0
            CRITICAL_LIMIT=0
            SEARCH_LIMIT=0
            TERMS_LIMIT=0
          else
            # P4 history participates in exact final RHP/Prospectus discovery.
            # Bounded daily limits make the queue advance without overloading one
            # slow SEBI endpoint or the GitHub runner.
            DOC_LIMIT=20
            LINK_LIMIT=60
            ISSUER_LIMIT=30
            CRITICAL_LIMIT=20
            SEARCH_LIMIT=60
            TERMS_LIMIT=40
          fi
          # Priority 4 is the recent two-year historical exchange backlog. The
          # v2 register search accepts only final RHP/Prospectus landing pages,
          # exact-matches them to the issuer and then resolves PDFs from SEBI.
          uv run python scripts/enrich_sebi_priority_registers_v2.py --priority-max 4 --search-limit "$SEARCH_LIMIT"
          uv run python scripts/enrich_sebi_document_links.py --priority-max 4 --limit "$LINK_LIMIT"
          # Recent live/filing term discovery remains scoped to P0-P3.
          uv run python scripts/enrich_recent_offer_terms.py --priority-max 3 --limit "$TERMS_LIMIT"

          # Never disable certificate verification for SEBI's intermittently
          # incomplete TLS chain. These registries are strict, fill-only bridges
          # for finalized recent terms and retain the independent verification page.
          uv run python scripts/apply_verified_lot_sizes.py
          uv run python scripts/apply_verified_recent_issue_terms.py

          # v13 preserves v12's strict recognition but scans bounded deep pages
          # for Minimum Bid Lot / Minimum Bid Quantity / Market Lot / final price
          # terms before parsing. Exchange-normalized fields remain fill-only.
          uv run python scripts/run_offer_docs_v13.py --limit "$DOC_LIMIT"
          # Validated issuer/registrar/NSE/BSE mirror documents use the same v13
          # deep selector while retaining exact-host and issuer-identity gates.
          uv run python scripts/run_issuer_offer_docs_v3.py --priority-max 4 --limit "$ISSUER_LIMIT"
          # Only fields still missing after official-document parsing are bridged.
          uv run python scripts/apply_verified_recent_offer_fields.py
          uv run python scripts/apply_verified_filing_offer_fields.py

          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py
          uv run python scripts/run_critical_offer_backfill.py --documents-only --priority-max 3 --limit "$CRITICAL_LIMIT"

      - name: Publish changed offer-document data and audit safely
        shell: bash
        run: |
          BASE_DATA="$(cat /tmp/base-data-blob)"
          cp data/ipos.json /tmp/final-ipos.json
          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Code-only commits may land while SEBI PDFs are being processed. Rebase
          # onto them and rebuild derived artifacts. A concurrent IPO-data change
          # is different: abort rather than trying to merge two generated datasets.
          for attempt in 1 2 3; do
            echo "Offer-document publish attempt $attempt/3"
            git fetch origin main
            REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
            if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
              echo "Remote IPO data changed during this run; skipping stale offer-document publication."
              exit 0
            fi

            git reset --hard origin/main
            cp /tmp/final-ipos.json data/ipos.json
            uv run python scripts/audit_data_completeness.py
            uv run python scripts/build_missing_queue.py

            if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md)" ]; then
              echo "No offer-document, audit or repair-queue changes"
              exit 0
            fi

            git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md
            git commit -m "data: resolve and backfill priority offer documents"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with a code-only commit; retrying safely."
          done

          echo "Unable to publish offer-document data after 3 race-safe attempts."
          exit 1