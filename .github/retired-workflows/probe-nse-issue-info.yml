name: Probe NSE issue information

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-nse-issue-info.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Probe official NSE IPO detail API
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import requests

          HOME = "https://www.nseindia.com"
          PAGE = HOME + "/market-data/issue-information?series=EQ&symbol=SENCO&type=Past"
          API = HOME + "/api/ipo-detail?symbol=SENCO&series=EQ"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }
          session = requests.Session()
          session.headers.update(headers)

          # The issue-information page reliably establishes the cookies needed by
          # the API even when the NSE home page rejects a cloud IP.
          page = session.get(PAGE, timeout=30, headers={"Referer": HOME + "/"})
          api = session.get(API, timeout=30, headers={"Referer": PAGE})

          result = {
              "pageStatus": page.status_code,
              "pageBytes": len(page.content),
              "apiStatus": api.status_code,
              "apiBytes": len(api.content),
              "apiUrl": api.url,
          }
          try:
              payload = api.json()
              result["payloadType"] = type(payload).__name__
              result["payload"] = payload
          except Exception:
              result["bodyPrefix"] = api.text[:3000]

          Path("docs/NSE_ISSUE_INFO_PROBE.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish probe result
        shell: bash
        run: |
          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NSE_ISSUE_INFO_PROBE.json
          git commit -m "debug: record NSE IPO detail schema" || exit 0
          git push origin HEAD:main
