name: Resolve P4 NSE lot sizes

on:
  workflow_dispatch:
  push:
    branches:
      - p4-nse-lot-backfill
    paths:
      - "scripts/backfill_recent_nse_lot_sizes.py"
      - "tests/test_nse_lot_backfill.py"
      - ".github/workflows/resolve-p4-nse-lot-sizes.yml"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  resolve-p4-nse-lot-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Test NSE lot backfill safeguards
        run: |
          uv run python -m unittest discover -s tests -p "test_nse_lot_backfill.py" -v
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Backfill remaining P4 lots from NSE issue detail
        run: |
          uv run python scripts/backfill_recent_nse_lot_sizes.py --limit 250
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish only genuine data gains
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"
          GENERATED_DATA="$(git hash-object /tmp/generated-ipos.json)"

          # Audit/queue generators update timestamps even when the IPO dataset did
          # not change. Never publish a data commit unless data/ipos.json itself
          # gained information.
          if [ "$GENERATED_DATA" = "$BASE_DATA" ]; then
            echo "No genuine NSE P4 lot-size gains; IPO dataset is unchanged."
            exit 0
          fi

          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during NSE lot pass; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          # Require the canonical IPO data file itself to be changed. This avoids
          # timestamp-only commits from completeness/missing-queue regeneration.
          if git diff --quiet -- data/ipos.json; then
            echo "No genuine NSE P4 lot-size gains after rebasing on main."
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: advance P4 lot sizes from NSE issue detail"
          git push origin HEAD:main

      - name: Report exact P4 lot-size residuals
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/missing_queue.json > /tmp/current-missing-queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/current-missing-queue.json').read_text(encoding='utf-8'))
          p4 = [row for row in payload.get('queue') or [] if row.get('priorityLabel') == 'P4 recent history (2y)']
          rows = [row for row in p4 if 'exchange.lotSize' in (row.get('missingFields') or [])]
          print('P4 lotSize gaps:', len(rows))
          print('P4 queue count:', len(p4))
          print('Newest residuals:', [(row.get('id'), row.get('symbol'), row.get('openDate')) for row in rows[:30]])
          PY
