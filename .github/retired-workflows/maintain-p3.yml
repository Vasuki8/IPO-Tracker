name: Maintain P3 filing pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Core IPO refresh"
    types:
      - completed
  schedule:
    # Fallback sweep every six hours in case a core run is skipped or disabled.
    - cron: "31 */6 * * *"

permissions:
  contents: write

# Serialize with every other workflow that can write data/ipos.json.
concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  maintain-p3:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Inspect current P3 queue
        id: p3
        shell: bash
        run: |
          COUNT="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/missing_queue.json').read_text(encoding='utf-8'))
          print(int((payload.get('priorityCounts') or {}).get('P3 filing pipeline', 0)))
          PY
          )"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Current P3 filing-pipeline gaps: $COUNT"

      - name: Install uv
        if: steps.p3.outputs.count != '0'
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        if: steps.p3.outputs.count != '0'
        run: uv python install 3.12

      - name: Sync dependencies
        if: steps.p3.outputs.count != '0'
        run: uv sync

      - name: Run targeted P3 regression tests
        if: steps.p3.outputs.count != '0'
        run: |
          uv run python -m unittest discover -s tests -p "test_offer_docs_v11.py" -v
          uv run python -m unittest discover -s tests -p "test_issuer_offer_docs.py" -v
          uv run python -m unittest discover -s tests -p "test_sebi_document_links.py" -v
          uv run python -m unittest discover -s tests -p "test_sebi_priority_registers_v2.py" -v
          uv run python -m unittest discover -s tests -p "test_recent_offer_terms.py" -v
          uv run python -m unittest discover -s tests -p "test_verified_filing_offer_fields.py" -v
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        if: steps.p3.outputs.count != '0'
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Repair P3 filing-pipeline gaps
        if: steps.p3.outputs.count != '0'
        shell: bash
        run: |
          # First exhaust official SEBI discovery, official offer documents and
          # official issuer/registrar/exchange mirrors for current P3 records.
          uv run python scripts/enrich_sebi_priority_registers_v2.py --priority-max 3 --search-limit 20
          uv run python scripts/enrich_sebi_document_links.py --priority-max 3 --limit 20
          uv run python scripts/enrich_recent_offer_terms.py --priority-max 3 --limit 20
          uv run python scripts/run_offer_docs_v11.py --limit 8
          uv run python scripts/run_issuer_offer_docs.py --priority-max 3 --limit 8

          # The verified filing registry is a strict, fill-only last bridge for
          # disclosures already cross-checked against the exact SEBI filing.
          uv run python scripts/apply_verified_filing_offer_fields.py

          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          # Retry any remaining document-only P3 gaps through the guarded full-
          # document fallback, then rebuild the queue from the resulting data.
          uv run python scripts/run_critical_offer_backfill.py --documents-only --priority-max 3 --limit 8
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish P3 repairs safely
        if: steps.p3.outputs.count != '0'
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          cp data/completeness.json /tmp/generated-completeness.json
          cp data/missing_queue.json /tmp/generated-queue.json
          cp docs/DATA_QUALITY.md /tmp/generated-quality.md

          BASE_DATA="$(cat /tmp/base-data-blob)"
          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"

          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during the P3 run; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          cp /tmp/generated-completeness.json data/completeness.json
          cp /tmp/generated-queue.json data/missing_queue.json
          cp /tmp/generated-quality.md docs/DATA_QUALITY.md

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md)" ]; then
            echo "No P3 repair changes to publish"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md
          git commit -m "data: self-heal P3 filing-pipeline gaps"
          git push origin HEAD:main

      - name: Enforce P3 invariant on main
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/missing_queue.json > /tmp/current-missing-queue.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/current-missing-queue.json').read_text(encoding='utf-8'))
          count = int((payload.get('priorityCounts') or {}).get('P3 filing pipeline', 0))
          print(f'P3 filing-pipeline gaps on main: {count}')
          if count:
              raise SystemExit(
                  f'P3 invariant failed: {count} filing-pipeline record(s) still need repair'
              )
          PY
