name: Prepare isolated browser gate stabilization
on:
  push:
    branches: [fix/browser-gate-stability-20261004]
    paths: [.browser-gate-payload/**, .github/workflows/prepare-browser-gate.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Vasuki8/IPO-Tracker' && github.event.head_commit.message == 'chore: prepare browser gate stabilization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact reviewed patch without source or data changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '419256b30fd1ab93512a53d6fe934b332176a15b'
          mkdir -p "$RUNNER_TEMP/browser-gate"
          cat .browser-gate-payload/{0..8} | base64 -d | gzip -d > "$RUNNER_TEMP/browser-gate/patch.diff"
          echo "5521ebcead07bd3af6dece4a262691d3b718d3a232a65d36c03cfa67d20a8201  $RUNNER_TEMP/browser-gate/patch.diff" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/browser-gate/patch.diff"
          git apply "$RUNNER_TEMP/browser-gate/patch.diff"
          rm -r .browser-gate-payload
          rm .github/workflows/prepare-browser-gate.yml
          node scripts/test-browser-fixtures.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code -- data ops
      - name: Install existing pinned browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Prove original focus defect and run repaired browser suite
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tools/node_modules/playwright
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/browser-gate
          BROWSER_TEST_REPEAT: '3'
        shell: bash
        run: |
          set -euo pipefail
          cp assets/app.js "$RUNNER_TEMP/fixed-app.js"
          git show HEAD:assets/app.js > assets/app.js
          set +e
          node scripts/browser-route-focus.mjs > "$RUNNER_TEMP/browser-gate/original-focus.log" 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/fixed-app.js" assets/app.js
          test "$result" -ne 0
          grep -q 'late duplicate route must not steal keyboard focus' "$RUNNER_TEMP/browser-gate/original-focus.log"
          node scripts/run-browser-tests.mjs
      - name: Publish only the isolated tested branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --exit-code -- data ops
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: stabilize browser fixtures and duplicate-route focus'
          test "$(git ls-remote origin refs/heads/fix/browser-gate-stability-20261004 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/browser-gate-stability-20261004
          git rev-parse HEAD > "$RUNNER_TEMP/browser-gate/final-commit.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/browser-gate/source-snapshot.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-gate-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-gate
          retention-days: 14
