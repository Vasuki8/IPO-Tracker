name: Verify BSE listing candidates

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/verify-bse-listing-candidates.mjs"
      - "scripts/test-verify-bse-listing-candidates.mjs"
      - "scripts/retry-bse-listing-pdf.mjs"
      - "scripts/test-retry-bse-listing-pdf.mjs"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch2.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch4.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch5.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch7.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch8.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch9.json"
      - ".github/workflows/verify-bse-listing-candidates.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/verify-bse-listing-candidates.mjs"
      - "scripts/test-verify-bse-listing-candidates.mjs"
      - "scripts/retry-bse-listing-pdf.mjs"
      - "scripts/test-retry-bse-listing-pdf.mjs"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch2.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch4.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch5.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch7.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch8.json"
      - "data/discovery/bse-listing-candidates-2026-09-24-batch9.json"
      - ".github/workflows/verify-bse-listing-candidates.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Retain reproducible verification source revision
        run: |
          mkdir -p "${{ runner.temp }}/bse-listing-verification"
          git archive --format=zip HEAD > "${{ runner.temp }}/bse-listing-verification/source-snapshot.zip"
      - name: Capture deployed publication baseline
        continue-on-error: true
        env:
          OUTPUT: ${{ runner.temp }}/bse-listing-verification/deployed-baseline.json
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const url = 'https://vasuki8.github.io/IPO-Tracker/data/ipos.json?verification=' + process.env.GITHUB_SHA;
          const response = await fetch(url, { signal: AbortSignal.timeout(30000), headers: { 'cache-control': 'no-cache' } });
          if (!response.ok) throw new Error('deployed_dataset_http_' + response.status);
          const data = await response.json();
          if (!Array.isArray(data.records)) throw new Error('invalid_deployed_dataset');
          fs.writeFileSync(process.env.OUTPUT, JSON.stringify({ checked_at: new Date().toISOString(), url, data }, null, 2) + '\n');
          console.log(JSON.stringify({ deployed_records: data.records.length, generated_at: data.generated_at }));
          JS
      - name: Install notice PDF reader
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Test PDF archive safety
        run: node scripts/test-retry-bse-listing-pdf.mjs
      - name: Test listing verification and guards
        run: node scripts/test-verify-bse-listing-candidates.mjs
      - name: Verify historical batch 4 issuer-specific listing notices
        continue-on-error: true
        run: node scripts/verify-bse-listing-candidates.mjs --input=data/discovery/bse-listing-candidates-2026-09-24-batch4.json --output="${{ runner.temp }}/bse-listing-verification/batch4-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch4-notices"
      - name: Check official PDF archive for unresolved batch 4 notices
        continue-on-error: true
        run: node scripts/retry-bse-listing-pdf.mjs --report="${{ runner.temp }}/bse-listing-verification/batch4-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch4-notices" --upgrade-verified-html=true
      - name: Verify historical batch 5 issuer-specific listing notices
        continue-on-error: true
        run: node scripts/verify-bse-listing-candidates.mjs --input=data/discovery/bse-listing-candidates-2026-09-24-batch5.json --output="${{ runner.temp }}/bse-listing-verification/batch5-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch5-notices"
      - name: Check official PDF archive for unresolved batch 5 notices
        continue-on-error: true
        run: node scripts/retry-bse-listing-pdf.mjs --report="${{ runner.temp }}/bse-listing-verification/batch5-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch5-notices" --upgrade-verified-html=true
      - name: Verify corrected Recode listing notice
        continue-on-error: true
        run: node scripts/verify-bse-listing-candidates.mjs --input=data/discovery/bse-listing-candidates-2026-09-24-batch7.json --output="${{ runner.temp }}/bse-listing-verification/batch7-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch7-notices"
      - name: Require corrected Recode official PDF
        run: node scripts/retry-bse-listing-pdf.mjs --report="${{ runner.temp }}/bse-listing-verification/batch7-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch7-notices" --upgrade-verified-html=true
      - name: Verify cursor2 batch 8 issuer-specific listing notices
        continue-on-error: true
        run: node scripts/verify-bse-listing-candidates.mjs --input=data/discovery/bse-listing-candidates-2026-09-24-batch8.json --output="${{ runner.temp }}/bse-listing-verification/batch8-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch8-notices"
      - name: Check official PDF archive for unresolved cursor2 batch 8 notices
        continue-on-error: true
        run: node scripts/retry-bse-listing-pdf.mjs --report="${{ runner.temp }}/bse-listing-verification/batch8-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch8-notices" --upgrade-verified-html=true
      - name: Verify cursor2 batch 9 issuer-specific listing notices
        continue-on-error: true
        run: node scripts/verify-bse-listing-candidates.mjs --input=data/discovery/bse-listing-candidates-2026-09-24-batch9.json --output="${{ runner.temp }}/bse-listing-verification/batch9-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch9-notices"
      - name: Check official PDF archive for unresolved cursor2 batch 9 notices
        continue-on-error: true
        run: node scripts/retry-bse-listing-pdf.mjs --report="${{ runner.temp }}/bse-listing-verification/batch9-report.json" --evidence-dir="${{ runner.temp }}/bse-listing-verification/batch9-notices" --upgrade-verified-html=true
      - name: Report evidence formats for verified candidates
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const missing = [];
          for (const batch of ['batch4', 'batch5', 'batch8', 'batch9']) {
            const file = `${process.env.RUNNER_TEMP}/bse-listing-verification/${batch}-report.json`;
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const r of report.results.filter((item) => item.status === 'verified')) {
              const facts = Object.values(r.facts || {});
              if (r.source_kind !== 'BSE Listing Notice PDF' || !r.identity_pages ||
                  facts.length !== 3 || facts.some((fact) => !Number.isSafeInteger(fact.page) || fact.page < 1)) {
                missing.push({ batch, issuer_name: r.candidate?.issuer_name, listing_notice_no: r.candidate?.listing_notice_no });
              }
            }
          }
          console.log(JSON.stringify({ verified_html_only_evidence: missing }));
          JS
      - name: Summarize unresolved listing verification
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const batch of ['batch4', 'batch5']) {
            const file = `${process.env.RUNNER_TEMP}/bse-listing-verification/${batch}-report.json`;
            if (!fs.existsSync(file)) {
              console.log(JSON.stringify({ batch, report: 'missing' }));
              continue;
            }
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(JSON.stringify({
              batch,
              stats: report.stats,
              unresolved: report.results
                .filter((r) => r.status !== 'verified')
                .map((r) => ({
                  issuer_name: r.candidate?.issuer_name,
                  listing_notice_no: r.candidate?.listing_notice_no,
                  status: r.status,
                  reasons: r.reasons ?? r.pdf_archive_attempt?.reasons ?? [],
                  pdf_error: r.pdf_archive_attempt?.error ?? null
                }))
            }));
          }
          JS
      - name: Retain verified and rejected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-listing-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bse-listing-verification
          retention-days: 14
          if-no-files-found: warn
