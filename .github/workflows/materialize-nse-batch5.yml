name: Materialize reviewed NSE batch5
on:
  push:
    branches: ['backend/nse-universe-batch5-20260925']
    paths: ['.github/workflows/materialize-nse-batch5.yml']
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/nse-universe-batch5-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the exact reviewed source artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const r = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: 10880128428, archive_format: 'zip'});
            const b = Buffer.from(r.data);
            if (crypto.createHash('sha256').update(b).digest('hex') !== '760db5e15a4ec505738f0b1a36f97026d9f210648c3e63720bb12fb575bdea49') throw new Error('source_archive_hash_mismatch');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/batch5-source.zip', b);
      - name: Materialize only the manually reviewed batch
        env:
          SOURCE_DIR: ${{ runner.temp }}/batch5-source
        run: |
          mkdir -p "$SOURCE_DIR" "$RUNNER_TEMP/batch5-results"
          git rev-parse HEAD > "$RUNNER_TEMP/batch5-results/input-commit.txt"
          unzip -q "$RUNNER_TEMP/batch5-source.zip" -d "$SOURCE_DIR"
          node .github/materialize-nse-batch5.mjs | tee "$RUNNER_TEMP/batch5-results/source-validation.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='scripts/test-reviewed-nse-ipos.mjs';
          const before=fs.readFileSync(path,'utf8'), line='await import("./test-reviewed-nse-batch5.mjs");';
          if (!before.includes(line)) fs.writeFileSync(path,before.trimEnd()+'\n\n'+line+'\n');
          JS
      - name: Test all reviewed batches and publication preservation
        run: |
          node scripts/test-reviewed-nse-ipos.mjs | tee "$RUNNER_TEMP/batch5-results/tests.txt"
          node scripts/test-reviewed-nse-publication.mjs | tee "$RUNNER_TEMP/batch5-results/rehearsal.json"
          node scripts/apply-reviewed-nse-ipos.mjs --check
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code -- data/recovery data/ipos.json ops assets
          git diff --check
      - name: Commit reviewed evidence without applying production records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verified-nse-ipos/2026-09-25-batch5.json data/discovery/nse-universe-batch5-review-2026-09-25.json scripts/test-reviewed-nse-ipos.mjs
          git commit -m 'feat(data): retain fifteen independently reviewed NSE batch5 IPOs'
          git push origin HEAD:refs/heads/backend/nse-universe-batch5-20260925
          git rev-parse HEAD > "$RUNNER_TEMP/batch5-results/commit.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/batch5-results/source-snapshot.zip"
      - name: Retain materialization tests and revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-batch5-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch5-results
          retention-days: 14
          if-no-files-found: error
