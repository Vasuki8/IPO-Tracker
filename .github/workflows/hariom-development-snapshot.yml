name: Hariom development source snapshot
on:
  push:
    branches: [data/bse-2022-hariom-rainbow-20260927]
    paths: [.github/workflows/hariom-development-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git rev-parse HEAD > "$RUNNER_TEMP/main-sha.txt"
          git archive HEAD > "$RUNNER_TEMP/main-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: hariom-development-main
          path: |
            ${{ runner.temp }}/main-source.tar
            ${{ runner.temp }}/main-sha.txt
          retention-days: 1
