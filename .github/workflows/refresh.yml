name: Collect and publish IPO data

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [core, subscriptions, filings, maintenance, repair, p4, p5, performance, presentation, review, reviewed]
        default: maintenance
        description: Source collection stage
      reviewed_ids:
        type: string
        default: ''
        description: Comma-separated IDs for reviewed mode (requires retained composition proofs)
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/refresh.yml', 'data/verified_corrections.json', 'data/reviewed_correction_evidence.json', 'data/reviewed_correction_evidence/**', 'data/reviewed_publication_request.json', 'data/public_display_holds.json', 'uv.lock', 'pyproject.toml', '*.js', '*.css', '*.html']
  schedule:
    - cron: '17 * * * *'
    - cron: '0,30 4-12 * * 1-5'
    - cron: '43 13 * * *'
    - cron: '31 */6 * * *'

permissions:
  contents: read

# A new collector-code push makes an older push artifact unpublishable because
# publish_transaction.py correctly requires the exact source commit. Cancel only
# those superseded push workflows; scheduled/manual runs keep unique groups and
# continue independently.
concurrency:
  group: ipo-refresh-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      mode: ${{ steps.collection-mode.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Resolve collection mode
        id: collection-mode
        env:
          REQUESTED_MODE: ${{ inputs.mode || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [[ -z "$mode" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              mode="$(uv run --frozen python scripts/publication_mode.py)"
            elif [[ "$EVENT_SCHEDULE" == "0,30 4-12 * * 1-5" ]]; then
              mode="subscriptions"
            elif [[ "$EVENT_SCHEDULE" == "43 13 * * *" ]]; then
              mode="maintenance"
            elif [[ "$EVENT_SCHEDULE" == "31 */6 * * *" ]]; then
              mode="filings"
            else
              mode="core"
            fi
          fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
          echo "Collection mode: $mode"
      - name: Install bounded PDF table extraction when needed
        env:
          MODE: ${{ steps.collection-mode.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            core|filings|maintenance|repair|p4)
              sudo apt-get update -qq
              sudo apt-get install -y poppler-utils
              ;;
            *)
              echo "Skipping poppler-utils for $MODE mode"
              ;;
          esac
      - name: Verify the collector
        run: uv run --frozen python -m unittest discover -s tests -q
      - name: Save collection baseline
        run: |
          mkdir -p /tmp/ipo-bundle
          cp data/ipos.json /tmp/ipo-bundle/base.json
          git rev-parse HEAD > /tmp/ipo-bundle/source-commit.txt
      - name: Collect sources with explicit stage outcomes
        if: steps.collection-mode.outputs.value != 'presentation' && steps.collection-mode.outputs.value != 'review' && steps.collection-mode.outputs.value != 'reviewed'
        env:
          MODE: ${{ steps.collection-mode.outputs.value }}
        run: uv run --frozen python scripts/run_pipeline.py --mode "$MODE"
      - name: Repair recent P4 Final Prospectus residuals
        env:
          MODE: ${{ steps.collection-mode.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODE" in
            maintenance|repair|p4)
              uv run --frozen python scripts/run_p4_offer_residuals.py --limit 30 --workers 4
              uv run --frozen python scripts/enforce_final_prospectus_policy.py
              uv run --frozen python scripts/record_integrity.py
              uv run --frozen python scripts/audit_data_completeness.py
              uv run --frozen python scripts/build_missing_queue.py
              uv run --frozen python scripts/validate_data.py --strict
              uv run --frozen python scripts/phase_status.py
              ;;
            *)
              echo "Skipping P4 Final Prospectus residual repair for $MODE mode"
              ;;
          esac
      - name: Prepare bounded reviewed corrections without source collection
        if: steps.collection-mode.outputs.value == 'reviewed'
        env:
          REVIEWED_IDS: ${{ inputs.reviewed_ids || '' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            REVIEWED_IDS="$(uv run --frozen python scripts/reviewed_request.py)"
            cp data/reviewed_publication_request.json /tmp/ipo-bundle/request.json
          fi
          uv run --frozen python scripts/reviewed_corrections.py --ids "$REVIEWED_IDS" --bundle /tmp/ipo-bundle
      - name: Prepare collected snapshot
        if: steps.collection-mode.outputs.value != 'reviewed'
        run: cp data/ipos.json /tmp/ipo-bundle/proposed.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ipo-collection-${{ github.run_id }}
          path: /tmp/ipo-bundle/
          retention-days: 14

  publish:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    concurrency:
      group: ipo-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ipo-collection-${{ github.run_id }}
          path: /tmp/ipo-bundle/
      - name: Merge, validate, and publish from current main
        env:
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ needs.collect.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ipo-tracker-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv sync --frozen
            if [[ "$MODE" == "presentation" ]]; then
              # Rebuild from current accepted data; no collector, correction,
              # proposal reconciliation or phase-state mutation on this path.
              uv run --frozen python scripts/validate_data.py --strict
              uv run --frozen python scripts/build_company_pages.py
              git diff --exit-code -- data/ipos.json
              node --test tests/public_quality.test.cjs
              git add data/ipos-summary.json ipo/
            else
              if [[ "$MODE" == "review" ]]; then
                # Rebuild only derived review/public artifacts from current main.
                # Never apply proposals, corrections, or run source collection.
                uv run --frozen python scripts/validate_data.py --strict
                uv run --frozen python scripts/build_missing_queue.py
                uv run --frozen python scripts/phase_status.py
                uv run --frozen python scripts/build_company_pages.py
                git diff --exit-code -- data/ipos.json data/pending_updates.json
                node --test tests/public_quality.test.cjs
                git add data/validation.json data/missing_queue.json data/phase_status.json data/ipos-summary.json ipo/
              else
                reviewed_args=()
                if [[ "$MODE" == "reviewed" ]]; then
                  reviewed_args=(--reviewed-manifest /tmp/ipo-bundle/reviewed.json)
                fi
                uv run --frozen python scripts/publish_transaction.py --base /tmp/ipo-bundle/base.json --proposed /tmp/ipo-bundle/proposed.json --run-id "$RUN_ID" --source-commit-file /tmp/ipo-bundle/source-commit.txt "${reviewed_args[@]}"
                if [[ "$MODE" != "reviewed" ]]; then
                  uv run --frozen python scripts/apply_corrections.py
                  uv run --frozen python scripts/enforce_final_prospectus_policy.py
                else
                  # The selected records were already corrected and policy-checked.
                  # Never apply unrelated corrections or rewrite pending proposals.
                  git diff --exit-code -- data/pending_updates.json
                fi
                uv run --frozen python scripts/validate_data.py --strict
                uv run --frozen python scripts/build_company_pages.py
                uv run --frozen python scripts/audit_data_completeness.py
                uv run --frozen python scripts/build_missing_queue.py
                uv run --frozen python scripts/phase_status.py
                uv run --frozen python scripts/build_performance_summary.py
                git add data/ ipo/ docs/DATA_QUALITY.md
              fi
            fi
            if git diff --cached --quiet; then
              echo 'No accepted data changes to publish'
              exit 0
            fi
            git commit -m "data: publish validated IPO $MODE output"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Publication remains in the retained collection artifact for retry'
          exit 1
      - name: Request Pages rebuild after bot publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
