name: Collect Hariom and Rainbow 2022 evidence
on:
  push:
    branches: [data/bse-2022-hariom-rainbow-20260927]
    paths: [.github/workflows/collect-bse-2022-hariom-rainbow.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch original official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs";import path from "node:path";import {createHash} from "node:crypto";import {execFileSync} from "node:child_process";
          const out=process.env.OUT,docs=[
            ["hariom_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/apr-2023/1681727071854.pdf"],
            ["hariom_track","https://www.sebi.gov.in/sebi_data/attachdocs/feb-2025/1738661250075.pdf"],
            ["rainbow_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/may-2022/1651665517350.pdf"]
          ],receipt=[];
          for(const[key,url]of docs){let last;for(let attempt=1;attempt<=3;attempt++){try{const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});if(!r.ok||!["www.sebi.gov.in","sebi.gov.in"].includes(new URL(r.url).hostname))throw Error("bad_"+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf");const pdf=path.join(out,key+".pdf"),txt=path.join(out,key+".txt");fs.writeFileSync(pdf,b);execFileSync("pdftotext",["-layout",pdf,txt]);receipt.push({key,source_url:url,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt});break}catch(e){last=e;if(attempt===3)throw e;await new Promise(r=>setTimeout(r,attempt*1500));}}}
          const pats=[/HARIOM PIPE INDUSTRIES LIMITED/i,/RAINBOW CHILDREN.?S MEDICARE LIMITED/i,/Issue Price.{0,180}/i,/Bid\/Offer Opens.{0,180}/i,/Bid\/Offer Closes.{0,180}/i,/Market Lot.{0,180}/i,/minimum bid.{0,180}/i,/April 13,?\s*2022/i,/May 10,?\s*2022/i];
          for(const key of ["hariom_prospectus","hariom_track","rainbow_prospectus"]){const t=fs.readFileSync(path.join(out,key+".txt"),"utf8").replace(/\s+/g," ");console.log("DOC",key);for(const p of pats){const m=t.match(p);if(m)console.log(m[0]);}}
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({schema_version:"1.0.0",status:"collected",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt},null,2)+"\n");
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: bse-2022-hariom-rainbow-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
