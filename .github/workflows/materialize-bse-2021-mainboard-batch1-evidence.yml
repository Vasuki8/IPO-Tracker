name: Materialize first BSE 2021 review evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/discovery/bse-2021-mainboard-batch1-review-2026-09-26.json"
      - "scripts/materialize-bse-2021-mainboard-batch1-evidence.mjs"
      - ".github/workflows/materialize-bse-2021-mainboard-batch1-evidence.yml"
permissions:
  contents: write
concurrency:
  group: bse-2021-mainboard-batch1-evidence
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: node scripts/test-bse-2021-mainboard-batch1-review.mjs
      - name: Fetch original official sources
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          node scripts/materialize-bse-2021-mainboard-batch1-evidence.mjs --evidence-dir="$RUNNER_TEMP/evidence" --receipt="$RUNNER_TEMP/receipt.json"
          cp "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/evidence/source-receipt-before-artifact.json"
      - name: Retain source bytes
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: bse-2021-mainboard-batch1-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Bind artifact and retain receipt
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file=process.env.RUNNER_TEMP+"/receipt.json",r=JSON.parse(fs.readFileSync(file));
          const digest=String(process.env.ARTIFACT_DIGEST||"");
          r.workflow_run_id=process.env.GITHUB_RUN_ID;
          r.workflow_artifact={artifact_id:Number(process.env.ARTIFACT_ID),artifact_digest:digest.startsWith("sha256:")?digest:"sha256:"+digest,artifact_url:process.env.ARTIFACT_URL,retention_days:14};
          fs.writeFileSync(file,JSON.stringify(r,null,2)+"\n");
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/evidence
            cp "$RUNNER_TEMP/receipt.json" data/evidence/bse-2021-mainboard-batch1-source-receipt-2026-09-26.json
            node scripts/materialize-bse-2021-mainboard-batch1-evidence.mjs --validate-receipt=data/evidence/bse-2021-mainboard-batch1-source-receipt-2026-09-26.json
            git add data/evidence/bse-2021-mainboard-batch1-source-receipt-2026-09-26.json
            git diff --cached --quiet && exit 0
            git commit -m "data(evidence): retain first BSE 2021 batch receipt"
            git push origin HEAD:main && exit 0
          done
          exit 1
