name: Collect Jetmall and Brandbucket official evidence
on:
  push:
    branches: [data/bse-2021-jetmall-brandbucket-20260927]
    paths: [.github/workflows/collect-jetmall-brandbucket.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch and validate official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs"; import path from "node:path"; import {createHash} from "node:crypto"; import {execFileSync} from "node:child_process";
          const out=process.env.OUT;
          const docs=[
            ["jetmall_draft","https://www.bseindia.com/corporates/download/331402/Jetmall_DP_Final_05%20.02.2021_20210206142321.pdf"],
            ["jetmall_final","https://www.sebi.gov.in/sebi_data/attachdocs/apr-2021/1617853574677.pdf"],
            ["jetmall_track","https://www.sebi.gov.in/sebi_data/attachdocs/jul-2023/1689936568009.pdf"],
            ["brandbucket_prospectus","https://www.bseindia.com/corporates/download/345649/SME_IPO%20Open/Brandbucket%20Prospectus_20211214155022.pdf"],
            ["brandbucket_track","https://www.sebi.gov.in/sebi_data/attachdocs/jun-2023/1687608017479_107.pdf"]
          ];
          const allowed=new Set(["www.bseindia.com","bseindia.com","www.sebi.gov.in","sebi.gov.in"]),receipt=[];
          for(const [key,url] of docs){
            let last;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});
                if(!r.ok||!allowed.has(new URL(r.url).hostname))throw Error("bad_"+r.status);
                const b=Buffer.from(await r.arrayBuffer());if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf");
                const pdf=path.join(out,key+".pdf"),txt=path.join(out,key+".txt");fs.writeFileSync(pdf,b);execFileSync("pdftotext",["-layout",pdf,txt]);
                receipt.push({key,source_url:url,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt});break;
              }catch(e){last=e;if(attempt===3)throw e;await new Promise(r=>setTimeout(r,attempt*1500));}
            }
          }
          const read=k=>fs.readFileSync(path.join(out,k+".txt"),"utf8").replace(/\s+/g," ");
          const jd=read("jetmall_draft"),jf=read("jetmall_final"),jt=read("jetmall_track"),bp=read("brandbucket_prospectus"),bt=read("brandbucket_track");
          const must=(x,m)=>{if(!x)throw Error(m)};
          must(/JETMALL SPICES AND MASALA LIMITED/i.test(jd)&&/INITIAL PUBLIC ISSUE/i.test(jd)&&/20\.00/.test(jd)&&/498\.00/.test(jd)&&/SME Platform of BSE/i.test(jd),"jetmall_draft_terms");
          must(/JETMALL SPICES AND MASALA LIMITED/i.test(jf),"jetmall_final_identity");
          must(/Jetmall Spices And Masala Limited/i.test(jt)&&/4\.98/.test(jt)&&/20/.test(jt)&&/April 19,?\s*2021/i.test(jt),"jetmall_track_terms");
          must(/BRANDBUCKET MEDIA & TECHNOLOGY LIMITED/i.test(bp)&&/PUBLIC ISSUE/i.test(bp)&&/55\.00/.test(bp)&&/825\.00/.test(bp)&&/SME Platform of BSE/i.test(bp),"brandbucket_prospectus_terms");
          must(/Monday, December 20, 2021/i.test(bp)&&/Thursday, December 23, 2021/i.test(bp),"brandbucket_offer_dates");
          must(/Brandbucket Media & Technology Limited/i.test(bt)&&/8\.25/.test(bt)&&/55/.test(bt)&&/December 31,?\s*2021/i.test(bt),"brandbucket_track_terms");
          const result={schema_version:"1.0.0",status:"complete",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt};
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify({documents:receipt.length,bytes:result.total_response_bytes,hashes:receipt.map(d=>[d.key,d.response_sha256])}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: jetmall-brandbucket-original-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
