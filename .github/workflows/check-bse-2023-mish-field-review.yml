name: Validate Mish Designs semantic review

on:
  pull_request:
    paths:
      - 'data/discovery/bse-2023-mish-field-review-2026-10-05.json'
      - 'data/evidence/bse-2023-mish-bse-prospectus-rejection-2026-10-05.json'
      - 'scripts/check-bse-2023-mish-field-review.mjs'
      - 'scripts/test-bse-2023-mish-field-review.mjs'
      - '.github/workflows/check-bse-2023-mish-field-review.yml'
  push:
    branches:
      - work/bse-2023-mish-semantic-review-20261005
    paths:
      - 'data/discovery/bse-2023-mish-field-review-2026-10-05.json'
      - 'data/evidence/bse-2023-mish-bse-prospectus-rejection-2026-10-05.json'
      - 'scripts/check-bse-2023-mish-field-review.mjs'
      - 'scripts/test-bse-2023-mish-field-review.mjs'
      - '.github/workflows/check-bse-2023-mish-field-review.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test semantic-review invariants
        run: node scripts/test-bse-2023-mish-field-review.mjs
      - name: Check current reviewed state
        run: |
          node scripts/check-bse-2023-mish-field-review.mjs
          node scripts/check-bse-2023-progress.mjs
          node scripts/check-bse-2022-disposition.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code
