name: Collect IMRS listing corroboration
on:
  push:
    branches: [data/bse-2023-imrs-20260928]
    paths: [.github/workflows/collect-bse-2023-imrs-listing.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retain original exchange-hosted annual reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/imrs-listing"
          OUT="$RUNNER_TEMP/imrs-listing" python3 - <<'PY'
          import os,json,hashlib,subprocess,datetime,concurrent.futures
          from pathlib import Path
          from urllib.parse import urlparse
          out=Path(os.environ['OUT'])
          sources=[
            ('ireda_annual','https://archives.nseindia.com/annual_reports/AR_24062_IREDA_2023_2024_31052024172229.pdf'),
            ('motisons_annual','https://www.bseindia.com/xml-data/corpfiling/AttachHis/5f411b58-ae46-4f75-b78b-640b764e4c5c.pdf'),
            ('rbz_annual','https://www.bseindia.com/xml-data/corpfiling/AttachHis/93f14563-62ed-4d9e-be2f-f3d927469ec3.pdf'),
            ('shelter_annual','https://www.bseindia.com/xml-data/corpfiling/AttachHis/0ceaf6d3-9fbe-4d1c-97c8-0adb21413c0c.pdf')]
          def collect(pair):
            key,url=pair;file=out/(key+'.pdf');started=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
            result=subprocess.run(['curl','--fail','--location','--retry','2','--retry-all-errors','--connect-timeout','15','--max-time','100','--user-agent','Mozilla/5.0','--output',str(file),'--write-out','%{http_code}\n%{url_effective}',url],capture_output=True,text=True)
            if result.returncode:return {'key':key,'source_url':url,'error':result.stderr[-1200:]}
            status,final=result.stdout.strip().split('\n')[-2:];b=file.read_bytes()
            if status!='200' or urlparse(final).hostname not in ['www.bseindia.com','archives.nseindia.com'] or not b.startswith(b'%PDF-'):raise ValueError('unexpected response '+key)
            return {'key':key,'source_url':url,'final_url':final,'http_status':200,'requested_at':started,'collected_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'response_bytes':len(b),'response_sha256':hashlib.sha256(b).hexdigest(),'file':file.name}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:docs=list(pool.map(collect,sources))
          receipt={'schema_version':'1.0.0','status':'collected_unreviewed','workflow_run_id':os.environ['GITHUB_RUN_ID'],'documents':docs,'total_response_bytes':sum(d.get('response_bytes',0) for d in docs)}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2023-imrs-listing-source
          path: ${{ runner.temp }}/imrs-listing
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
