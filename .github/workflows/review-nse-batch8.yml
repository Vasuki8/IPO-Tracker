name: Review pinned NSE universe batch8
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-nse-batch8.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retain exact source revision
        run: |
          mkdir -p "$RUNNER_TEMP/nse-batch8"
          git archive --format=zip HEAD > "$RUNNER_TEMP/nse-batch8/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/nse-batch8/source-commit.txt"
      - name: Collect bounded official evidence without importing
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const out=path.join(process.env.RUNNER_TEMP,'nse-batch8');
          const input='data/discovery/ipo-universe-review-2026-09-25-batch8.json';
          const bytes=fs.readFileSync(input), queue=JSON.parse(bytes);
          assert.equal(queue.auto_import_allowed,false);
          assert.equal(queue.candidates.length,14);
          assert.equal(queue.candidates[0].nse_symbol,'SUMAX');
          assert.equal(queue.candidates.at(-1).nse_symbol,'SPECTRAA');
          assert.equal(new Set(queue.candidates.map(c=>c.nse_symbol)).size,14);
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const headers={'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','accept':'application/json,text/plain,*/*','referer':'https://www.nseindia.com/market-data/all-upcoming-issues-ipo'};
          try {
            const r=await fetch(headers.referer,{headers,signal:AbortSignal.timeout(20000)});
            if(r.ok) headers.cookie=(r.headers.getSetCookie?.()||[]).map(v=>v.split(';')[0]).join('; ');
          } catch(e) { console.log('Landing unavailable:',e.message); }
          const rows=[];
          async function get(url,file,nse=true) {
            const requested_at=new Date().toISOString();
            try {
              const r=await fetch(url,{headers:nse?headers:{'user-agent':headers['user-agent']},signal:AbortSignal.timeout(30000)});
              const body=Buffer.from(await r.arrayBuffer());
              fs.writeFileSync(path.join(out,file),body);
              return {url,final_url:r.url,status:r.status,content_type:r.headers.get('content-type'),requested_at,collected_at:new Date().toISOString(),file,sha256:hash(body),bytes:body.length};
            } catch(e) { return {url,requested_at,collected_at:new Date().toISOString(),error:String(e.message)}; }
          }
          rows.push({kind:'past',...await get('https://www.nseindia.com/api/public-past-issues','past.json')});
          for(const c of queue.candidates) {
            const s=c.nse_symbol,series=c.board==='SME'?'SME':'EQ';
            assert.match(s,/^[A-Z0-9-]+$/);
            rows.push({symbol:s,kind:'ipo_detail',...await get('https://www.nseindia.com/api/ipo-detail?symbol='+encodeURIComponent(s)+'&series='+series,s+'-ipo.json')});
            await new Promise(r=>setTimeout(r,180));
          }
          rows.push({symbol:'DOLLEX',kind:'migration_approval',...await get('https://nsearchives.nseindia.com/corporate/DOLLEX_09092026163743_CoverletterApprovalsigned.pdf','DOLLEX-migration-approval.pdf',false)});
          rows.push({symbol:'13DCCL28',kind:'debt_listing_circular',...await get('https://nsearchives.nseindia.com/content/circulars/CML76341.pdf','13DCCL28-CML76341.pdf',false)});
          rows.push({symbol:'DCCL',kind:'equity_ipo_identity',...await get('https://www.nseindia.com/api/ipo-detail?symbol=DCCL&series=SME','DCCL-equity-ipo.json')});
          rows.push({kind:'deployed_baseline',...await get('https://vasuki8.github.io/IPO-Tracker/data/ipos.json?batch8='+process.env.GITHUB_RUN_ID,'deployed-baseline.json',false)});
          fs.writeFileSync(path.join(out,'sources.json'),JSON.stringify({schema_version:'1.0.0',generated_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,source_commit_sha:process.env.GITHUB_SHA,input:{path:input,sha256:hash(bytes)},rows},null,2)+'\n');
          console.log(JSON.stringify(rows.map(({symbol,kind,status,bytes,error})=>({symbol,kind,status,bytes,error})),null,2));
          JS
      - name: Prove production data was not modified
        run: git diff --exit-code -- data ops assets
      - name: Retain original responses including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-universe-batch8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nse-batch8
          retention-days: 14
          if-no-files-found: error
