name: Collect four-issuer post-listing supplement
on:
  push:
    branches: [data/bse-2023-four-mainboard-20260928]
    paths: [.github/workflows/collect-bse-2023-four-supplement.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Collect original BSE annual reports
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          OUT="$RUNNER_TEMP/evidence" python3 - <<'PY'
          import os,re,json,pathlib,subprocess,hashlib,datetime,urllib.parse
          out=pathlib.Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True); docs=[]; errors=[]
          def now(): return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          sources=[('global_annual','https://www.bseindia.com/xml-data/corpfiling/AttachHis/a0e33ebb-fe90-4b75-95b8-d11e2c4f4849.pdf'),('pyramid_annual','https://www.bseindia.com/xml-data/corpfiling/AttachHis/2c4f059f-e21b-4b68-b581-fbf7333e5aa6.pdf')]
          for key,url in sources:
              try:
                  requested=now(); dest=out/(key+'.pdf')
                  r=subprocess.run(['curl','--fail','--location','--retry','2','--retry-all-errors','--retry-delay','2','--connect-timeout','15','--max-time','150','--user-agent','Mozilla/5.0','--dump-header',str(out/(key+'.headers')),'--output',str(dest),'--write-out','%{http_code}\n%{url_effective}',url],capture_output=True,text=True)
                  if r.returncode: raise RuntimeError(key+': '+r.stderr[-240:])
                  status,final=r.stdout.strip().split('\n')[-2:]
                  if status!='200' or urllib.parse.urlparse(final).hostname!='www.bseindia.com': raise RuntimeError('invalid status/host '+key)
                  b=dest.read_bytes()
                  if not b.startswith(b'%PDF-'): raise RuntimeError('not_pdf '+key)
                  info=subprocess.check_output(['pdfinfo',str(dest)],text=True)
                  pages=int(re.search(r'Pages:\s+(\d+)',info).group(1)); subprocess.run(['pdftotext','-layout',str(dest),str(out/(key+'.txt'))],check=True)
                  docs.append(dict(key=key,source_url=url,final_url=final,http_status=200,requested_at=requested,collected_at=now(),response_bytes=len(b),response_sha256=hashlib.sha256(b).hexdigest(),pdf_pages=pages,file=dest.name))
              except Exception as e: errors.append(str(e))
          receipt=dict(schema_version='1.0.0',status='collected' if not errors else 'partial',workflow_run_id=os.environ['GITHUB_RUN_ID'],documents=docs,errors=errors,collection_completed_at=now(),total_response_bytes=sum(d['response_bytes'] for d in docs))
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n'); print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2023-four-mainboard-supplement
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
