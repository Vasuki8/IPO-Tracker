name: Materialize NSE DRHP source snapshot
on:
  push:
    branches: ["fix/drhp-pre-ipo-lifecycle-20260926"]
    paths:
      - "scripts/sync-nse-drhp-offers.mjs"
      - "scripts/nse-drhp-integrity.mjs"
      - "scripts/test-sync-nse-drhp-offers.mjs"
      - "scripts/test-nse-drhp-integrity.mjs"
      - ".github/workflows/materialize-nse-drhp-source.yml"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test collector contracts
        run: |
          node scripts/test-sync-nse-drhp-offers.mjs
          node scripts/test-nse-drhp-integrity.mjs
      - name: Collect official NSE draft filings
        run: node scripts/sync-nse-drhp-offers.mjs --year=2026 --output="$RUNNER_TEMP/incoming.json"
      - name: Materialize source-backed snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/nse-drhp-filings.json ]; then
            node scripts/nse-drhp-integrity.mjs --current=data/nse-drhp-filings.json --incoming="$RUNNER_TEMP/incoming.json" --output=data/nse-drhp-filings.json
          else
            cp "$RUNNER_TEMP/incoming.json" data/nse-drhp-filings.json
          fi
          git add data/nse-drhp-filings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): retain NSE DRHP source snapshot"
          git push origin HEAD:fix/drhp-pre-ipo-lifecycle-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nse-drhp-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/incoming.json
            data/nse-drhp-filings.json
          retention-days: 14
          if-no-files-found: warn
