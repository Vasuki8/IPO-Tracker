name: Verify public release

on:
  pull_request:
    paths:
      - 'tests/verify_public_release.py'
      - 'tests/test_public_release_verifier.py'
      - 'tests/verify_review_release.py'
      - 'tests/test_review_release_delivery.py'
      - 'tests/review_release_candidate.py'
      - 'tests/test_review_release_candidate.py'
      - '.github/workflows/public-release.yml'
  workflow_run:
    # Built-in Pages uses this workflow identifier; retain the display-name
    # alias for compatibility. Do not infer acceptance from the Pages job alone.
    workflows: ['pages-build-deployment', 'pages build and deployment']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Retain independent previous accepted state
        run: git show HEAD^:data/ipos.json > /tmp/ipo-release-accepted.json
      - name: Test release verification
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p 'test_*release*.py' -v
      - name: Prepare isolated PR review output
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          mkdir -p artifacts/public-release
          candidate="$RUNNER_TEMP/ipo-review-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          uv run --frozen python tests/review_release_candidate.py --destination "$candidate" --expected-commit "$(git rev-parse HEAD)" > artifacts/public-release/candidate-context.json
          echo "RELEASE_ROOT=$candidate" >> "$GITHUB_ENV"
      - name: Verify candidate or immutable deployed output
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYMENT_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-release
          sha="$(git rev-parse HEAD)"
          root="${RELEASE_ROOT:-$PWD}"
          prefix=''
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            test "$sha" = "$DEPLOYED_SHA"
            test "$root" = "$PWD"
            base='https://vasuki8.github.io/IPO-Tracker/'
            printf '%s\n' "$DEPLOYMENT_RUN" > artifacts/public-release/deployment-run.txt
          else
            test -f artifacts/public-release/candidate-context.json
            prefix='candidate-'
            base='http://127.0.0.1:8000/'
            python3 -m http.server 8000 --bind 127.0.0.1 --directory "$root" > artifacts/public-release/server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          fi
          # Deployed output is never rebuilt. PR output is explicitly a local
          # review-publisher rehearsal, with source/input/output hashes retained.
          # Bounded retries do not reinterpret mismatched bytes as success.
          for attempt in 1 2 3; do
            receipt="artifacts/public-release/${prefix}attempt-$attempt.json"
            if uv run --frozen python tests/verify_review_release.py --root "$root" --expected-commit "$sha" --base-url "$base" --accepted-baseline /tmp/ipo-release-accepted.json > "$receipt"; then
              cat "$receipt"
              git diff --exit-code
              exit 0
            fi
            cat "$receipt"
            if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
          done
          exit 1
      - name: Retain release receipt, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: public-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-release/
          retention-days: 14
