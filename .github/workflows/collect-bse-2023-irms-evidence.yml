name: Collect next BSE 2023 source evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/discovery/bse-2023-irms-source-plan-2026-09-28.json'
      - 'scripts/collect-bse-2023-irms-evidence.mjs'
      - 'scripts/test-bse-2023-irms-evidence.mjs'
      - 'scripts/test-bse-2023-irms-handoff.mjs'
      - 'data/evidence/bse-2023-irms-source-receipt-2026-09-28.json'
      - '.github/workflows/collect-bse-2023-irms-evidence.yml'
permissions:
  contents: read
concurrency:
  group: bse-2023-irms-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run every non-browser test entry point
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/irms-tests"
          failures=0
          count=0
          for file in scripts/test-*.mjs; do
            [ "$(basename "$file")" = 'test-ui.mjs' ] && continue
            count=$((count + 1))
            if timeout 90 node "$file" > "$RUNNER_TEMP/irms-tests/$(basename "$file").log" 2>&1; then
              echo "PASS $file"
            else
              failures=$((failures + 1))
              echo "FAIL $file"
              cat "$RUNNER_TEMP/irms-tests/$(basename "$file").log"
            fi
          done
          printf 'Non-browser test entry points: %s; failures: %s\n' "$count" "$failures" | tee "$RUNNER_TEMP/irms-tests/summary.txt"
          test "$count" -gt 0
          test "$failures" -eq 0
      - name: Validate retained progress and current publication
        run: |
          node scripts/check-bse-2023-progress.mjs
          node scripts/check-bse-2022-disposition.mjs
          node scripts/check-retained-bse-snapshot.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-2023-irms-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/irms-tests
          retention-days: 14
          if-no-files-found: error
  sources:
    # External collection health is separate from deterministic PR checks.
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect original SEBI responses without importing records
        run: node scripts/collect-bse-2023-irms-evidence.mjs --out="$RUNNER_TEMP/irms-evidence"
      - name: Verify retained response bytes
        run: |
          node scripts/collect-bse-2023-irms-evidence.mjs --validate-dir="$RUNNER_TEMP/irms-evidence"
          git diff --exit-code
      - name: Retain complete or partial collection
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: bse-2023-irms-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/irms-evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Record archive identity
        if: always() && steps.evidence.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'Source artifact: %s\nDigest: %s\nURL: %s\nPublication import allowed: false\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
