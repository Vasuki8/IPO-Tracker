name: Retain Ratnaveer listing notice
on:
  push:
    branches: [data/bse-2023-ratnaveer-valiant-esaf-plaza-20260928]
    paths: [.github/workflows/collect-ratnaveer-notice.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retain official listing bytes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          export OUT="$RUNNER_TEMP/evidence"
          python - <<'PY'
          import os,json,hashlib,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          out=Path(os.environ['OUT']);now=lambda:datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          u='https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20230908-27';start=now();p=out/'ratnaveer_notice.html'
          x=subprocess.run(['curl','-fL','--retry','2','--max-time','45','--user-agent','Mozilla/5.0','-o',str(p),'-w','%{http_code}\n%{url_effective}',u],capture_output=True,text=True,check=True)
          status,final=x.stdout.strip().splitlines()[-2:];assert status=='200' and final==u
          b=p.read_bytes();assert b'Ratnaveer' in b or b'RATNAVEER' in b
          d={'key':'ratnaveer_notice','source_url':u,'final_url':final,'http_status':200,'requested_at':start,'collected_at':now(),'file':p.name,'response_bytes':len(b),'response_sha256':hashlib.sha256(b).hexdigest()}
          (out/'receipt.json').write_text(json.dumps({'schema_version':'1.0.0','workflow_run_id':os.environ['GITHUB_RUN_ID'],'documents':[d],'collection_completed_at':now()},indent=2)+'\n')
          print(json.dumps(d))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ratnaveer-official-listing-notice
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error
