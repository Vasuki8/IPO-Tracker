name: Probe P2 lot-size layouts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-lot-layouts.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Inspect official full offer-document lot wording
        shell: bash
        run: |
          uv run python - <<'PY'
          import io,re,requests,sys
          from pypdf import PdfReader
          sys.path.insert(0,'scripts')
          import update_data as core
          import enrich_sebi_document_links as links

          pages={
            'ANNU':'https://www.sebi.gov.in/filings/public-issues/aug-2026/annu-projects-limited-prospectus_104111.html',
            'SKYWAYS':'https://www.sebi.gov.in/filings/public-issues/aug-2026/skyways-air-services-limited-prospectus_104108.html',
            'DEEPA':'https://www.sebi.gov.in/filings/public-issues/aug-2026/deepa-jewellers-limited-rhp_104030.html',
            'KANOHAR':'https://www.sebi.gov.in/filings/public-issues/sep-2026/kanohar-electricals-limited-rhp_104224.html',
            'KARAMTARA':'https://www.sebi.gov.in/filings/public-issues/sep-2026/karamtara-engineering-limited-rhp_103407.html',
            'ARCIL':'https://www.sebi.gov.in/filings/public-issues/sep-2026/asset-reconstruction-company-india-limited-rhp_104202.html',
          }
          s=requests.Session(); s.headers.update(core.HEADERS)
          patterns=[
            re.compile(r'.{0,220}\bBid\s+Lot\b.{0,320}',re.I|re.S),
            re.compile(r'.{0,220}\bminimum\b.{0,180}\bEquity\s+Shares\b.{0,240}',re.I|re.S),
            re.compile(r'.{0,180}\bEquity\s+Shares\b.{0,160}\bmultiples?\b.{0,220}',re.I|re.S),
            re.compile(r'.{0,220}\bMarket\s+Lot\b.{0,260}',re.I|re.S),
          ]
          for name,url in pages.items():
              print('\n===',name,'===')
              r=s.get(url,timeout=30); r.raise_for_status()
              docs=links.extract_pdf_links(r.text,url,fallback_type='PROSPECTUS' if 'prospectus_' in url else 'RHP')
              full=[d for d in docs if 'ABRIDGED' not in (d.get('title') or '').upper() and 'AP_' not in (d.get('url') or '').upper()]
              print('DOCS',docs)
              if not full:
                  print('NO_FULL_PDF'); continue
              pdf=s.get(full[0]['url'],timeout=60); pdf.raise_for_status()
              print('PDF',full[0]['url'],'BYTES',len(pdf.content))
              reader=PdfReader(io.BytesIO(pdf.content))
              print('PAGES',len(reader.pages))
              hits=0
              for i,page in enumerate(reader.pages[:40]):
                  text=' '.join((page.extract_text() or '').split())
                  if not text: continue
                  for pat in patterns:
                      for m in pat.finditer(text):
                          snippet=' '.join(m.group(0).split())
                          print('PAGE',i+1,'HIT',snippet[:700])
                          hits+=1
                          if hits>=12: break
                      if hits>=12: break
                  if hits>=12: break
              print('HITS',hits)
          PY
