name: Probe P2 prospectus lot layouts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-lot-layouts.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Compare verified SEBI TLS paths
        shell: bash
        run: |
          URL="https://www.sebi.gov.in/sebi_data/attachdocs/sep-2026/1788759187148.pdf"
          ALT="https://sebi.gov.in/sebi_data/attachdocs/sep-2026/1788759187148.pdf"
          echo '=== curl www ==='
          curl -I -L --max-time 25 -A 'Mozilla/5.0' "$URL" || true
          echo '=== curl bare ==='
          curl -I -L --max-time 25 -A 'Mozilla/5.0' "$ALT" || true
          echo '=== python certifi/system ==='
          uv run python - <<'PY'
          import requests, certifi
          urls=[
            'https://www.sebi.gov.in/sebi_data/attachdocs/sep-2026/1788759187148.pdf',
            'https://sebi.gov.in/sebi_data/attachdocs/sep-2026/1788759187148.pdf',
          ]
          for url in urls:
            for verify in (certifi.where(), '/etc/ssl/certs/ca-certificates.crt'):
              try:
                r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.sebi.gov.in/'},stream=True,timeout=25,verify=verify)
                print(url,verify,'HTTP',r.status_code,'ctype',r.headers.get('content-type'),'len',r.headers.get('content-length'))
                r.close()
              except Exception as e:
                print(url,verify,'ERROR',type(e).__name__,str(e)[:260])
          PY

      - name: Download one prospectus with curl and inspect real lot layout
        shell: bash
        run: |
          URL="https://www.sebi.gov.in/sebi_data/attachdocs/sep-2026/1788759187148.pdf"
          curl -fL --retry 3 --retry-all-errors --max-time 90 -A 'Mozilla/5.0' -H 'Referer: https://www.sebi.gov.in/' "$URL" -o /tmp/deepa.pdf
          uv run python - <<'PY'
          import re
          from pypdf import PdfReader
          import scripts.enrich_recent_offer_terms as terms
          reader=PdfReader('/tmp/deepa.pdf')
          texts=[]
          for i,page in enumerate(reader.pages[:100]):
            text=page.extract_text() or ''
            texts.append(text)
            flat=re.sub(r'\s+',' ',text)
            for m in re.finditer(r'(?i)(?:bid\s+lot|minimum\s+(?:bid|application)|application\s+lot|minimum\s+order)',flat):
              print('PAGE',i+1,flat[max(0,m.start()-220):m.start()+700])
          print('LOT35',terms.extract_lot_size('\n'.join(texts[:35])))
          print('LOT100',terms.extract_lot_size('\n'.join(texts)))
          PY
