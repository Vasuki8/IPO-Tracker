name: Validate P2 SEBI terms backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-sebi-backfill.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Test dedicated SEBI register discovery
        run: uv run python -m unittest discover -s tests -p "test_sebi_priority_registers.py" -v
      - name: Test SEBI GET-search fallback
        run: uv run python -m unittest discover -s tests -p "test_sebi_priority_registers_v2.py" -v
      - name: Test recent offer-term parser
        run: uv run python -m unittest discover -s tests -p "test_recent_offer_terms.py" -v
      - name: Preview P2 register discovery and terms extraction
        shell: bash
        run: |
          echo '=== BASELINE ==='
          uv run python - <<'PY'
          import json
          from collections import Counter
          q=json.load(open('data/missing_queue.json'))
          p2=[x for x in q['queue'] if x.get('priority')==2]
          print('P2_COUNT',len(p2))
          print('P2_GAPS',dict(Counter(f for x in p2 for f in x.get('missingFields',[]))))
          PY

          uv run python scripts/enrich_sebi_priority_registers_v2.py --priority-max 2 --search-limit 30
          uv run python scripts/enrich_sebi_document_links.py --priority-max 2 --limit 0
          uv run python scripts/enrich_recent_offer_terms.py --priority-max 2 --limit 0
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          echo '=== PREVIEW RESULT ==='
          uv run python - <<'PY'
          import json
          from collections import Counter
          q=json.load(open('data/missing_queue.json'))
          p2=[x for x in q['queue'] if x.get('priority')==2]
          print('P2_COUNT',len(p2))
          print('P2_GAPS',dict(Counter(f for x in p2 for f in x.get('missingFields',[]))))
          for x in p2:
              print(x['id'],'|',x['company'],'|',','.join(x.get('missingFields',[])))
          d=json.load(open('data/ipos.json'))
          health=(d.get('meta') or {}).get('sourceHealth') or {}
          print('REGISTER_HEALTH',json.dumps(health.get('SEBI-priority-registers'),default=str))
          print('LINK_HEALTH',json.dumps(health.get('SEBI-document-links'),default=str))
          print('TERMS_HEALTH',json.dumps(health.get('SEBI-offer-terms'),default=str))
          PY
