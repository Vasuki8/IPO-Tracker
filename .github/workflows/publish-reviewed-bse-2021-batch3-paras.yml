name: Publish reviewed BSE 2021 Paras Defence
on:
  pull_request:
    branches: [main]
    paths: ["data/discovery/bse-2021-batch3-paras-review-2026-09-27.json","data/evidence/bse-2021-batch3-paras-source-receipt-2026-09-27.json","data/verified-bse-listings/2026-09-27-bse-2021-batch3-paras.json","scripts/*bse-2021-batch3-paras*",".github/workflows/publish-reviewed-bse-2021-batch3-paras.yml"]
  push:
    branches: [main]
    paths: ["data/verified-bse-listings/2026-09-27-bse-2021-batch3-paras.json","scripts/*bse-2021-batch3-paras*",".github/workflows/publish-reviewed-bse-2021-batch3-paras.yml"]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: |
          node scripts/test-reviewed-bse-2021-batch3-paras.mjs
          node scripts/apply-reviewed-bse-2021-batch3-paras.mjs --apply
          node scripts/build-published-data.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          node scripts/test-reviewed-bse-2021-batch3-paras.mjs
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            node scripts/test-reviewed-bse-2021-batch3-paras.mjs
            node scripts/apply-reviewed-bse-2021-batch3-paras.mjs --apply
            node scripts/build-published-data.mjs; node scripts/build-published-data.mjs --check; node scripts/validate-data.mjs
            node scripts/test-reviewed-bse-2021-batch3-paras.mjs
            git add data/recovery/2021/nse-issue-information.json data/ipos.json
            git diff --cached --quiet && exit 0
            git commit -m "data: publish reviewed Paras Defence 2021 IPO"
            git push origin HEAD:main && exit 0
          done
          exit 1
