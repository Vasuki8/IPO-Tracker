name: Backfill historical IPO offer dates

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/backfill-historical-offer-dates.mjs"
      - "scripts/test-backfill-historical-offer-dates.mjs"
      - "scripts/apply-historical-offer-date-state.mjs"
      - "scripts/test-apply-historical-offer-date-state.mjs"
      - "scripts/historical-batch-selection.mjs"
      - "scripts/test-historical-batch-selection.mjs"
      - ".github/workflows/backfill-historical-offer-dates.yml"

permissions:
  contents: write

concurrency:
  group: historical-offer-date-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PDF text extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Test historical SEBI offer-date parser
        run: node scripts/test-backfill-historical-offer-dates.mjs

      - name: Backfill historical SEBI offer dates
        run: node scripts/backfill-historical-offer-dates.mjs

      - name: Test semantic historical offer-date merge
        run: node scripts/test-apply-historical-offer-date-state.mjs

      - name: Save semantic offer-date proposal
        id: proposal
        shell: bash
        run: |
          if [ ! -f ops/sebi-historical-offer-dates.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No historical offer-date proposal was produced."
            exit 0
          fi
          cp ops/sebi-historical-offer-dates.json /tmp/sebi-historical-offer-dates-proposal.json
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish semantic offer-date results
        if: steps.proposal.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Semantic publication attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            # Remove any untracked cursor left from the stale checkout; tracked
            # state, if present on latest main, is restored by reset above.
            if ! git ls-files --error-unmatch ops/sebi-historical-offer-dates.json >/dev/null 2>&1; then
              rm -f ops/sebi-historical-offer-dates.json
            fi

            node scripts/apply-historical-offer-date-state.mjs --input=/tmp/sebi-historical-offer-dates-proposal.json
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs

            if [ -z "$(git status --porcelain -- data/recovery data/ipos.json ops/sebi-historical-offer-dates.json)" ]; then
              echo "Latest main already contains all semantic offer-date results."
              exit 0
            fi

            git add data/recovery data/ipos.json
            if [ -f ops/sebi-historical-offer-dates.json ]; then
              git add ops/sebi-historical-offer-dates.json
            fi
            git commit -m "chore(data): backfill historical offer dates"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main advanced during publication; retrying semantic apply."
          done

          echo "Failed to publish semantic offer-date results after 3 attempts." >&2
          exit 1
