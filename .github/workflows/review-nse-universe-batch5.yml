name: Review pinned NSE universe batch5
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths: ['.github/workflows/review-nse-universe-batch5.yml']
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'backend/nse-universe-batch5-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retain source revision and queue before collection
        run: |
          mkdir -p "$RUNNER_TEMP/nse-batch5"
          git archive --format=zip HEAD > "$RUNNER_TEMP/nse-batch5/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/nse-batch5/source-commit.txt"
      - name: Collect issuer-specific official responses read-only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const out=path.join(process.env.RUNNER_TEMP,'nse-batch5');
          const input='data/discovery/ipo-universe-review-2026-09-25-batch5.json';
          const bytes=fs.readFileSync(input), queue=JSON.parse(bytes);
          assert.equal(queue.auto_import_allowed,false);
          assert.equal(queue.candidates.length,15);
          assert.equal(queue.candidates[0].nse_symbol,'TEJA');
          assert.equal(queue.candidates.at(-1).nse_symbol,'JNPR');
          assert.equal(new Set(queue.candidates.map(c=>c.nse_symbol)).size,15);
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const headers={'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','accept':'application/json,text/plain,*/*','referer':'https://www.nseindia.com/market-data/all-upcoming-issues-ipo'};
          try {
            const landing=await fetch(headers.referer,{headers,signal:AbortSignal.timeout(20000)});
            if(landing.ok) headers.cookie=(landing.headers.getSetCookie?.()||[]).map(v=>v.split(';')[0]).join('; ');
          } catch(e) { console.log('Landing unavailable:',e.message); }
          const rows=[];
          async function get(url,file,useNseHeaders=true) {
            const requested_at=new Date().toISOString();
            try {
              const r=await fetch(url,{headers:useNseHeaders?headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(30000)});
              const body=Buffer.from(await r.arrayBuffer());
              fs.writeFileSync(path.join(out,file),body);
              return {url,final_url:r.url,status:r.status,content_type:r.headers.get('content-type'),requested_at,collected_at:new Date().toISOString(),file,sha256:hash(body),bytes:body.length};
            } catch(e) {return {url,requested_at,collected_at:new Date().toISOString(),error:String(e.message)};}
          }
          rows.push({kind:'past',...await get('https://www.nseindia.com/api/public-past-issues','past.json')});
          for(const c of queue.candidates) {
            const s=c.nse_symbol,series=c.board==='SME'?'SME':'EQ';
            assert.match(s,/^[A-Z0-9-]+$/);
            const row={symbol:s,kind:'ipo_detail',...await get('https://www.nseindia.com/api/ipo-detail?symbol='+encodeURIComponent(s)+'&series='+series,s+'-ipo.json')};
            rows.push(row); console.log(JSON.stringify(row));
            await new Promise(r=>setTimeout(r,200));
          }
          rows.push({kind:'deployed_baseline',...await get('https://vasuki8.github.io/IPO-Tracker/data/ipos.json?batch5='+process.env.GITHUB_RUN_ID,'deployed-baseline.json',false)});
          fs.writeFileSync(path.join(out,'sources.json'),JSON.stringify({schema_version:'1.0.0',generated_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,source_commit_sha:fs.readFileSync(path.join(out,'source-commit.txt'),'utf8').trim(),input:{path:input,sha256:hash(bytes)},rows},null,2)+'\n');
          console.log(JSON.stringify(rows.map(({symbol,kind,status,bytes,error})=>({symbol,kind,status,bytes,error})),null,2));
          JS
      - name: Prove production data was unchanged
        run: git diff --exit-code -- data ops assets
      - name: Retain responses including collection failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-universe-batch5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nse-batch5
          retention-days: 14
          if-no-files-found: error
