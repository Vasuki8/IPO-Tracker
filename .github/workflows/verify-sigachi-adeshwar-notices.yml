name: Verify Sigachi and Adeshwar BSE notices
on:
  push:
    branches: [data/bse-2021-sigachi-adeshwar-20260927]
    paths:
      - "data/discovery/bse-listing-candidates-sigachi-adeshwar-2026-09-27.json"
      - ".github/workflows/verify-sigachi-adeshwar-notices.yml"
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: node scripts/verify-bse-listing-candidates.mjs --input=data/discovery/bse-listing-candidates-sigachi-adeshwar-2026-09-27.json --output="$RUNNER_TEMP/verified.json" || status=$?\n          cat "$RUNNER_TEMP/verified.json"\n          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: sigachi-adeshwar-verified-notices
          path: ${{ runner.temp }}/verified.json
          retention-days: 14

