name: Publish first reviewed BSE 2021 batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/verified-bse-listings/2026-09-26-bse-2021-mainboard-batch1.json"
      - "scripts/apply-reviewed-bse-2021-mainboard-batch1.mjs"
      - "scripts/test-reviewed-bse-2021-mainboard-batch1-import.mjs"
      - ".github/workflows/publish-reviewed-bse-2021-mainboard-batch1.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/verified-bse-listings/2026-09-26-bse-2021-mainboard-batch1.json"
      - "scripts/*bse-2021-mainboard-batch1*"
      - ".github/workflows/publish-reviewed-bse-2021-mainboard-batch1.yml"
permissions:
  contents: read
concurrency:
  group: bse-2021-mainboard-batch1-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: |
          node scripts/test-bse-2021-mainboard-batch1-review.mjs
          node scripts/test-reviewed-bse-2021-mainboard-batch1-import.mjs
          node scripts/apply-reviewed-bse-2021-mainboard-batch1.mjs --check
          node scripts/apply-reviewed-bse-2021-mainboard-batch1.mjs --apply
          node scripts/build-published-data.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          node scripts/test-reviewed-bse-2021-mainboard-batch1-import.mjs
  publish:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Recompute and publish on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/test-bse-2021-mainboard-batch1-review.mjs
            node scripts/test-reviewed-bse-2021-mainboard-batch1-import.mjs
            node scripts/apply-reviewed-bse-2021-mainboard-batch1.mjs --apply
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs
            node scripts/test-reviewed-bse-2021-mainboard-batch1-import.mjs
            git add data/recovery/2021/nse-issue-information.json data/ipos.json
            git diff --cached --quiet && exit 0
            git commit -m "data: publish first reviewed BSE 2021 batch"
            git push origin HEAD:main && exit 0
          done
          exit 1
