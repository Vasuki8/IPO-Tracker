name: Collect Veranda and Uma 2022 evidence
on:
  push:
    branches: [data/bse-2022-veranda-uma-20260927]
    paths: [.github/workflows/collect-bse-2022-veranda-uma.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch original official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs";import path from "node:path";import {createHash} from "node:crypto";import {execFileSync} from "node:child_process";
          const out=process.env.OUT,docs=[
            ["veranda_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/apr-2023/1681124753382.pdf"],
            ["veranda_annual","https://www.bseindia.com/bseplus/AnnualReport/543514/77133543514.pdf"],
            ["uma_rhp","https://www.sebi.gov.in/sebi_data/attachdocs/mar-2022/1647946195230.PDF"],
            ["uma_annual","https://www.bseindia.com/bseplus/AnnualReport/543513/75230543513.pdf"]
          ],receipt=[];const allowed=new Set(["www.sebi.gov.in","sebi.gov.in","www.bseindia.com","bseindia.com"]);
          for(const[key,url]of docs){let last;for(let attempt=1;attempt<=3;attempt++){try{const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});if(!r.ok||!allowed.has(new URL(r.url).hostname))throw Error("bad_"+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf");const pdf=path.join(out,key+".pdf"),txt=path.join(out,key+".txt");fs.writeFileSync(pdf,b);execFileSync("pdftotext",["-layout",pdf,txt]);receipt.push({key,source_url:url,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt});break}catch(e){last=e;if(attempt===3)throw e;await new Promise(r=>setTimeout(r,attempt*1500));}}}
          for(const key of ["veranda_prospectus","veranda_annual","uma_rhp","uma_annual"]){const t=fs.readFileSync(path.join(out,key+".txt"),"utf8").replace(/\s+/g," ");console.log(key, t.match(/.{0,120}(?:VERANDA LEARNING SOLUTIONS LIMITED|UMA EXPORTS LIMITED|Issue Price|Offer Opens|Offer Closes|listed on|listing).{0,180}/i)?.[0]||"no-sample");}
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({schema_version:"1.0.0",status:"collected",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt},null,2)+"\n");
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: bse-2022-veranda-uma-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
