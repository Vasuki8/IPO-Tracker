name: Collect HP Adhesives and Nuvoco official evidence
on:
  push:
    branches: [data/bse-2021-hp-nuvoco-20260927]
    paths: [.github/workflows/collect-hp-nuvoco.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch and validate official SEBI PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs"; import path from "node:path"; import {createHash} from "node:crypto"; import {execFileSync} from "node:child_process";
          const out=process.env.OUT;
          const docs=[
            ["hp_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/dec-2021/1640076626700.pdf"],
            ["hp_track_record","https://www.sebi.gov.in/sebi_data/attachdocs/jun-2023/1686912387439.pdf"],
            ["nuvoco_bulletin","https://www.sebi.gov.in/sebi_data/attachdocs/oct-2021/1633688089802.pdf"]
          ];
          const receipt=[];
          for(const [key,url] of docs){
            let last;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});
                if(!r.ok||!["www.sebi.gov.in","sebi.gov.in"].includes(new URL(r.url).hostname))throw Error("bad_"+r.status);
                const b=Buffer.from(await r.arrayBuffer()); if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf");
                const pdf=path.join(out,key+".pdf"),txt=path.join(out,key+".txt"); fs.writeFileSync(pdf,b); execFileSync("pdftotext",["-layout",pdf,txt]);
                receipt.push({key,source_url:url,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt});
                break;
              }catch(e){last=e;if(attempt===3)throw e;await new Promise(r=>setTimeout(r,attempt*1500));}
            }
          }
          const hp=fs.readFileSync(path.join(out,"hp_prospectus.txt"),"utf8").replace(/\s+/g," ");
          const hpt=fs.readFileSync(path.join(out,"hp_track_record.txt"),"utf8").replace(/\s+/g," ");
          const nuv=fs.readFileSync(path.join(out,"nuvoco_bulletin.txt"),"utf8").replace(/\s+/g," ");
          const must=(ok,m)=>{if(!ok)throw Error(m)};
          must(/HP ADHESIVES LIMITED/i.test(hp)&&/274/.test(hp)&&/12,?596\.33/.test(hp),"hp_identity_price_size");
          must(/Offer Opens on:\s*Wednesday, December 15, 2021/i.test(hp)&&/Offer Closes on:\s*Friday, December 17, 2021/i.test(hp),"hp_offer_dates");
          must(/HP Adhesives Limited/i.test(hpt)&&/274/.test(hpt)&&/December 27,?\s*2021/i.test(hpt),"hp_track_terms");
          must(/Nuvoco Vistas Corporation Limited/i.test(nuv)&&/23-Aug-\s*21/i.test(nuv)&&/570/.test(nuv)&&/5000\.0/.test(nuv),"nuvoco_terms");
          const result={schema_version:"1.0.0",status:"complete",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt};
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify(result,null,2)+"\n");
          console.log(JSON.stringify({documents:receipt.length,bytes:result.total_response_bytes,hashes:receipt.map(d=>[d.key,d.response_sha256])}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: hp-nuvoco-original-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
