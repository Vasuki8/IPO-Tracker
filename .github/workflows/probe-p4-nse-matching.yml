name: Probe P4 NSE report matching

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-p4-nse-matching.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
      - run: uv python install 3.12
      - run: uv sync
      - name: Inspect raw NSE monthly workbook layouts
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import enrich_nse_primary_market_reports_v2 as mod

          session = mod.base.requests.Session()
          session.headers.update(mod.base.core.HEADERS)
          urls = mod.discover_report_urls(session, 30)

          for url in urls:
              name = url.rsplit('/', 1)[-1]
              if not any(token in name.lower() for token in ('july%202025', 'july_2025', 'september%202024', 'sep2024')):
                  continue
              raw_rows = mod.read_xlsx_rows(mod.download_report(session, url))
              parsed = mod.parse_report_rows(raw_rows, url)
              print('\n===', name, 'RAW', len(raw_rows), 'PARSED', len(parsed), '===')
              for idx, row in enumerate(raw_rows[:18]):
                  print('RAWROW', idx, row)
              for idx, row in enumerate(raw_rows):
                  joined = ' | '.join(row).lower()
                  if 'highway infrastructure' in joined:
                      print('HIGHWAY RAW INDEX', idx, row)
              for row in parsed[:8]:
                  print('PARSEDROW', row)
          PY
