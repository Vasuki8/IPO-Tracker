name: Probe NSE issue information

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-nse-issue-info.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Inspect official NSE issue-information assets
        shell: bash
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          HOME = "https://www.nseindia.com"
          PAGE = HOME + "/market-data/issue-information?series=EQ&symbol=SENCO&type=Past"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }
          session = requests.Session()
          session.headers.update(headers)

          lines = []
          try:
              home = session.get(HOME, timeout=25)
              lines.append(f"HOME status={home.status_code} bytes={len(home.content)}")
          except Exception as exc:
              lines.append(f"HOME error={exc}")

          response = session.get(PAGE, timeout=30, headers={"Referer": HOME + "/"})
          lines.append(f"PAGE status={response.status_code} bytes={len(response.content)} url={response.url}")
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")
          script_urls = []
          for script in soup.find_all("script", src=True):
              url = urljoin(PAGE, str(script.get("src") or ""))
              if url and url not in script_urls:
                  script_urls.append(url)
          lines.append(f"SCRIPTS count={len(script_urls)}")

          endpoint_re = re.compile(r"(?:https?://www\.nseindia\.com)?/api/[A-Za-z0-9_?&=.$%{}:/+-]+")
          needles = (
              "issue-information",
              "public-past-issues",
              "ipo-current-issue",
              "bidlot",
              "bid lot",
              "minimumorderquantity",
              "minimum bid",
              "marketlot",
              "market lot",
          )
          endpoints = set()
          snippets = []

          for index, url in enumerate(script_urls):
              try:
                  js = session.get(url, timeout=30, headers={"Referer": PAGE})
                  text = js.text if js.ok else ""
                  if not text:
                      continue
                  lower = text.lower()
                  matched = any(needle in lower for needle in needles)
                  found = set(endpoint_re.findall(text))
                  if found:
                      endpoints.update(found)
                  if matched or found:
                      lines.append(f"ASSET[{index}] status={js.status_code} bytes={len(js.content)} url={url}")
                  for needle in needles:
                      start = 0
                      while True:
                          pos = lower.find(needle, start)
                          if pos < 0:
                              break
                          left = max(0, pos - 280)
                          right = min(len(text), pos + len(needle) + 420)
                          snippet = re.sub(r"\s+", " ", text[left:right])
                          snippets.append(f"[{url}] ...{snippet}...")
                          start = pos + len(needle)
                          if len(snippets) >= 120:
                              break
                      if len(snippets) >= 120:
                          break
                  if len(snippets) >= 120:
                      break
              except Exception as exc:
                  lines.append(f"ASSET[{index}] error={exc} url={url}")

          lines.append("ENDPOINTS")
          lines.extend(sorted(endpoints))
          lines.append("SNIPPETS")
          lines.extend(snippets)
          Path("docs/NSE_ISSUE_INFO_PROBE.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish probe result
        shell: bash
        run: |
          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NSE_ISSUE_INFO_PROBE.txt
          git commit -m "debug: record NSE issue-information probe" || exit 0
          git push origin HEAD:main
