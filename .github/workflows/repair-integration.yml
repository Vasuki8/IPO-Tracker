name: P4 integration recovery

on:
  pull_request:
    paths: ['.github/workflows/repair-integration.yml']

permissions:
  contents: read

jobs:
  preserve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact public repair histories for offline integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/repair-recovery
          for sha in cf906df7ccc9bcf40881743b0af39480858a612e 4707df1e82337e3a7b8bac0838bbaa30c3d200be d5e5d0580360a87dffc35b69e674886848b55005 a503531ded368c4eb53ba09cf5c2aafef3391c38; do
            git fetch --no-tags origin "$sha"
            git update-ref "refs/heads/recovery-$sha" "$sha"
          done
          git bundle create artifacts/repair-recovery/repair-history.bundle \
            refs/heads/recovery-cf906df7ccc9bcf40881743b0af39480858a612e \
            refs/heads/recovery-4707df1e82337e3a7b8bac0838bbaa30c3d200be \
            refs/heads/recovery-d5e5d0580360a87dffc35b69e674886848b55005 \
            refs/heads/recovery-a503531ded368c4eb53ba09cf5c2aafef3391c38
          git bundle verify artifacts/repair-recovery/repair-history.bundle
          git bundle list-heads artifacts/repair-recovery/repair-history.bundle > artifacts/repair-recovery/refs.txt
          sha256sum artifacts/repair-recovery/repair-history.bundle > artifacts/repair-recovery/SHA256SUMS
          # This exports only public Git objects. It is not source acceptance,
          # a collector artifact, a repository push or a data publication.
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: p4-recovery-${{ github.run_id }}
          path: artifacts/repair-recovery/
          retention-days: 14
