name: Collect BSE-hosted Mish Prospectus

on:
  push:
    branches:
      - work/bse-2023-mish-bse-prospectus-20261005
    paths:
      - 'data/discovery/bse-2023-mish-bse-prospectus-plan-2026-10-05.json'
      - 'scripts/collect-bse-2023-mish-bse-prospectus.mjs'
      - 'scripts/test-bse-2023-mish-bse-prospectus.mjs'
      - '.github/workflows/collect-bse-2023-mish-bse-prospectus.yml'
  pull_request:
    paths:
      - 'data/discovery/bse-2023-mish-bse-prospectus-plan-2026-10-05.json'
      - 'scripts/collect-bse-2023-mish-bse-prospectus.mjs'
      - 'scripts/test-bse-2023-mish-bse-prospectus.mjs'
      - 'data/evidence/bse-2023-mish-bse-prospectus-receipt-2026-10-05.json'
      - '.github/workflows/collect-bse-2023-mish-bse-prospectus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bse-2023-mish-bse-prospectus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test BSE Mish prospectus collector
        run: node scripts/test-bse-2023-mish-bse-prospectus.mjs
      - name: Validate current queue and publication
        run: |
          node scripts/check-bse-2023-progress.mjs
          node scripts/check-bse-2022-disposition.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code

  sources:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect exact BSE prospectus bytes
        id: collect
        continue-on-error: true
        run: node scripts/collect-bse-2023-mish-bse-prospectus.mjs --out="$RUNNER_TEMP/mish-bse-prospectus"
      - name: Validate retained BSE prospectus bytes
        if: always() && steps.collect.outcome == 'success'
        run: node scripts/collect-bse-2023-mish-bse-prospectus.mjs --validate-dir="$RUNNER_TEMP/mish-bse-prospectus"
      - name: Retain complete or partial BSE prospectus collection
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: bse-2023-mish-bse-prospectus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mish-bse-prospectus
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Surface incomplete collection
        if: always()
        run: test "${{ steps.collect.outcome }}" = "success"
