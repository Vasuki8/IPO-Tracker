name: Verify reviewed BSE reconciliation publication

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish reviewed BSE reconciliation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-reviewed-bse-reconciliation-publication
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test publication verifier
        run: node scripts/test-reviewed-bse-reconciliation-publication.mjs
      - name: Retain exact verification revision
        run: |
          mkdir -p "$RUNNER_TEMP/bse-reconciliation-publication/attempts"
          git archive --format=zip HEAD > "$RUNNER_TEMP/bse-reconciliation-publication/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/bse-reconciliation-publication/source-commit.txt"
      - name: Verify actual Pages output
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bse-reconciliation-publication"
          for attempt in $(seq 1 14); do
            if node scripts/verify-reviewed-bse-reconciliation-publication.mjs --output-dir="$out"; then
              cp "$out/report.json" "$out/attempts/$attempt.json"
              exit 0
            fi
            cp "$out/report.json" "$out/attempts/$attempt.json"
            if [ "$attempt" -lt 14 ]; then sleep 30; fi
          done
          exit 1
      - name: Retain actual Pages snapshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-bse-reconciliation-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bse-reconciliation-publication
          retention-days: 14
          if-no-files-found: error
