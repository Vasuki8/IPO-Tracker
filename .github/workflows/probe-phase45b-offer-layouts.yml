name: Probe Phase 4.5B priority document URLs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45b-offer-layouts.yml"

permissions:
  contents: read

concurrency:
  group: phase45b-priority-probe
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Discover hidden official offer-document URLs
        shell: bash
        run: |
          uv run python - <<'PY'
          import html
          import re
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8",
          }
          session = requests.Session()
          session.headers.update(headers)

          pages = [
              (
                  "injecto-registrar",
                  "https://ipostatus.integratedregistry.in/RegistrarsToSTANew.aspx",
                  ("INJECTO", "RHP", ".pdf"),
              ),
              (
                  "vama-issuer-drhp",
                  "https://vamawoven.com/drhp/",
                  ("VAMA", "DRHP", ".pdf"),
              ),
              (
                  "vama-gretex-offer-docs",
                  "https://gretexcorporate.com/offer-documents/ipo/",
                  ("VAMA", "RHP", ".pdf"),
              ),
          ]

          def compact(value):
              return re.sub(r"\s+", " ", str(value or "")).strip()

          for label, url, needles in pages:
              print(f"=== {label} ===")
              try:
                  response = session.get(url, timeout=40)
                  print("STATUS", response.status_code, "FINAL", response.url, "BYTES", len(response.content))
                  response.raise_for_status()
              except Exception as exc:
                  print("FETCH_ERROR", repr(exc))
                  continue

              text = response.text
              decoded = html.unescape(text)
              soup = BeautifulSoup(text, "html.parser")

              candidates = set()
              for tag in soup.find_all(True):
                  attrs = " ".join(f"{k}={v}" for k, v in tag.attrs.items())
                  visible = compact(tag.get_text(" ", strip=True))
                  combined = f"{visible} {attrs}"
                  if any(n.lower() in combined.lower() for n in needles):
                      print("MATCH_TAG", compact(combined)[:1800])
                  for attr in ("href", "src", "data-href", "data-url", "onclick", "value"):
                      raw = tag.get(attr)
                      if raw:
                          value = " ".join(raw) if isinstance(raw, list) else str(raw)
                          if ".pdf" in value.lower():
                              for pdf in re.findall(r"(?:https?://[^\s'\"<>]+|[^\s'\"<>]+\.pdf(?:\?[^\s'\"<>]*)?)", value, re.I):
                                  candidates.add(urljoin(response.url, html.unescape(pdf)))

              for match in re.findall(r"https?://[^\s'\"<>]+?\.pdf(?:\?[^\s'\"<>]*)?", decoded, re.I):
                  candidates.add(match)
              for match in re.findall(r"(?:[A-Za-z0-9_./%-]+\.pdf)(?:\?[^\s'\"<>]*)?", decoded, re.I):
                  candidates.add(urljoin(response.url, match))

              print("PDF_CANDIDATES")
              for candidate in sorted(candidates):
                  print(candidate)

              # Print short source windows around the target name; ASP.NET and
              # WordPress often hide the real PDF in onclick/script attributes.
              upper = decoded.upper()
              target = needles[0].upper()
              cursor = 0
              shown = 0
              while shown < 8:
                  pos = upper.find(target, cursor)
                  if pos < 0:
                      break
                  print("SOURCE_WINDOW", compact(decoded[max(0, pos - 900):pos + 2200])[:3000])
                  cursor = pos + len(target)
                  shown += 1
          PY
