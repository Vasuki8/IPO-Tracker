name: Validate Phase 4.5B priority offer fixes

on:
  push:
    branches:
      - phase45b-priority-offer-fixes
    paths:
      - ".github/workflows/probe-phase45b-offer-layouts.yml"

permissions:
  contents: read

concurrency:
  group: phase45b-priority-branch-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run parser v10 regression tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v10.py" -v

      - name: Run parser v9 regressions
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v9.py" -v

      - name: Run SEBI document-link regressions
        run: uv run python -m unittest discover -s tests -p "test_sebi_document_links.py" -v

      - name: Run issuer fallback regressions
        run: uv run python -m unittest discover -s tests -p "test_issuer_offer_docs.py" -v

      - name: Verify Shakti registry and preview P0 P1 enrichment without publishing
        shell: bash
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import run_issuer_offer_docs as issuer
          spec = issuer.base.ISSUER_DOCUMENTS["shakti-polytarp-limited"]
          assert spec["host"] == "shaktipolytarp.com"
          assert spec["type"] == "DRHP"
          print("SHAKTI_REGISTRY", spec)
          PY

          uv run python scripts/enrich_sebi_document_links.py --priority-max 1 --limit 0
          uv run python scripts/run_offer_docs_v10.py --limit 0
          uv run python scripts/run_issuer_offer_docs.py --priority-max 1 --limit 0
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/ipos.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("data/completeness.json").read_text(encoding="utf-8"))
          queue = json.loads(Path("data/missing_queue.json").read_text(encoding="utf-8"))
          targets = {
              "veegaland",
              "manika",
              "maharaja-speedex-india-limited",
              "injecto-polymers-limited",
              "shakti-polytarp-limited",
          }
          by_id = {str(r.get("id")): r for r in payload.get("ipos") or []}
          q_by_id = {str(r.get("id")): r for r in queue.get("queue") or []}

          print("OFFER_DOC_SCORE", audit["scores"]["offerDocumentEligible"])
          print(
              "PROMOTER_SHAREHOLDING_COVERAGE",
              json.dumps(audit["coverage"]["offerDocumentEligible"]["promoterShareholding"], sort_keys=True),
          )
          for record_id in sorted(targets):
              row = by_id.get(record_id, {})
              q = q_by_id.get(record_id, {})
              print(
                  "TARGET_FIELDS",
                  record_id,
                  "promoters=", bool(row.get("promoters")),
                  "objects=", bool(row.get("objectsOfIssue")),
                  "financials=", bool(row.get("financials")),
                  "shareholding=", row.get("promoterShareholding"),
                  "issueComposition=", row.get("issueComposition"),
                  "missing=", q.get("missingFields"),
              )
          PY
