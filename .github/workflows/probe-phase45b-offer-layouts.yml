name: Validate final Phase 4.5B priority fallbacks

on:
  push:
    branches:
      - phase45b-final-priority-fixes
    paths:
      - ".github/workflows/probe-phase45b-offer-layouts.yml"
      - "scripts/run_issuer_offer_docs.py"
      - "scripts/run_offer_docs_v10.py"
      - "scripts/run_offer_docs_v11.py"
      - "tests/test_issuer_offer_docs.py"
      - "tests/test_offer_docs_v10.py"
      - "tests/test_offer_docs_v11.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Run issuer fallback regressions
        run: uv run python -m unittest discover -s tests -p "test_issuer_offer_docs.py" -v
      - name: Run parser v10 regressions
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v10.py" -v
      - name: Preview P0 and P1 validated fallbacks
        shell: bash
        run: |
          uv run python scripts/run_issuer_offer_docs.py --priority-max 1 --limit 0
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py
          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/ipos.json").read_text(encoding="utf-8"))
          queue = json.loads(Path("data/missing_queue.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("data/completeness.json").read_text(encoding="utf-8"))
          by_id = {str(r.get("id")): r for r in payload.get("ipos") or []}
          q_by_id = {str(r.get("id")): r for r in queue.get("queue") or []}

          print("OFFER_SCORE", audit["scores"]["offerDocumentEligible"])
          for record_id in ("injecto-polymers-limited", "vama-wovenfab-limited"):
              row = by_id.get(record_id, {})
              item = q_by_id.get(record_id, {})
              print(
                  "TARGET",
                  record_id,
                  "shareholding=", row.get("shareholding"),
                  "issueComposition=", row.get("issueComposition"),
                  "freshIssueCr=", row.get("freshIssueCr"),
                  "ofsCr=", row.get("ofsCr"),
                  "missing=", item.get("missingFields"),
                  "extraction=", row.get("issuerDocumentExtraction"),
              )
          PY
