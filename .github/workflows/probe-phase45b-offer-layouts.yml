name: Probe final Phase 4.5B priority fields

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45b-offer-layouts.yml"

permissions:
  contents: read

concurrency:
  group: phase45b-priority-probe
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Probe Injecto, Manika and Vama official documents
        shell: bash
        run: |
          uv run python - <<'PY'
          import io
          import json
          import re
          import sys
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          sys.path.insert(0, str(Path("scripts").resolve()))
          import run_offer_docs_v10 as parser
          import update_data as core

          payload = json.loads(Path("data/ipos.json").read_text(encoding="utf-8"))
          by_id = {str(r.get("id")): r for r in payload.get("ipos") or []}
          session = requests.Session()
          session.headers.update(core.HEADERS)
          score_shareholding_page = parser.v9.v8._shareholding_page_score

          def fetch_pdf(label, url):
              print(f"=== {label} ===")
              response = session.get(url, timeout=60)
              response.raise_for_status()
              data = response.content
              print("URL", response.url, "BYTES", len(data), "MAGIC", data[:5])
              if not data.startswith(b"%PDF"):
                  raise RuntimeError(f"not a PDF: {url}")
              return data

          def probe_shareholding(label, data):
              reader = PdfReader(io.BytesIO(data))
              ranked = []
              cache = {}
              for idx, page in enumerate(reader.pages):
                  try:
                      text = page.extract_text() or ""
                  except Exception:
                      text = ""
                  cache[idx] = text
                  score = score_shareholding_page(text)
                  if score > 0:
                      ranked.append((score, idx))
              ranked.sort(reverse=True)
              print(label, "PAGES", len(reader.pages), "TOP_SHARE_PAGES", ranked[:12])
              blocks = []
              for score, idx in ranked[:10]:
                  text = cache[idx]
                  blocks.append(text)
                  flat = re.sub(r"\s+", " ", text).strip()
                  marker = re.search(
                      r"(?:promoter.{0,40}promoter group|shareholding pattern|pre[- ]?(?:issue|offer)|total\s*\(\s*A\s*\+\s*B\s*\))",
                      flat,
                      re.I,
                  )
                  start = max(0, (marker.start() if marker else 0) - 700)
                  print(f"{label}_PAGE {idx + 1} SCORE {score}")
                  print(flat[start:start + 2800])
              combined = "\n".join(blocks)
              print(label, "RANKED_PARSE", parser.extract_promoter_shareholding(combined))
              extracted_text, pages_read, page_count = parser.extract_pdf_text(data)
              parsed = parser.parse_document_text(extracted_text, None)
              print(label, "PRODUCTION_FIELDS", parsed.get("extractedFields"))
              print(label, "PRODUCTION_SHAREHOLDING", parsed.get("shareholding"))
              print(label, "PRODUCTION_ISSUE", parsed.get("issueComposition"))
              print(label, "PRODUCTION_PAGES", pages_read, page_count)

          injecto = fetch_pdf(
              "INJECTO_REGISTRAR_RHP",
              "https://ipostatus.integratedregistry.in/PDFFILES/INJECTORHP.pdf",
          )
          probe_shareholding("INJECTO", injecto)

          manika = by_id["manika"]
          print("=== MANIKA_DOCUMENTS ===")
          full_candidates = []
          for doc in manika.get("documents") or []:
              url = str(doc.get("url") or "")
              title = str(doc.get("title") or "")
              typ = str(doc.get("type") or "").upper()
              print("MANIKA_DOC", typ, title, url)
              if (
                  typ == "RHP"
                  and url.lower().endswith(".pdf")
                  and "sebi.gov.in" in url.lower()
                  and "abridged" not in title.lower()
                  and "ap_" not in url.lower()
              ):
                  full_candidates.append((str(doc.get("filedDate") or ""), url))
          if not full_candidates:
              raise RuntimeError("No full official SEBI Manika RHP candidate")
          full_candidates.sort(reverse=True)
          manika_pdf = fetch_pdf("MANIKA_FULL_SEBI_RHP", full_candidates[0][1])
          probe_shareholding("MANIKA", manika_pdf)

          vama = fetch_pdf(
              "VAMA_ISSUER_RHP",
              "https://vamawoven.com/wp-content/uploads/2026/09/RHP_VamaWovenfabLimited-2.pdf",
          )
          extracted_text, pages_read, page_count = parser.extract_pdf_text(vama)
          vama_parsed = parser.parse_document_text(extracted_text, None)
          print("VAMA_PRODUCTION_FIELDS", vama_parsed.get("extractedFields"))
          print("VAMA_PRODUCTION_ISSUE", vama_parsed.get("issueComposition"))
          print("VAMA_PRODUCTION_PAGES", pages_read, page_count)
          PY
