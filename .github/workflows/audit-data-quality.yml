name: IPO data quality audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/ipos.json"
      - "scripts/audit_data_completeness.py"
      - "scripts/build_missing_queue.py"
      - "tests/test_data_completeness.py"
      - "tests/test_missing_queue.py"
      - ".github/workflows/audit-data-quality.yml"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run audit tests
        run: |
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/audit-base-data-blob

      - name: Build audit and repair queue
        run: |
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish latest audit safely
        shell: bash
        run: |
          BASE_DATA="$(cat /tmp/audit-base-data-blob)"
          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"

          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "IPO data changed while auditing; rebuilding from latest main."
            git reset --hard origin/main
            uv run python scripts/audit_data_completeness.py
            uv run python scripts/build_missing_queue.py
          else
            cp data/completeness.json /tmp/completeness.json
            cp data/missing_queue.json /tmp/missing_queue.json
            cp docs/DATA_QUALITY.md /tmp/DATA_QUALITY.md
            git reset --hard origin/main
            cp /tmp/completeness.json data/completeness.json
            cp /tmp/missing_queue.json data/missing_queue.json
            cp /tmp/DATA_QUALITY.md docs/DATA_QUALITY.md
          fi

          if git diff --quiet -- data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md; then
            echo "Audit already current"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md
          git commit -m "data: refresh IPO completeness audit"
          git push origin HEAD:main
