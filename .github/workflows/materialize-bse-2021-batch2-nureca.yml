name: Materialize Nureca BSE 2021 evidence
on:
  push:
    branches: [data/bse-2021-batch2-20260926]
    paths:
      - "data/discovery/bse-2021-batch2-nureca-review-2026-09-27.json"
      - ".github/workflows/materialize-bse-2021-batch2-nureca.yml"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Fetch and validate retained source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nureca"
          node --input-type=module <<'JS'
          import fs from "node:fs"; import {createHash} from "node:crypto";
          const reviewBytes=fs.readFileSync("data/discovery/bse-2021-batch2-nureca-review-2026-09-27.json"),review=JSON.parse(reviewBytes),s=review.sources[0];
          let last;for(let attempt=1;attempt<=3;attempt++){try{const r=await fetch(s.url,{redirect:"follow",signal:AbortSignal.timeout(45000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});if(!r.ok||new URL(r.url).hostname!=="www.bseindia.com")throw Error("bad_response_"+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf");fs.writeFileSync(process.env.RUNNER_TEMP+"/nureca/nureca_bse_annual_report.pdf",b);const receipt={schema_version:"1.0.0",status:"complete",review_path:"data/discovery/bse-2021-batch2-nureca-review-2026-09-27.json",review_sha256:createHash("sha256").update(reviewBytes).digest("hex"),collection_completed_at:new Date().toISOString(),source_documents_collected:1,total_response_bytes:b.length,documents:[{key:s.key,source_url:s.url,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt}]};fs.writeFileSync(process.env.RUNNER_TEMP+"/nureca/receipt.json",JSON.stringify(receipt,null,2)+"\n");break}catch(e){last=e;if(attempt===3)throw e;await new Promise(r=>setTimeout(r,attempt*1500))}}
          JS
      - id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: bse-2021-nureca-evidence
          path: ${{ runner.temp }}/nureca
          retention-days: 14
          compression-level: 0
      - name: Bind artifact and retain receipt on branch
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";const p=process.env.RUNNER_TEMP+"/nureca/receipt.json",r=JSON.parse(fs.readFileSync(p));r.workflow_run_id=process.env.GITHUB_RUN_ID;r.workflow_artifact={artifact_id:Number(process.env.ARTIFACT_ID),artifact_digest:String(process.env.ARTIFACT_DIGEST).startsWith("sha256:")?process.env.ARTIFACT_DIGEST:"sha256:"+process.env.ARTIFACT_DIGEST,retention_days:14};fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n");
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/evidence
          cp "$RUNNER_TEMP/nureca/receipt.json" data/evidence/bse-2021-batch2-nureca-source-receipt-2026-09-27.json
          git add data/evidence/bse-2021-batch2-nureca-source-receipt-2026-09-27.json
          git commit -m "data(evidence): retain Nureca BSE 2021 source receipt"
          git push origin HEAD:data/bse-2021-batch2-20260926
