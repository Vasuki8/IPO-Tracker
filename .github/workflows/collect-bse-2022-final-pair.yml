name: Collect final BSE 2022 pair evidence
on:
  push:
    branches: [data/bse-2022-final-pair-20260928]
    paths: [.github/workflows/collect-bse-2022-final-pair.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Retain original sources and repository baseline
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/final-pair"
          mkdir -p "$OUT"
          git archive --format=tar.gz HEAD > "$OUT/repository.tar.gz"
          python3 - <<'PY'
          import os,json,re,hashlib,subprocess,datetime,pathlib,html
          out=pathlib.Path(os.environ['OUT']); docs=[]; failures=[]
          def now(): return datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          def fetch(key,url,ext):
              dest=out/(key+'.'+ext)
              result=subprocess.run(['curl','--fail','--location','--retry','2','--retry-all-errors','--retry-delay','3','--connect-timeout','20','--max-time','180','--user-agent','Mozilla/5.0','--output',str(dest),'--write-out','%{http_code}\n%{url_effective}',url],capture_output=True,text=True,check=True)
              status,final=result.stdout.strip().split('\n')[-2:]
              from urllib.parse import urlparse
              if status!='200' or urlparse(final).hostname not in ['www.sebi.gov.in','www.bseindia.com','www.nseindia.com']: raise ValueError('unapproved_response')
              b=dest.read_bytes(); d=dict(key=key,source_url=url,final_url=final,http_status=int(status),response_bytes=len(b),response_sha256=hashlib.sha256(b).hexdigest(),collected_at=now(),file=dest.name)
              if ext=='pdf':
                  if not b.startswith(b'%PDF-'): raise ValueError('not_pdf')
                  info=subprocess.check_output(['pdfinfo',str(dest)],text=True)
                  d['pdf_pages']=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
                  subprocess.run(['pdftotext','-layout',str(dest),str(out/(key+'.txt'))],check=True)
              docs.append(d); return dest
          pages=[
              ('drone_prospectus','https://www.sebi.gov.in/filings/public-issues/dec-2022/droneacharya-aerial-innovations-limited-sme-issue-prospectus_66423.html'),
              ('fivestar_prospectus','https://www.sebi.gov.in/filings/public-issues/nov-2022/five-star-business-finance-limited-prospectus_65104.html'),
              ('drone_listing_corroboration','https://www.sebi.gov.in/enforcement/orders/nov-2025/order-in-respect-of-droneacharya-aerial-innovations-limited_98058.html')
          ]
          for key,url in pages:
              try:
                  landing=fetch(key+'_landing',url,'html')
                  text=html.unescape(landing.read_text())
                  links=list(dict.fromkeys(re.findall(r'https?://www\.sebi\.gov\.in/sebi_data/attachdocs/[^\s\"\'<>]+?\.pdf',text,re.I)))
                  if not links:
                      links=['https://www.sebi.gov.in'+p for p in dict.fromkeys(re.findall(r'/sebi_data/attachdocs/[^\s\"\'<>]+?\.pdf',text,re.I))]
                  if len(links)!=1: raise ValueError('ambiguous_pdf_links:'+str(links))
                  fetch(key,links[0],'pdf')
              except Exception as e: failures.append(dict(key=key,error=str(e)))
          records=[]
          for f in pathlib.Path('data/recovery').glob('*/nse-issue-information.json'):
              for r in json.loads(f.read_text())['records']:
                  name=r.get('issuer_name','').lower()
                  if any(t in name.replace('-','').replace(' ','') for t in ['droneacharya','fivestar']): records.append(dict(year=f.parent.name,record=r))
          (out/'reconciliation.json').write_text(json.dumps(dict(repository_commit=os.environ['GITHUB_SHA'],matched_records=records),indent=2)+'\n')
          receipt=dict(schema_version='1.0.0',status='collected' if not failures else 'partial',workflow_run_id=os.environ['GITHUB_RUN_ID'],repository_commit=os.environ['GITHUB_SHA'],collection_completed_at=now(),documents=docs,failures=failures,total_response_bytes=sum(d['response_bytes'] for d in docs))
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          print('RECONCILIATION',[(x['year'],x['record']['id'],x['record'].get('nse_symbol')) for x in records])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bse-2022-final-pair-evidence
          path: ${{ runner.temp }}/final-pair
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
