name: Repair publish reviewed NSE batch3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-reviewed-nse-batch3-repair.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Retain repair source revision
        run: |
          mkdir -p "$RUNNER_TEMP/batch3-repair/verification/attempts"
          git archive --format=zip HEAD > "$RUNNER_TEMP/batch3-repair/source-before-publication.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/batch3-repair/source-before-publication.txt"

      - name: Revalidate reviewed NSE import and publication invariants
        run: |
          node scripts/test-reviewed-nse-ipos.mjs
          node scripts/test-reviewed-nse-publication.mjs

      - name: Publish only retained reviewed NSE evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Reviewed batch3 publication attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            before="$(node -e "const d=require('./data/ipos.json');process.stdout.write(String(d.records.length))")"
            node scripts/apply-reviewed-nse-ipos.mjs
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs
            after="$(node -e "const d=require('./data/ipos.json');process.stdout.write(String(d.records.length))")"

            printf '{"attempt":%s,"before":%s,"after":%s}\n' "$attempt" "$before" "$after" > "$RUNNER_TEMP/batch3-repair/publication.json"

            if [ -z "$(git status --porcelain -- data/recovery data/ipos.json)" ]; then
              echo "Reviewed batch3 is already present on latest main."
              git rev-parse HEAD > "$RUNNER_TEMP/batch3-repair/published-commit.txt"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recovery data/ipos.json
            git commit -m "chore(data): publish reviewed NSE batch3"
            if git push origin HEAD:main; then
              git rev-parse HEAD > "$RUNNER_TEMP/batch3-repair/published-commit.txt"
              git archive --format=zip HEAD > "$RUNNER_TEMP/batch3-repair/source-after-publication.zip"
              exit 0
            fi
          done
          echo "Failed to publish reviewed batch3 after 3 semantic retries." >&2
          exit 1

      - name: Verify actual GitHub Pages output
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/batch3-repair/verification"
          for attempt in $(seq 1 14); do
            if node scripts/verify-reviewed-nse-publication.mjs \
              --manifest=data/verified-nse-ipos/2026-09-25-batch3.json \
              --output-dir="$out"; then
              cp "$out/report.json" "$out/attempts/$attempt.json"
              exit 0
            fi
            cp "$out/report.json" "$out/attempts/$attempt.json"
            if [ "$attempt" -lt 14 ]; then sleep 30; fi
          done
          exit 1

      - name: Retain repair publication and actual Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-nse-batch3-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch3-repair
          retention-days: 14
          if-no-files-found: error
