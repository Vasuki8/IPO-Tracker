name: Validate retained BSE 2023 prospectus field review
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'data/discovery/bse-2023-irms-field-review-2026-09-28.json'
      - 'data/discovery/bse-2023-irms-listing-review-2026-09-29.json'
      - 'data/evidence/bse-2023-irms-listing-source-receipt-2026-09-29.json'
      - 'data/verified-bse-listings/2026-09-29-irms-2023.json'
      - 'scripts/*-bse-2023-irms.mjs'
      - 'scripts/verify-bse-2023-irms.mjs'
      - 'scripts/test-reviewed-bse-2023-irms.mjs'
      - 'docs/verification/bse-2023-irms-release-2026-09-29.json'
      - '.github/workflows/update-ipos.yml'
      - 'data/evidence/bse-2023-irms-source-receipt-2026-09-28.json'
      - 'scripts/check-bse-2023-irms-field-review.mjs'
      - 'scripts/test-bse-2023-irms-field-review.mjs'
      - '.github/workflows/check-bse-2023-irms-field-review.yml'
      - 'docs/PROJECT_STATUS.md'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'data/discovery/bse-2023-irms-field-review-2026-09-28.json'
      - 'data/discovery/bse-2023-irms-listing-review-2026-09-29.json'
      - 'data/evidence/bse-2023-irms-listing-source-receipt-2026-09-29.json'
      - 'data/verified-bse-listings/2026-09-29-irms-2023.json'
      - 'scripts/*-bse-2023-irms.mjs'
      - 'scripts/verify-bse-2023-irms.mjs'
      - 'scripts/test-reviewed-bse-2023-irms.mjs'
      - 'docs/verification/bse-2023-irms-release-2026-09-29.json'
      - '.github/workflows/update-ipos.yml'
      - 'data/evidence/bse-2023-irms-source-receipt-2026-09-28.json'
      - 'scripts/check-bse-2023-irms-field-review.mjs'
      - 'scripts/test-bse-2023-irms-field-review.mjs'
      - '.github/workflows/check-bse-2023-irms-field-review.yml'
      - 'docs/PROJECT_STATUS.md'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: bse-2023-irms-field-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run every non-browser test entry point
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/irms-field-tests"
          failures=0
          count=0
          for file in scripts/test-*.mjs; do
            case "$(basename "$file")" in
              test-ui.mjs|test-product-logic-ui.mjs|test-drhp-freshness.mjs) continue ;;
            esac
            count=$((count + 1))
            if timeout 90 node "$file" > "$RUNNER_TEMP/irms-field-tests/$(basename "$file").log" 2>&1; then
              echo "PASS $file"
            else
              failures=$((failures + 1))
              echo "FAIL $file"
              cat "$RUNNER_TEMP/irms-field-tests/$(basename "$file").log"
            fi
          done
          printf 'Non-browser test entry points: %s; failures: %s\n' "$count" "$failures" | tee "$RUNNER_TEMP/irms-field-tests/summary.txt"
          test "$count" -gt 0
          test "$failures" -eq 0
      - name: Validate retained progress and current publication
        run: |
          node scripts/check-bse-2023-irms-field-review.mjs
          node scripts/check-bse-2023-progress.mjs
          node scripts/check-bse-2022-disposition.mjs
          node scripts/check-retained-bse-snapshot.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-2023-irms-field-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/irms-field-tests
          retention-days: 14
          if-no-files-found: error
