name: Review thirteen repaired BSE references

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/review-repaired-cursor7.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve exact source revision
        run: |
          mkdir -p "${{ runner.temp }}/repaired-cursor7"
          git archive --format=zip HEAD > "${{ runner.temp }}/repaired-cursor7/source-snapshot.zip"
      - name: Test existing independent listing guards
        run: node scripts/test-verify-bse-listing-candidates.mjs
      - name: Reconcile retained references and verify missing identities
        env:
          OUT: ${{ runner.temp }}/repaired-cursor7
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { issuerKey, listingUrl, validateBatch, verifyBatch } from './scripts/verify-bse-listing-candidates.mjs';
          const hash = b => createHash('sha256').update(b).digest('hex');
          const snapshots = [];
          function read(file) {
            const bytes = fs.readFileSync(file);
            const value = JSON.parse(bytes);
            snapshots.push({path:file, git_blob_sha:execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(), sha256:hash(bytes), bytes:bytes.length, record_count:Array.isArray(value.records) ? value.records.length : null});
            return value;
          }
          const state = read('ops/bse-sme-addition-notices.json');
          const receipt = read('docs/verification/bse-parser-v1.4-2026-09-24.json');
          const expected = receipt.recovered_discovery_references;
          assert.equal(expected.length,13);
          const references = expected.map(e => {
            const notice = state.notices[e.index_notice_no];
            assert.equal(notice.status,'parsed');
            const p = notice.parsed_entries.find(p => p.listing_notice_no === e.listing_notice_no && p.bse_scrip_code === e.bse_scrip_code);
            assert.ok(p);
            for (const key of ['issuer_name','bse_scrip_code','listing_notice_no','listing_date']) assert.equal(p[key],e[key]);
            assert.equal(p.listing_notice_url,listingUrl(p.listing_notice_no));
            return {...p,index_notice_no:e.index_notice_no,index_notice_source_url:notice.source_url,index_notice_collected_at:notice.last_attempted_at,extracted_text_sha256:notice.extracted_text_sha256};
          });
          validateBatch({schema_version:'1.0.0',candidates:references});
          const recovery=[];
          for(let year=2020;year<=2026;year++) {
            const data=read(`data/recovery/${year}/nse-issue-information.json`);
            assert.ok(Array.isArray(data.records) && data.records.length>0);
            for(const record of data.records) recovery.push({year,record});
          }
          const published=read('data/ipos.json');
          assert.ok(Array.isArray(published.records) && published.records.length>0);
          assert.equal(recovery.length,published.records.length);
          function strings(value) {
            if(value==null) return [];
            if(typeof value==='object') return Object.values(value).flatMap(strings);
            return [String(value)];
          }
          const indexed = list => list.map(({year,record})=>({year,record,values:new Set(strings(record))}));
          const raw=indexed(recovery), live=indexed(published.records.map(record=>({year:null,record})));
          const match = (c,list) => list.filter(({record,values})=>issuerKey(record.issuer_name)===issuerKey(c.issuer_name) || record.id===issuerKey(c.issuer_name).replace(/ /g,'-') || values.has(c.bse_scrip_code) || values.has(c.listing_notice_url)).map(({year,record,values})=>({year,id:record.id,issuer_name:record.issuer_name,bse_scrip_code:record.bse_scrip_code??null,name_match:issuerKey(record.issuer_name)===issuerKey(c.issuer_name),code_match:values.has(c.bse_scrip_code),source_match:values.has(c.listing_notice_url)}));
          const entries=references.map(c=>{
            const recovery_matches=match(c,raw), public_matches=match(c,live);
            const all=[...recovery_matches,...public_matches];
            const present=recovery_matches.length===1 && public_matches.length===1 && all.every(m=>m.name_match && (!m.bse_scrip_code || String(m.bse_scrip_code)===c.bse_scrip_code)) && recovery_matches[0].id===public_matches[0].id;
            return {...c,recovery_matches,public_matches,classification:all.length===0?'missing_exact_identity':present?'already_present':'identity_review_required'};
          });
          const stats={references:entries.length,missing_exact_identity:0,already_present:0,identity_review_required:0};
          for(const entry of entries) stats[entry.classification]++;
          const report={schema_version:'1.0.0',generated_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,commit_sha:process.env.GITHUB_SHA,source_repair_run_id:receipt.production.run_id,snapshots,cursor:{parser_version:state.parser_version,updated_at:state.updated_at,tracked:Object.keys(state.notices).length,parsed:Object.values(state.notices).filter(e=>e.status==='parsed').length,eligible:state.catalog.eligible_count},stats,entries,rules:['Discovery is not listing authority.','All seven annual recovery manifests and the committed public dataset were checked.','No fuzzy-name equivalence. Exact normalized names, generated identity, exact BSE code and listing source were checked.','Present or ambiguous identities are excluded from verification and never automatically materialized.']};
          fs.writeFileSync(process.env.OUT+'/reconciliation.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({reconciliation:stats,recovery_records:recovery.length,public_records:published.records.length}));
          const batch={schema_version:'1.0.0',input_report:{run_id:process.env.GITHUB_RUN_ID,commit_sha:process.env.GITHUB_SHA,source_repair_run_id:receipt.production.run_id,reconciliation_report:'data/discovery/bse-listing-reconciliation-2026-09-24-cursor7-repaired.json'},selection_rule:'Only missing/unambiguous identities from the thirteen repaired references; already-present and ambiguous identities are held.',candidates:entries.filter(e=>e.classification==='missing_exact_identity').map(({recovery_matches,public_matches,classification,...candidate})=>candidate)};
          fs.writeFileSync(process.env.OUT+'/candidates.json',JSON.stringify(batch,null,2)+'\n');
          if(batch.candidates.length) {
            const verification=await verifyBatch(batch,{evidenceDir:process.env.OUT+'/notices'});
            fs.writeFileSync(process.env.OUT+'/verification-report.json',JSON.stringify(verification,null,2)+'\n');
            console.log(JSON.stringify({verification:verification.stats,unresolved:verification.results.filter(r=>r.status!=='verified').map(r=>({candidate:r.candidate,status:r.status,reasons:r.reasons,error:r.error}))}));
          }
          assert.equal(execFileSync('git',['status','--porcelain'],{encoding:'utf8'}),'');
          JS
      - name: Install official PDF reader
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Check canonical official listing PDF archives
        continue-on-error: true
        run: node scripts/retry-bse-listing-pdf.mjs --report="${{ runner.temp }}/repaired-cursor7/verification-report.json" --evidence-dir="${{ runner.temp }}/repaired-cursor7/notices" --upgrade-verified-html=true
      - name: Retain source, reconciliation and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-cursor7-review-${{ github.run_id }}
          path: ${{ runner.temp }}/repaired-cursor7
          retention-days: 14
          if-no-files-found: error
