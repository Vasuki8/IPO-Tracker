name: Materialize v1.5 recovered BSE evidence
on:
  push:
    branches: ['backend/publish-v15-recovered-bse']
    paths: ['.github/workflows/materialize-v15-recovered.yml']
permissions:
  actions: read
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/publish-v15-recovered-bse
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download verified source-review artifact
        uses: actions/download-artifact@v4
        with:
          name: v15-recovered-bse-review-36092275068-1
          path: ${{ runner.temp }}/review
          github-token: ${{ github.token }}
          repository: Vasuki8/IPO-Tracker
          run-id: 36092275068
      - name: Materialize reviewed evidence
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const root=process.cwd();
          const review=process.env.RUNNER_TEMP+'/review';
          const report=JSON.parse(fs.readFileSync(path.join(review,'batch36-report.json'),'utf8'));
          const reconciliation=JSON.parse(fs.readFileSync(path.join(review,'reconciliation.json'),'utf8'));
          const candidates=JSON.parse(fs.readFileSync(path.join(review,'batch36-candidates.json'),'utf8'));
          assert.deepEqual(report.stats,{attempted:10,verified:10,rejected:0,unavailable:0});
          assert.deepEqual(reconciliation.stats,{discovered_references:10,missing_exact_identity:10,already_present:0,identity_review_required:0});
          assert.equal(candidates.candidates.length,10);
          const artifact={id:10846242339,sha256:'ed0a6042e12dcb199ac4b8dea5c5434eab7918b8ecfbff7f6c9d1591844fc5d5'};
          candidates.input_report={
            source_commit_sha:reconciliation.source_commit_sha,
            source_run_id:String(report.run_id),
            source_artifact_id:artifact.id,
            source_artifact_sha256:artifact.sha256,
            parser_repair_run_id:'36092149729',
            parser_repair_artifact_id:10845847537,
            parser_repair_artifact_sha256:'93a4e238e50ee030020b21275f30211ded1b7454577cf6c21828154d7a6c03bc',
            reconciliation_report:'data/discovery/bse-listing-reconciliation-2026-09-25-v15-recovered.json'
          };
          reconciliation.source_run_id=String(report.run_id);
          reconciliation.source_artifact_id=artifact.id;
          reconciliation.source_artifact_sha256=artifact.sha256;
          reconciliation.source_verification={
            attempted:10,verified:10,rejected:0,unavailable:0,facts_revalidated:30,
            canonical_pdf_result:{attempted:10,http_404:10},evidence_kind:'official_notice_html'
          };
          reconciliation.selection_rule='Exactly the 10 references recovered by the parser-v1.5 production migration; all exact-missing identities; no fuzzy equivalence or inferred IPO terms.';
          const entries=report.results.map((result)=>{
            assert.equal(result.status,'verified');
            const text=result.response_text;
            return {
              issuer_name:result.candidate.issuer_name,
              board:'SME',
              bse_scrip_code:result.candidate.bse_scrip_code,
              listing_notice_no:result.candidate.listing_notice_no,
              evidence_kind:'official_notice_html',
              source_url:result.source_url,
              document_identity:'BSE Listing Notice '+result.candidate.listing_notice_no,
              document_sha256:result.response_sha256,
              normalized_text_sha256:createHash('sha256').update(text,'utf8').digest('hex'),
              collected_at:result.collected_at,
              publication_date:result.observed_identity.publication_date,
              facts:result.facts,
              evidence_text:text
            };
          });
          const manifest={
            schema_version:'1.0.0',
            verifier_version:report.verifier_version,
            source_commit_sha:reconciliation.source_commit_sha,
            source_run_id:String(report.run_id),
            source_artifact_id:artifact.id,
            source_artifact_sha256:artifact.sha256,
            discovery_batch:'data/discovery/bse-listing-candidates-2026-09-25-batch36.json',
            scope_note:'Parser-v1.5 recovered historical BSE references. Independent strict issuer-specific official BSE HTML review; 10/10 verified, 30 explicit facts, zero rejected/unavailable. Canonical listing-PDF archive probes returned HTTP 404; attachment PDFs are retained in the source artifact but are not used as listing authority. Unsupported terms remain null.',
            entries
          };
          const writes=[
            ['data/discovery/bse-listing-candidates-2026-09-25-batch36.json',candidates],
            ['data/discovery/bse-listing-reconciliation-2026-09-25-v15-recovered.json',reconciliation],
            ['data/verified-bse-listings/2026-09-25-batch36.json',manifest]
          ];
          for(const [file,obj] of writes){
            fs.mkdirSync(path.dirname(file),{recursive:true});
            fs.writeFileSync(file,JSON.stringify(obj)+'\n');
          }
          console.log(JSON.stringify({entries:entries.length,source_run_id:report.run_id}));
          JS
      - name: Rehearse exact importer and publication
        run: |
          node scripts/apply-verified-bse-listings.mjs --check
          node scripts/test-apply-verified-bse-listings.mjs
          node scripts/test-bse-publication-rehearsal.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
      - name: Commit evidence-only release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-v15-recovered-bse.yml .github/workflows/materialize-v15-recovered.yml
          git add data/discovery/bse-listing-candidates-2026-09-25-batch36.json
          git add data/discovery/bse-listing-reconciliation-2026-09-25-v15-recovered.json
          git add data/verified-bse-listings/2026-09-25-batch36.json
          git commit -m "data: retain reviewed v1.5 recovered BSE evidence"
          git push origin HEAD:backend/publish-v15-recovered-bse
