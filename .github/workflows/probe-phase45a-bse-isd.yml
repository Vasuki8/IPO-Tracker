name: Probe Phase 4.5A BSE Issue Summary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-bse-isd.yml"

permissions:
  contents: read

concurrency:
  group: phase45a-bse-isd-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe BSE historical IPO API rows
        shell: bash
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          for URL in \
            "https://api.bseindia.com/BseIndiaAPI/api/IPOTrackerN/w?Fromdt=2026" \
            "https://api.bseindia.com/BseIndiaAPI/api/IPOTrackerN/w?Fromdt=2025" \
            "https://api.bseindia.com/BseIndiaAPI/api/IPOTrackerN/w?Fromdt=2024" \
            "https://api.bseindia.com/BseIndiaAPI/api/MoreCompanyN/w?Fromdt=2025&company=&flag=1&type=2" \
            "https://api.bseindia.com/BseIndiaAPI/api/MoreCompanyN/w?Fromdt=2024&company=&flag=1&type=2"; do
            echo "=== $URL ==="
            curl --http1.1 -sS -L --max-time 25 -A "$UA" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Origin: https://www.bseindia.com" \
              -H "Referer: https://www.bseindia.com/" \
              -w "\nHTTP:%{http_code} SIZE:%{size_download}\n" \
              "$URL" | head -c 12000
            echo
          done
