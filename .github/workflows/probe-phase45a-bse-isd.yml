name: Probe Phase 4.5A BSE Issue Summary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-bse-isd.yml"

permissions:
  contents: read

concurrency:
  group: phase45a-bse-isd-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch BSE Issue Summary app shell and bundles
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -A "$UA" \
            -H "Referer: https://www.bseindia.com/" \
            "https://www.bseindia.com/markets/PublicIssues/Issuesummary.aspx" -o /tmp/bse-isd.html
          curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -A "$UA" \
            -H "Referer: https://www.bseindia.com/markets/PublicIssues/Issuesummary.aspx" \
            "https://www.bseindia.com/markets/PublicIssues/env.js" -o /tmp/env.js
          curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -A "$UA" \
            -H "Referer: https://www.bseindia.com/markets/PublicIssues/Issuesummary.aspx" \
            "https://www.bseindia.com/assets/includenew/js/main-5C6S24SS.js" -o /tmp/main.js
          wc -c /tmp/bse-isd.html /tmp/env.js /tmp/main.js

      - name: Inspect BSE API routes
        shell: python
        run: |
          import re

          for path in ("/tmp/env.js", "/tmp/main.js"):
              raw = open(path, encoding="utf-8", errors="ignore").read()
              print(f"\n=== {path} ===")
              patterns = [
                  r"https?://api\.bseindia\.com[^\"'`\s<>()]+",
                  r"[\"'`]([^\"'`]{0,100}(?:issue|Issue|ISD|isd|xbrl|XBRL)[^\"'`]{0,160})[\"'`]",
                  r"[\"'`]([^\"'`]{0,100}(?:api|Api|API)[^\"'`]{0,160})[\"'`]",
              ]
              seen = set()
              for pattern in patterns:
                  for match in re.findall(pattern, raw):
                      value = match if isinstance(match, str) else match[0]
                      if value in seen:
                          continue
                      seen.add(value)
                      if any(token in value.lower() for token in ("issue", "isd", "xbrl", "api.bseindia")):
                          print(value[:500])
              print("matches:", len(seen))
