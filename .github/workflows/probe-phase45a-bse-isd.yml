name: Probe Phase 4.5A BSE Issue Summary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-bse-isd.yml"

permissions:
  contents: read

concurrency:
  group: phase45a-bse-isd-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch BSE production bundle
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -A "$UA" \
            -H "Referer: https://www.bseindia.com/markets/PublicIssues/DisplayIPO" \
            "https://www.bseindia.com/assets/includenew/js/main-5C6S24SS.js" -o /tmp/main.js

      - name: Find IPO_HomePageDetail call signature
        shell: python
        run: |
          raw = open("/tmp/main.js", encoding="utf-8", errors="ignore").read()
          needle = "IPO_HomePageDetail"
          start = 0
          while True:
              pos = raw.find(needle, start)
              if pos < 0:
                  break
              print("\n=== MATCH ===")
              print(raw[max(0, pos-3500):pos+6000])
              start = pos + len(needle)

      - name: Probe likely IPO detail parameter shapes
        shell: bash
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          BASE="https://api.bseindia.com/BseIndiaAPI/api/IPO_HomePageDetail/w"
          for QS in \
            "?id=4810&flag=IPO" \
            "?id=4810&type=IPO&status=L&IPONo=7959" \
            "?Scrip_cd=4810&IPO_NO=7959" \
            "?scripcode=4810&ipono=7959" \
            "?id=4810&IPONo=7959&startdt=10/Sep/2026"; do
            echo "=== $QS ==="
            curl --http1.1 -sS -L --max-time 25 -A "$UA" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Origin: https://www.bseindia.com" \
              -H "Referer: https://www.bseindia.com/markets/PublicIssues/DisplayIPO" \
              -w "\nHTTP:%{http_code} SIZE:%{size_download}\n" \
              "$BASE$QS" | head -c 10000
            echo
          done
