name: Core IPO refresh

on:
  workflow_dispatch:
    inputs:
      bootstrap_history:
        description: "Backfill full NSE IPO history from 2000"
        required: false
        type: boolean
        default: false
      deep_sebi_scan:
        description: "Deep scan recent SEBI filing pages"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "scripts/update_data.py"
      - "scripts/run_update.py"
      - "scripts/normalize_source_health.py"
      - "scripts/enrich_exchange_details.py"
      - "scripts/critical_backfill.py"
      - "scripts/build_company_pages.py"
      - "scripts/audit_data_completeness.py"
      - "scripts/build_missing_queue.py"
      - "tests/test_update_data.py"
      - "tests/test_source_health.py"
      - "tests/test_exchange_details.py"
      - "tests/test_critical_backfill.py"
      - "tests/test_company_routes.py"
      - "tests/test_data_completeness.py"
      - "tests/test_missing_queue.py"
      - "pyproject.toml"
      - ".github/workflows/update-ipo-data.yml"
  schedule:
    # Hourly. GitHub cron uses UTC. The updater timestamps data in Asia/Kolkata.
    - cron: "17 * * * *"

permissions:
  contents: write

# All data-writing workflows share this group so only one can modify ipos.json at a time.
concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run core parser tests
        run: uv run python -m unittest discover -s tests -p "test_update_data.py" -v

      - name: Run source-health tests
        run: uv run python -m unittest discover -s tests -p "test_source_health.py" -v

      - name: Run BSE detail-enrichment tests
        run: uv run python -m unittest discover -s tests -p "test_exchange_details.py" -v

      - name: Run critical-backfill tests
        run: uv run python -m unittest discover -s tests -p "test_critical_backfill.py" -v

      - name: Run company-route tests
        run: uv run python -m unittest discover -s tests -p "test_company_routes.py" -v

      - name: Run completeness-audit tests
        run: uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v

      - name: Run missing-queue tests
        run: uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Refresh NSE, SEBI and BSE core data
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.bootstrap_history }}" = "true" ]; then
            EXTRA="$EXTRA --bootstrap-history --history-from 2000-01-01"
          else
            # Hourly runs only reconcile the newest history window. A separate
            # daily workflow performs the broader 365-day historical refresh.
            EXTRA="$EXTRA --history-days 1"
          fi
          if [ "${{ github.event.inputs.deep_sebi_scan }}" = "true" ]; then
            EXTRA="$EXTRA --sebi-pages 20"
          else
            EXTRA="$EXTRA --sebi-pages 4"
          fi
          uv run python scripts/run_update.py $EXTRA
          uv run python scripts/normalize_source_health.py

      - name: Publish enriched core data, routes and completeness audit safely
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"
          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"

          # Always work from the latest branch tip. If another data writer moved
          # ipos.json during this run, discard the stale core snapshot and enrich
          # the newer official dataset instead.
          git reset --hard origin/main
          if [ "$REMOTE_DATA" = "$BASE_DATA" ]; then
            cp /tmp/generated-ipos.json data/ipos.json
          else
            echo "Remote IPO data changed during this run; preserving newer data."
          fi

          # First use the broad BSE detail enricher, then explicitly retry P0/P1
          # repair-queue records with BSE SME's official current-issue index.
          uv run python scripts/enrich_exchange_details.py --limit 30
          uv run python scripts/critical_backfill.py --exchange-only --priority-max 1 --limit 20
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/)" ]; then
            echo "No core data, enrichment, route or completeness changes"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: refresh enriched IPO data, routes and completeness audit"
          git push origin HEAD:main
