name: Update IPO data

on:
  workflow_dispatch:
    inputs:
      bootstrap_history:
        description: "Backfill full NSE IPO history from 2000"
        required: false
        type: boolean
        default: false
      deep_sebi_scan:
        description: "Deep scan recent SEBI filing pages (use on first Phase 2 run)"
        required: false
        type: boolean
        default: false
  schedule:
    # Hourly. GitHub cron is UTC; the updater derives Indian dates in Asia/Kolkata.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen=false

      - name: Run parser tests
        run: uv run python -m unittest discover -s tests -v

      - name: Refresh IPO data
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.bootstrap_history }}" = "true" ]; then
            EXTRA="$EXTRA --bootstrap-history --history-from 2000-01-01"
          else
            EXTRA="$EXTRA --history-days 365"
          fi
          if [ "${{ github.event.inputs.deep_sebi_scan }}" = "true" ]; then
            EXTRA="$EXTRA --sebi-pages 20"
          else
            EXTRA="$EXTRA --sebi-pages 4"
          fi
          uv run python scripts/update_data.py $EXTRA

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/ipos.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json
          git commit -m "data: refresh IPO tracker"
          git push
