name: Reconcile official IPO universe admissions

on:
  push:
    branches: [audit-official-universe-bse-june-20260919]
    paths:
      - '.github/workflows/audit-official-universe.yml'

permissions:
  contents: write

concurrency:
  group: official-universe-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Reapply reviewed admissions onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data/ipos.json > data/ipos.json
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("tools").resolve()))
          import audit_ipo_universe as audit

          tracker = Path("data/ipos.json")
          snapshots = [
              Path("docs/audits/official-universe/2026-09-19-bse-june"),
              Path("docs/audits/official-universe/2026-09-19-bse-may"),
              Path("docs/audits/official-universe/2026-09-19-bse-april"),
          ]
          counts = []
          for snapshot in snapshots:
              plan = json.loads((snapshot / "admissions.json").read_text(encoding="utf-8"))
              plan["baselineSha256"] = audit.digest(tracker.read_bytes())
              aliases = json.loads((snapshot / "aliases.json").read_text(encoding="utf-8"))
              proposed = audit.prepare_admissions(snapshot, tracker, plan, aliases)
              tracker.write_text(json.dumps(proposed, indent=2) + "\n", encoding="utf-8")
              counts.append(len(plan["records"]))
          if counts != [18, 10, 2]:
              raise SystemExit(f"unexpected reviewed admission counts: {counts}")
          payload = json.loads(tracker.read_text(encoding="utf-8"))
          if len(payload.get("ipos") or []) != 1436:
              raise SystemExit(f"unexpected reconciled inventory: {len(payload.get('ipos') or [])}")
          print({"cohorts": counts, "recordCount": len(payload["ipos"])})
          PY
      - name: Regenerate and validate derived output
        run: |
          uv run --frozen python scripts/validate_data.py --strict
          uv run --frozen python scripts/build_company_pages.py
          uv run --frozen python scripts/audit_data_completeness.py
          uv run --frozen python scripts/build_missing_queue.py
          uv run --frozen python scripts/phase_status.py
          uv run --frozen python scripts/build_performance_summary.py
          uv run --frozen python -m unittest discover -s tests -q
          node --test tests/public_quality.test.cjs tests/source_health.test.cjs
      - name: Commit reconciled audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ipo-tracker-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ ipo/ docs/DATA_QUALITY.md
          git diff --cached --exit-code && { echo "No reconciliation changes"; exit 0; } || true
          git commit -m "Reconcile reviewed universe admissions with current main"
          git push origin HEAD:audit-official-universe-bse-june-20260919
