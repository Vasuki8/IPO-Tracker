name: Audit official IPO universe — BSE April cohort

on:
  push:
    branches: [audit-official-universe-bse-june-20260919]
    paths:
      - '.github/workflows/audit-official-universe.yml'
      - 'tools/review_bse_universe_cohort.py'
      - 'tests/test_universe_bse_cohort_review.py'
      - 'docs/audits/official-universe/2026-09-19-bse-may/next-cohort.json'

permissions:
  contents: write

concurrency:
  group: official-universe-bse-april-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-april:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run universe identity regressions
        run: |
          uv run --frozen python -m unittest \
            tests.test_official_universe \
            tests.test_universe_continuation \
            tests.test_universe_bse_cohort_review \
            tests.test_official_universe_summary -v
      - name: Capture and review BSE April 2026 cohort
        run: |
          uv run --frozen python tools/review_bse_universe_cohort.py \
            --base-snapshot docs/audits/official-universe/2026-09-19-bse-may \
            --snapshot docs/audits/official-universe/2026-09-19-bse-april \
            --cohort docs/audits/official-universe/2026-09-19-bse-may/next-cohort.json \
            --tracker data/ipos.json \
            --baseline-commit ${GITHUB_SHA} \
            --as-of 2026-09-19
      - name: Prove source review did not mutate canonical data
        run: git diff --exit-code -- data/ipos.json data/pending_updates.json
      - name: Commit retained April evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/official-universe/2026-09-19-bse-april
          if git diff --cached --quiet; then
            echo "No new April audit evidence"
          else
            git commit -m "Capture BSE April universe identity evidence"
            git push origin HEAD:${{ github.ref_name }}
          fi
