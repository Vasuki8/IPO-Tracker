name: Review DRHP and held issuer evidence
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-drhp-identity.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retain exact baseline and bounded official responses
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/drhp-identity"
          git archive --format=zip HEAD > "$RUNNER_TEMP/drhp-identity/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/drhp-identity/source-commit.txt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const out=path.join(process.env.RUNNER_TEMP,'drhp-identity');
          const headers={'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','accept':'*/*'};
          const sources=[
            ['sebi-draft.html','https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&smid=10&ssid=15'],
            ['sebi-draft-page1.html','https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&smid=10&ssid=15&pageNo=1'],
            ['sebi-rhp.html','https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&smid=11&ssid=15'],
            ['equity-master.csv','https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv'],
            ['AMIRCHAND-identity.html','https://nsearchives.nseindia.com/corporate/ixbrl/PRIOR_INTIMATION_20260411_173737_WEB.html'],
            ['LEAP-identity.html','https://nsearchives.nseindia.com/corporate/ixbrl/INTEGRATED_FILING_INDAS_190857_31082026204414_iXBRL_WEB.html'],
            ['deployed-baseline.json','https://vasuki8.github.io/IPO-Tracker/data/ipos.json']
          ];
          const rows=[];
          async function retain(file,url,extra={}){
            const requested_at=new Date().toISOString();
            try {
              const r=await fetch(url,{headers:{...headers,...extra},signal:AbortSignal.timeout(25000)});
              const b=Buffer.from(await r.arrayBuffer());fs.writeFileSync(path.join(out,file),b);
              rows.push({file,url,final_url:r.url,status:r.status,content_type:r.headers.get('content-type'),requested_at,collected_at:new Date().toISOString(),bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});
            }catch(e){rows.push({file,url,requested_at,collected_at:new Date().toISOString(),error:String(e.message)});}
          }
          for(const [file,url] of sources) await retain(file,url);
          let cookie='';
          try {const r=await fetch('https://www.nseindia.com/market-data/all-upcoming-issues-ipo',{headers,signal:AbortSignal.timeout(15000)});cookie=(r.headers.getSetCookie?.()||[]).map(v=>v.split(';')[0]).join('; ');}catch{}
          for(const s of ['AMIRCHAND','LEAP','LEAPIND']) await retain(s+'-ipo.json','https://www.nseindia.com/api/ipo-detail?symbol='+s+'&series=EQ',{'cookie':cookie,'referer':'https://www.nseindia.com/market-data/all-upcoming-issues-ipo'});
          const html=fs.readFileSync(path.join(out,'sebi-draft.html'),'utf8');
          const scripts=[...html.matchAll(/<script[^>]*src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],'https://www.sebi.gov.in').href).filter(u=>/sebi\.gov\.in\//.test(u)&&/home|listing|common/i.test(u)).slice(0,4);
          for(let i=0;i<scripts.length;i++)await retain('sebi-script-'+i+'.js',scripts[i]);
          fs.writeFileSync(path.join(out,'sources.json'),JSON.stringify({schema_version:'1.0.0',generated_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,source_commit_sha:process.env.GITHUB_SHA,rows},null,2)+'\n');
          console.log(JSON.stringify(rows.map(({file,status,bytes,error})=>({file,status,bytes,error})),null,2));
          JS
      - name: Verify no source-backed production data changed
        run: git diff --exit-code -- data ops assets
      - name: Retain original responses including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drhp-identity-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drhp-identity
          retention-days: 14
          if-no-files-found: error
