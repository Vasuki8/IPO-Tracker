name: Publish reviewed MAAGH and Technopack 2022 IPOs
on:
  pull_request:
    branches: [main]
    paths:
      - "data/discovery/bse-2022-maagh-technopack-review-2026-09-27.json"
      - "data/evidence/bse-2022-maagh-technopack-source-receipt-2026-09-27.json"
      - "data/verified-bse-listings/2026-09-27-maagh-technopack.json"
      - "scripts/*maagh-technopack*"
      - ".github/workflows/publish-reviewed-bse-2022-maagh-technopack.yml"
  push:
    branches: [main]
    paths:
      - "data/verified-bse-listings/2026-09-27-maagh-technopack.json"
      - "scripts/*maagh-technopack*"
      - ".github/workflows/publish-reviewed-bse-2022-maagh-technopack.yml"
permissions: {contents: read}
concurrency:
  group: bse-2022-maagh-technopack
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: |
          node scripts/test-reviewed-bse-2022-maagh-technopack.mjs
          node scripts/apply-reviewed-bse-2022-maagh-technopack.mjs --apply
          node scripts/build-published-data.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          node scripts/test-reviewed-bse-2022-maagh-technopack.mjs
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Recompute and publish on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/test-reviewed-bse-2022-maagh-technopack.mjs
            node scripts/apply-reviewed-bse-2022-maagh-technopack.mjs --apply
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs
            node scripts/test-reviewed-bse-2022-maagh-technopack.mjs
            git add data/recovery/2022/nse-issue-information.json data/ipos.json
            git diff --cached --quiet && exit 0
            git commit -m "data: publish reviewed MAAGH and Technopack 2022 IPOs"
            git push origin HEAD:main && exit 0
          done
          exit 1
  verify-live:
    needs: publish
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Verify GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            node scripts/verify-bse-2022-maagh-technopack.mjs && exit 0
            sleep 20
          done
          exit 1
