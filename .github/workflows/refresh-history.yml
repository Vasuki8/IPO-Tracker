name: Daily IPO history refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/run_update_v2.py"
      - "scripts/p4_history_guard.py"
      - "scripts/enrich_nse_primary_market_reports.py"
      - "scripts/enrich_nse_primary_market_reports_v2.py"
      - "scripts/enrich_exchange_details_v2.py"
      - "scripts/backfill_bse_history.py"
      - "scripts/backfill_bse_history_v2.py"
      - "scripts/run_offer_docs_v12.py"
      - "scripts/run_issuer_offer_docs_v2.py"
      - "scripts/apply_verified_lot_sizes.py"
      - "scripts/apply_verified_recent_issue_terms.py"
      - "scripts/apply_verified_recent_offer_fields.py"
      - "scripts/apply_verified_filing_offer_fields.py"
      - "scripts/audit_data_completeness.py"
      - "scripts/build_missing_queue.py"
      - "scripts/normalize_source_health.py"
      - "tests/test_update_data_v2.py"
      - "tests/test_nse_primary_market_reports.py"
      - "tests/test_nse_primary_market_reports_v2.py"
      - "tests/test_exchange_details_v2.py"
      - "tests/test_bse_history_backfill.py"
      - "tests/test_offer_docs_v12.py"
      - "tests/test_issuer_offer_docs_v2.py"
      - "tests/test_verified_lot_sizes.py"
      - "tests/test_verified_recent_issue_terms.py"
      - "tests/test_verified_recent_offer_fields.py"
      - "tests/test_verified_filing_offer_fields.py"
      - "tests/test_data_completeness.py"
      - "tests/test_missing_queue.py"
      - "tests/test_source_health.py"
      - ".github/workflows/refresh-history.yml"
  schedule:
    # Daily at 19:37 IST (14:07 UTC), after the main Indian session.
    - cron: "7 14 * * *"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run core parser tests
        run: uv run python -m unittest discover -s tests -p "test_update_data.py" -v

      - name: Run BSE SME aggregate tests
        run: uv run python -m unittest discover -s tests -p "test_update_data_v2.py" -v

      - name: Run Phase 4.5A NSE monthly-report tests
        run: uv run python -m unittest discover -s tests -p "test_nse_primary_market_reports.py" -v

      - name: Run Phase 4.5A NSE discovery v2 tests
        run: uv run python -m unittest discover -s tests -p "test_nse_primary_market_reports_v2.py" -v

      - name: Run Phase 4.5A exchange-detail v2 tests
        run: uv run python -m unittest discover -s tests -p "test_exchange_details_v2.py" -v

      - name: Run P4 offer-document term tests
        run: uv run python -m unittest discover -s tests -p "test_offer_docs_v12.py" -v

      - name: Run P4 validated-document term tests
        run: uv run python -m unittest discover -s tests -p "test_issuer_offer_docs_v2.py" -v

      - name: Run verified upcoming lot-size tests
        run: uv run python -m unittest discover -s tests -p "test_verified_lot_sizes.py" -v

      - name: Run verified recent issue-term tests
        run: uv run python -m unittest discover -s tests -p "test_verified_recent_issue_terms.py" -v

      - name: Run verified recent offer-field tests
        run: uv run python -m unittest discover -s tests -p "test_verified_recent_offer_fields.py" -v

      - name: Run verified filing offer-field tests
        run: uv run python -m unittest discover -s tests -p "test_verified_filing_offer_fields.py" -v

      - name: Run source-health tests
        run: uv run python -m unittest discover -s tests -p "test_source_health.py" -v

      - name: Run BSE historical backfill tests
        run: uv run python -m unittest discover -s tests -p "test_bse_history_backfill.py" -v

      - name: Run completeness-audit tests
        run: uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v

      - name: Run missing-queue tests
        run: uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Reconcile full P4 recent-history window
        # P4 is defined as the most recent two years. Reconcile the same 730-day
        # window every day so corrected equity IPO rows replace any older broad
        # public-issue observations and the P4 debt/NCD guard can clean legacy rows.
        run: |
          uv run python scripts/run_update_v2.py --history-days 730 --sebi-pages 1
          uv run python scripts/normalize_source_health.py

      - name: Publish historical reconciliation and progressive detail backfill safely
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"
          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"

          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during this run; skipping stale historical publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json

          # Phase 4.5A source 1: NSE's official monthly Primary Market XLSX
          # reports expose issue size, total/fresh/OFS shares and listing dates
          # across recent IPO history. Existing normalized values are fill-only.
          uv run python scripts/enrich_nse_primary_market_reports_v2.py \
            --history-days 730 \
            --max-reports 30

          # Phase 4.5A source 2: BSE DisplayIPO/detail pages recover market lot
          # and independently validate/fill issue-size facts. NSE remains primary
          # for populated exchange fields; BSE never silently overwrites them.
          uv run python scripts/enrich_exchange_details_v2.py --limit 30 --history-days 730
          uv run python scripts/backfill_bse_history_v2.py --history-days 730 --limit 80

          # P4 source 3: finalized official offer documents. v12 reads explicit
          # minimum bid lot and price-band wording from the exact PDF, records the
          # document observation, and only fills exchange fields that are missing.
          uv run python scripts/run_offer_docs_v12.py --limit 8
          uv run python scripts/run_issuer_offer_docs_v2.py --priority-max 4 --limit 10

          # Strict fill-only bridges run only after automated official sources.
          # Exact record-identity guards prevent cross-issue application while
          # retaining per-entry filing and verification provenance.
          uv run python scripts/apply_verified_lot_sizes.py
          uv run python scripts/apply_verified_recent_issue_terms.py
          uv run python scripts/apply_verified_recent_offer_fields.py
          uv run python scripts/apply_verified_filing_offer_fields.py

          # Phase 4.5D archival sweep: progressively walk the older official BSE
          # archive for recoverable exchange-core fields. Attempt markers + a
          # cooldown make each daily run advance instead of retrying the same
          # unfillable records forever. This pass is deliberately rerunnable.
          uv run python scripts/backfill_bse_history_v2.py \
            --history-days 10000 \
            --limit 120 \
            --core-only \
            --retry-days 30 \
            --oldest-first

          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/)" ]; then
            echo "No historical, detail-backfill, route, audit or repair-queue changes"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: reconcile and enrich IPO history"
          git push origin HEAD:main