name: Review retained BSE parser failures
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-bse-parser-failures.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retain exact source revision
        run: |
          mkdir -p "$RUNNER_TEMP/bse-parser-failures"
          git archive --format=zip HEAD > "$RUNNER_TEMP/bse-parser-failures/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/bse-parser-failures/source-commit.txt"
      - name: Fetch exact official source text and run current parser
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { parseBseSmeAdditionNoticeHtml, summarizeBseNoticeParseFailure } from './scripts/audit-bse-sme-addition-notices.mjs';
          const ids=['20221010-15','20200813-12','20200713-20'];
          const out=path.join(process.env.RUNNER_TEMP,'bse-parser-failures');
          const headers={
            'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
            'accept':'application/json,*/*',
            'accept-language':'en-US,en;q=0.9',
            'referer':'https://www.bseindices.com/notices'
          };
          const rows=[];
          for(const id of ids){
            const url='https://www.bseindices.com/AsiaIndexAPI/api/DisplayNoticecircular/w?NoticeId='+encodeURIComponent(id);
            const response=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
            if(!response.ok) throw new Error(id+' HTTP '+response.status);
            const raw=Buffer.from(await response.arrayBuffer());
            const json=JSON.parse(raw.toString('utf8'));
            const data=typeof json?.Data==='string'?json.Data:'';
            const parsed=parseBseSmeAdditionNoticeHtml(data);
            fs.writeFileSync(path.join(out,id+'-response.json'),raw);
            fs.writeFileSync(path.join(out,id+'-data.txt'),data,'utf8');
            rows.push({
              notice_no:id,
              source_url:url,
              response_sha256:createHash('sha256').update(raw).digest('hex'),
              data_sha256:createHash('sha256').update(data,'utf8').digest('hex'),
              data_bytes:Buffer.byteLength(data,'utf8'),
              current_parser_rows:parsed,
              excerpt:summarizeBseNoticeParseFailure(data,1000)
            });
          }
          fs.writeFileSync(path.join(out,'report.json'),JSON.stringify({schema_version:'1.0.0',generated_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,commit_sha:process.env.GITHUB_SHA,rows},null,2)+'\n');
          console.log(JSON.stringify(rows.map(r=>({notice_no:r.notice_no,data_sha256:r.data_sha256,current_parser_rows:r.current_parser_rows,excerpt:r.excerpt})),null,2));
          JS
      - name: Retain official source fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-parser-failure-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bse-parser-failures
          retention-days: 14
          if-no-files-found: error
