name: Validate IPO data contract

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/ipo-order.js
          node --check assets/lot-size.js

      - name: Test DRHP source integrity and UI
        run: |
          node scripts/test-sync-sebi-drhp.mjs
          node scripts/test-drhp-integrity.mjs
          node scripts/test-drhp-ui.mjs

      - name: Test homepage IPO ordering
        run: node scripts/test-homepage-order.mjs

      - name: Test lot-size display fallback
        run: node scripts/test-lot-size.mjs

      - name: Check operator report syntax
        run: node --check scripts/operator-report.mjs

      - name: Test operator freshness report
        run: node scripts/test-operator-report.mjs

      - name: Test operator snapshot contract
        run: node scripts/test-record-operator-snapshot.mjs

      - name: Test operator state validation
        run: node scripts/test-validate-operator-state.mjs

      - name: Validate committed operator state
        run: node scripts/validate-operator-state.mjs

      - name: Check sync publication race guards
        shell: bash
        run: |
          grep -q 'prepare-live-sync-proposal.mjs' .github/workflows/update-ipos.yml
          grep -q 'apply-live-sync-proposal.mjs' .github/workflows/update-ipos.yml
          grep -q 'git reset --hard origin/main' .github/workflows/update-ipos.yml
          grep -q 'group: live-ipo-sync' .github/workflows/update-ipos.yml
          grep -q 'group: historical-offer-date-backfill' .github/workflows/backfill-historical-offer-dates.yml
          grep -q 'group: historical-pdf-field-backfill' .github/workflows/backfill-historical-pdf-fields.yml
          grep -q 'group: historical-ipo-evidence-materialization' .github/workflows/materialize-historical-ipo-evidence.yml
          grep -q 'git reset --hard origin/main' .github/workflows/materialize-historical-ipo-evidence.yml
          grep -q 'actions/upload-artifact@v4' .github/workflows/materialize-historical-ipo-evidence.yml
          grep -q 'group: fabino-listing-evidence-materialization' .github/workflows/materialize-fabino-listing-evidence.yml
          grep -q 'git reset --hard origin/main' .github/workflows/materialize-fabino-listing-evidence.yml
          grep -q 'actions/upload-artifact@v4' .github/workflows/materialize-fabino-listing-evidence.yml
          grep -q 'group: reviewed-historical-ipo-publication' .github/workflows/publish-reviewed-historical-ipos.yml
          grep -q 'git reset --hard origin/main' .github/workflows/publish-reviewed-historical-ipos.yml
          grep -q 'node scripts/build-published-data.mjs --check' .github/workflows/publish-reviewed-historical-ipos.yml
          grep -q 'group: verify-reviewed-historical-ipo-publication' .github/workflows/verify-reviewed-historical-ipo-publication.yml
          grep -q 'git ls-files --error-unmatch ops/operator-snapshot.json' .github/workflows/update-ipos.yml
          grep -q 'Pages publication-state attempt' .github/workflows/deploy-pages.yml
          grep -q 'git reset --hard origin/main' .github/workflows/deploy-pages.yml
          grep -q 'validate-operator-state.mjs' .github/workflows/deploy-pages.yml
          if grep -q 'git rebase origin/main' .github/workflows/deploy-pages.yml; then
            echo "Pages status publication must recompute on latest main rather than rebase modified JSON." >&2
            exit 1
          fi
          grep -q 'git reset --hard origin/main' .github/workflows/backfill-historical-offer-dates.yml
          grep -q 'apply-historical-offer-date-state.mjs' .github/workflows/backfill-historical-offer-dates.yml
          grep -q 'Semantic publication attempt' .github/workflows/backfill-historical-offer-dates.yml
          grep -q 'node scripts/build-published-data.mjs --check' .github/workflows/backfill-historical-offer-dates.yml
          grep -q 'git reset --hard origin/main' .github/workflows/backfill-historical-pdf-fields.yml
          grep -q 'apply-historical-pdf-field-state.mjs' .github/workflows/backfill-historical-pdf-fields.yml
          grep -q 'Semantic PDF-field publication attempt' .github/workflows/backfill-historical-pdf-fields.yml
          grep -q 'node scripts/build-published-data.mjs --check' .github/workflows/backfill-historical-pdf-fields.yml
          if grep -q 'Backfill historical SEBI offer dates' .github/workflows/update-ipos.yml; then
            echo "Historical offer-date PDF work must stay out of live sync." >&2
            exit 1
          fi

      - name: Test GitHub Pages publication status
        run: node scripts/test-record-pages-publication.mjs

      - name: Test BSE issue-summary diagnostic parser
        run: node scripts/test-diagnose-bse-issues.mjs

      - name: Test BSE detail and listing parsers
        run: node scripts/test-extract-bse-ipo-fields.mjs

      - name: Test BSE SME IPO index audit
        run: node scripts/test-audit-bse-sme-ipo-index.mjs

      - name: Test BSE SME addition notice audit
        run: |
          node --check scripts/audit-bse-sme-addition-notices.mjs
          node scripts/test-audit-bse-sme-addition-notices.mjs

      - name: Test historical IPO coverage audit
        run: node scripts/test-audit-historical-coverage.mjs

      - name: Test historical IPO source materializer
        run: node scripts/test-materialize-historical-ipo-evidence.mjs

      - name: Test Fabino listing-year evidence materializer
        run: node scripts/test-materialize-fabino-listing-evidence.mjs

      - name: Test reviewed NSE IPO import and real publication
        run: |
          node scripts/apply-reviewed-nse-ipos.mjs --check
          node scripts/test-reviewed-nse-ipos.mjs
          node scripts/test-reviewed-nse-publication.mjs

      - name: Test reviewed historical IPO import and publication
        run: |
          node scripts/apply-reviewed-historical-ipos.mjs --check
          node scripts/test-reviewed-historical-ipos.mjs
          node scripts/test-reviewed-historical-ipo-publication.mjs

      - name: Test official IPO universe audit
        run: node scripts/test-audit-ipo-universe.mjs

      - name: Test semantic live-sync publication
        run: node scripts/test-live-sync-semantic-publication.mjs

      - name: Test NSE live sync parser
        run: node scripts/test-sync-nse-live.mjs

      - name: Test NSE Issue Information diagnostic parser
        run: node scripts/test-diagnose-nse-issue-information.mjs

      - name: Test NSE ipo-detail diagnostic
        run: node scripts/test-diagnose-nse-ipo-detail.mjs

      - name: Check NSE ipo-detail extractor syntax
        run: node --check scripts/extract-nse-ipo-detail-fields.mjs

      - name: Test NSE ipo-detail field extraction
        run: node scripts/test-extract-nse-ipo-detail-fields.mjs

      - name: Test NSE public past-issues parser
        run: node scripts/test-diagnose-nse-past-issues.mjs

      - name: Test NSE historical universe collector
        run: node scripts/test-sync-nse-historical.mjs

      - name: Test historical batch year balancing
        run: node scripts/test-historical-batch-selection.mjs

      - name: Test historical NSE detail backfill
        run: node scripts/test-backfill-nse-historical-detail.mjs

      - name: Test NSE public past-issues final-price extraction
        run: node scripts/test-extract-nse-past-issues-fields.mjs

      - name: Test SEBI document matching
        run: node scripts/test-sync-sebi-documents.mjs

      - name: Test historical SEBI offer-date backfill
        run: node scripts/test-backfill-historical-offer-dates.mjs

      - name: Test parser-v1 historical date correction proposal
        run: node scripts/test-prepare-historical-offer-date-corrections.mjs

      - name: Test semantic historical offer-date merge
        run: node scripts/test-apply-historical-offer-date-state.mjs

      - name: Test historical SEBI PDF field backfill
        run: node scripts/test-backfill-historical-pdf-fields.mjs

      - name: Test semantic historical PDF field merge
        run: node scripts/test-apply-historical-pdf-field-state.mjs

      - name: Test semantic historical offer-date merge
        run: node scripts/test-apply-historical-offer-date-state.mjs

      - name: Install PDF text extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Test retained field publication status
        run: node scripts/test-publish-field-status.mjs

      - name: Test Abridged Prospectus field extraction
        run: node scripts/test-extract-abridged-fields.mjs

      - name: Test final Prospectus field extraction
        run: node scripts/test-extract-prospectus-fields.mjs

      - name: Check recovery publication is synchronized
        run: node scripts/build-published-data.mjs --check

      - name: Validate published IPO data
        run: node scripts/validate-data.mjs
