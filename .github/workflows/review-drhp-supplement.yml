name: Review DRHP pagination and symbol evidence
on:
  push:
    branches: ['feature/drhp-filings-identity-20260925']
    paths: ['.github/workflows/review-drhp-supplement.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Retain bounded official supplementary evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/drhp-supplement"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const out=path.join(process.env.RUNNER_TEMP,'drhp-supplement'),rows=[];
          const headers={'user-agent':'Mozilla/5.0','accept':'*/*'};
          for(const [file,url] of [
            ['entry.js','https://www.sebi.gov.in/js/entry.js'],
            ['AEROPLANE-ipo.json','https://www.nseindia.com/api/ipo-detail?symbol=AEROPLANE&series=EQ'],
            ['CML75196.pdf','https://nsearchives.nseindia.com/content/circulars/CML75196.pdf']
          ]){
            const requested_at=new Date().toISOString();
            try {const r=await fetch(url,{headers,signal:AbortSignal.timeout(30000)});const b=Buffer.from(await r.arrayBuffer());fs.writeFileSync(path.join(out,file),b);rows.push({file,url,final_url:r.url,status:r.status,requested_at,collected_at:new Date().toISOString(),bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});}
            catch(e){rows.push({file,url,requested_at,error:String(e.message)});}
          }
          const js=fs.readFileSync(path.join(out,'entry.js'),'utf8'),i=js.indexOf('function searchFormNewsList');
          console.log(js.slice(i,i+9000));
          fs.writeFileSync(path.join(out,'sources.json'),JSON.stringify({schema_version:'1.0.0',run_id:process.env.GITHUB_RUN_ID,source_commit_sha:process.env.GITHUB_SHA,rows},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drhp-supplement-${{ github.run_id }}
          path: ${{ runner.temp }}/drhp-supplement
          retention-days: 14
          if-no-files-found: error
