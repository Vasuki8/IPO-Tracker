name: Validate IPO interface

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/test-ui.mjs"
      - ".github/workflows/validate-ui.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/test-ui.mjs"
      - ".github/workflows/validate-ui.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ipo-ui" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/ipo-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check interface on desktop and mobile
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/ipo-ui/node_modules/playwright" \
          UI_SCREENSHOT_DIR="$RUNNER_TEMP/ipo-ui-previews" \
          node scripts/test-ui.mjs
      - name: Retain visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-ui-previews
          path: ${{ runner.temp }}/ipo-ui-previews
          retention-days: 7
