name: Deploy IPO Tracker to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "ops/pages-publication.json"
      - "ops/sebi-historical-search.json"
      - "ops/nse-historical-detail.json"
      - "ops/sebi-historical-offer-dates.json"
      - "ops/sebi-historical-pdf-fields.json"
  workflow_dispatch:
  # GITHUB_TOKEN data pushes do not emit push-triggered workflow runs.
  workflow_run:
    workflows:
      - "Sync live IPO data"
      - "Sync Pre-IPO draft sources"
      - "Backfill historical IPO offer dates"
      - "Backfill historical IPO PDF fields"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    # Never execute a PR payload or an upstream fork revision with write access.
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    # Join deployment concurrency only after the trusted-success guard passes.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Retain actual deployment revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify served IPO dataset matches this deployment
        id: verify
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {createHash} from "node:crypto";
          const expected=fs.readFileSync("data/ipos.json");
          const hash=b=>createHash("sha256").update(b).digest("hex");
          const expectedHash=hash(expected);
          const out=process.env.RUNNER_TEMP+"/pages-verification";
          fs.mkdirSync(out,{recursive:true});
          const base=process.env.PAGES_URL.endsWith("/")?process.env.PAGES_URL:process.env.PAGES_URL+"/";
          let last="";
          for(let attempt=1;attempt<=5;attempt++){
            const response=await fetch(base+"data/ipos.json?verify="+Date.now(),{cache:"no-store"});
            const bytes=Buffer.from(await response.arrayBuffer());
            last=hash(bytes);
            fs.writeFileSync(out+"/ipos.json",bytes);
            fs.writeFileSync(out+"/ipos-report.json",JSON.stringify({checked_at:new Date().toISOString(),status:response.status,expected_sha256:expectedHash,served_sha256:last,match:response.ok&&last===expectedHash,attempt},null,2)+"\n");
            if(response.ok&&last===expectedHash){
              const data=JSON.parse(bytes);
              console.log(JSON.stringify({pages_dataset_verified:true,records:data.records?.length??null,generated_at:data.generated_at??null,sha256:last,attempt}));
              process.exit(0);
            }
            if(attempt<5)await new Promise(r=>setTimeout(r,15000));
          }
          throw new Error("served_dataset_mismatch expected="+expectedHash+" actual="+last);
          NODE

          # Compare DRHP data and directory assets with the same uploaded tree.
          for attempt in $(seq 1 5); do
            if node scripts/verify-drhp-publication.mjs --output-dir="$RUNNER_TEMP/pages-verification/drhp"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1

      - name: Retain served dataset bytes and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-verification
          retention-days: 14
          if-no-files-found: warn

      - name: Record Pages publication health
        if: always()
        env:
          PAGES_DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGES_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PAGES_DEPLOY_COMMIT_SHA: ${{ steps.revision.outputs.sha }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          export PAGES_DEPLOY_COMPLETED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Pages publication-state attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            # Recompute the deployment state against the newest committed
            # operational state instead of rebasing a modified JSON file.
            node scripts/record-pages-publication.mjs
            node scripts/validate-operator-state.mjs

            if git diff --quiet -- ops/pages-publication.json; then
              echo "Latest main already contains this Pages publication state."
              exit 0
            fi

            git add ops/pages-publication.json
            git commit -m "chore(ops): record Pages publication health"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main advanced during Pages-state publication; retrying semantic recompute."
          done

          echo "Failed to publish Pages state after 3 semantic attempts." >&2
          exit 1
