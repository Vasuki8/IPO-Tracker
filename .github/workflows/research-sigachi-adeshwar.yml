name: Research Sigachi and Adeshwar official evidence
on:
  push:
    branches: [research/bse-2021-sigachi-adeshwar-20260927]
    paths: [.github/workflows/research-sigachi-adeshwar.yml]
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fresh official discovery pages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs";import path from "node:path";import {createHash} from "node:crypto";
          const out=process.env.OUT,docs=[],errors=[];
          const seeds=[
            ["sigachi_bse_listing","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20211112-2"],
            ["sigachi_sebi","https://www.sebi.gov.in/filings/public-issues/oct-2021/sigachi-industries-limited_53518.html"],
            ["adeshwar_bse_listing","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20210614-12"],
            ["adeshwar_sebi","https://www.sebi.gov.in/filings/public-issues/jun-2021/adeshwar-meditex-limited_50569.html"]
          ];
          const hosts=new Set(["www.bseindia.com","bseindia.com","www.sebi.gov.in","sebi.gov.in"]);
          for(const[k,u]of seeds){let last;for(let a=1;a<=3;a++){try{const r=await fetch(u,{redirect:"follow",signal:AbortSignal.timeout(45000),headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/pdf,*/*"}});if(!r.ok||!hosts.has(new URL(r.url).hostname))throw Error("bad_"+r.status);const b=Buffer.from(await r.arrayBuffer()),file=k+(b.subarray(0,5).toString()==="%PDF-"?".pdf":".html");fs.writeFileSync(path.join(out,file),b);docs.push({key:k,source_url:u,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),file,collected_at:new Date().toISOString(),attempt:a});break}catch(e){last=e;if(a===3)errors.push(k+":"+e.message);else await new Promise(r=>setTimeout(r,a*1500))}}}
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({documents:docs,errors},null,2)+"\n");console.log(JSON.stringify({documents:docs.length,errors}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sigachi-adeshwar-official-research
          path: ${{ runner.temp }}/evidence
          retention-days: 3
          if-no-files-found: error
