name: Probe P2 NSE IPO detail

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-nse-detail.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Probe recent IPO detail payloads
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'scripts')
          import track_subscriptions as t

          client = t.NSESubscriptionClient()
          samples = [
              ('ANNU', 'Mainboard'),
              ('DEEPA', 'Mainboard'),
              ('ESDS', 'Mainboard'),
              ('SKYWAYS', 'Mainboard'),
              ('GAJA', 'Mainboard'),
              ('KANOHAR', 'Mainboard'),
              ('SHANTIINOR', 'SME'),
              ('MADHURKNIT', 'SME'),
          ]
          for symbol, board in samples:
              print(f'=== {symbol} {board} ===')
              try:
                  payload, series = client.detail(symbol, board)
                  print('series=', series)
                  if isinstance(payload, dict):
                      print('keys=', sorted(payload.keys()))
                      compact = {k: payload.get(k) for k in payload.keys() if k != 'bidDetails'}
                      print(json.dumps(compact, indent=2, default=str)[:12000])
                      bids = payload.get('bidDetails')
                      if isinstance(bids, list):
                          print('bidDetails rows=', len(bids))
                  else:
                      print(type(payload).__name__, repr(payload)[:2000])
              except Exception as exc:
                  print('ERROR', type(exc).__name__, str(exc)[:1000])
          PY
