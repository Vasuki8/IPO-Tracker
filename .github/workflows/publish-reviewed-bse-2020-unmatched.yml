name: Validate completed BSE 2020 unmatched release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/verified-bse-listings/2026-09-26-bse-2020-unmatched-four.json'
      - 'scripts/apply-reviewed-bse-2020-unmatched.mjs'
      - 'scripts/test-reviewed-bse-2020-unmatched-import.mjs'
      - 'scripts/test-completed-bse-2020-workflow.mjs'
      - '.github/workflows/publish-reviewed-bse-2020-unmatched.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/verified-bse-listings/2026-09-26-bse-2020-unmatched-four.json'
      - 'scripts/apply-reviewed-bse-2020-unmatched.mjs'
      - 'scripts/test-reviewed-bse-2020-unmatched-import.mjs'
      - 'scripts/test-completed-bse-2020-workflow.mjs'
      - '.github/workflows/publish-reviewed-bse-2020-unmatched.yml'
# Historical one-shot publication is complete. Later recovery enrichment is
# expected; validate the release in isolation instead of replaying its importer.
permissions:
  contents: read
concurrency:
  group: publish-reviewed-bse-2020-unmatched
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Validate completed release without changing production
        run: |
          node scripts/test-completed-bse-2020-workflow.mjs
          node scripts/test-bse-2020-unmatched-review.mjs
          node scripts/test-reviewed-bse-2020-unmatched-import.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code
