name: Sync SEBI DRHP filings
on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-sebi-drhp.mjs
      - scripts/drhp-integrity.mjs
      - scripts/verify-drhp-publication.mjs
      - scripts/test-sync-sebi-drhp.mjs
      - scripts/test-drhp-integrity.mjs
      - scripts/test-drhp-ui.mjs
      - .github/workflows/update-drhp.yml
permissions:
  contents: write
concurrency:
  group: sebi-drhp-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test DRHP integrity
        run: |
          node scripts/test-sync-sebi-drhp.mjs
          node scripts/test-drhp-integrity.mjs
          node scripts/test-drhp-lifecycle.mjs
          node scripts/test-drhp-ui.mjs
      - name: Collect explicit 2026 DRHP filings and retain original pages
        id: collect
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/drhp-evidence"
          node scripts/sync-sebi-drhp.mjs --year=2026 --max-pages=16 --output="$RUNNER_TEMP/drhp-evidence/incoming.json" --retain-sources="$RUNNER_TEMP/drhp-evidence/pages"
      - name: Preserve filing history and record the collection result
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$COLLECTION_OUTCOME" = "success" ]; then
              node scripts/drhp-integrity.mjs --current=data/drhp-filings.json --incoming="$RUNNER_TEMP/drhp-evidence/incoming.json" --output=data/drhp-filings.json
              node scripts/test-drhp-ui.mjs
            fi
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('data/drhp-filings.json'));
          fs.writeFileSync('ops/drhp-collection.json',JSON.stringify({schema_version:'1.0.0',status:process.env.COLLECTION_OUTCOME==='success'?'success':'failed',attempted_at:new Date().toISOString(),run_id:process.env.GITHUB_RUN_ID,last_successful_collection_at:d.collection_completed_at||d.source_pages.at(-1).collected_at,companies:d.companies.length,filings:d.coverage.filing_records,source_pagination_consistent:d.coverage.pagination_consistent??null},null,2)+'\n');
          JS
            git add data/drhp-filings.json ops/drhp-collection.json
            if git diff --cached --quiet; then break; fi
            git commit -m "chore(data): refresh DRHP observations without dropping retained filings"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
          cp data/drhp-filings.json "$RUNNER_TEMP/drhp-evidence/published-data.json"
          cp ops/drhp-collection.json "$RUNNER_TEMP/drhp-evidence/collection-status.json"
          git rev-parse HEAD > "$RUNNER_TEMP/drhp-evidence/published-commit.txt"
      - name: Verify actual Pages data and directory assets
        if: steps.collect.outcome == 'success'
        run: |
          for attempt in $(seq 1 24); do
            if node scripts/verify-drhp-publication.mjs --output-dir="$RUNNER_TEMP/drhp-evidence/live"; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drhp-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drhp-evidence
          retention-days: 14
          if-no-files-found: error
      - name: Surface collection failure without erasing the previous dataset
        if: steps.collect.outcome != 'success'
        run: exit 1
