name: Phase 4.5A exchange tests

on:
  push:
    branches:
      - main
    paths:
      - "scripts/enrich_nse_primary_market_reports.py"
      - "scripts/enrich_nse_primary_market_reports_v2.py"
      - "scripts/enrich_exchange_details_v2.py"
      - "scripts/backfill_bse_history_v2.py"
      - "scripts/apply_verified_lot_sizes.py"
      - "tests/test_nse_primary_market_reports.py"
      - "tests/test_nse_primary_market_reports_v2.py"
      - "tests/test_exchange_details_v2.py"
      - "tests/test_bse_history_backfill.py"
      - "tests/test_verified_lot_sizes.py"
      - ".github/workflows/test-phase45a.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase45a-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Test NSE monthly primary-market parser
        run: uv run python -m unittest discover -s tests -p "test_nse_primary_market_reports.py" -v

      - name: Test NSE monthly-report discovery v2
        run: uv run python -m unittest discover -s tests -p "test_nse_primary_market_reports_v2.py" -v

      - name: Test BSE exchange-detail v2 parser
        run: uv run python -m unittest discover -s tests -p "test_exchange_details_v2.py" -v

      - name: Test BSE historical backfill integration
        run: uv run python -m unittest discover -s tests -p "test_bse_history_backfill.py" -v

      - name: Test verified upcoming lot-size registry
        run: uv run python -m unittest discover -s tests -p "test_verified_lot_sizes.py" -v
