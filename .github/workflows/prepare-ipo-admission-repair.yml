name: Prepare reviewed IPO admission repair branch
on:
  push:
    branches: [fix/ipo-instrument-identity-20261004]
    paths:
      - .github/workflows/prepare-ipo-admission-repair.yml
      - .github/ipo-admission-repair.patch
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Vasuki8/IPO-Tracker' && github.ref == 'refs/heads/fix/ipo-instrument-identity-20261004'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply only the locally reviewed patch and rebuild its derived data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admission-repair"
          cp data/ipos.json "$RUNNER_TEMP/admission-repair/before.json"
          git apply --check .github/ipo-admission-repair.patch
          git apply .github/ipo-admission-repair.patch
          node scripts/test-sync-nse-live.mjs > "$RUNNER_TEMP/admission-repair/collector-tests.txt" 2>&1
          node scripts/build-published-data.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.RUNNER_TEMP+'/admission-repair';
          const beforeBytes=fs.readFileSync(out+'/before.json'),afterBytes=fs.readFileSync('data/ipos.json');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          assert.equal(hash(beforeBytes),'4bf3e7b30cf9c80ac31356c872ebadc94852890151432e416775dfd51c9b9806');
          assert.equal(hash(afterBytes),'7d0fb465758c477e52a8b27ae3c2c896cb1c85af6db228519a9432cdbc0119fa');
          const before=JSON.parse(beforeBytes),after=JSON.parse(afterBytes);
          assert.equal(before.records.length,1389);
          assert.equal(after.records.length,1388);
          const expected={...before,records:before.records.filter(r=>r.id!=='smc-global-securities-limited')};
          assert.deepEqual(after,expected);
          fs.writeFileSync(out+'/preservation.json',JSON.stringify({before_sha256:hash(beforeBytes),after_sha256:hash(afterBytes),only_public_removal:'smc-global-securities-limited',unchanged_records:1388,metadata_unchanged:true},null,2)+'\n');
          fs.writeFileSync(out+'/after.json',afterBytes);
          JS
          git diff --exit-code -- data/recovery
          rm .github/ipo-admission-repair.patch .github/workflows/prepare-ipo-admission-repair.yml
          git add -A
          git diff --cached --check
          # Complete-tree equality pins every byte to the locally tested patch.
          actual_tree="$(git write-tree)"
          test "$actual_tree" = '0ade61e9c741a320e0ce4b2629e252a1fd66acef'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: apply reviewed instrument and issuer-identity safeguards'
          git rev-parse HEAD > "$RUNNER_TEMP/admission-repair/final-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/admission-repair/final-tree.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/admission-repair/source-snapshot.zip"
          # No force, no main write, and no untrusted payload execution.
          git push origin HEAD:refs/heads/fix/ipo-instrument-identity-20261004
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission-repair
          retention-days: 14
          if-no-files-found: error
