name: Publish reviewed Maruti and Olatech 2022 IPOs
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/discovery/bse-2022-maruti-olatech-review-2026-09-28.json'
      - 'data/evidence/bse-2022-maruti-olatech-source-receipt-2026-09-28.json'
      - 'data/verified-bse-listings/2026-09-28-maruti-olatech.json'
      - 'scripts/*maruti-olatech*'
      - 'scripts/build-published-data.mjs'
      - 'scripts/verify-bse-publication.mjs'
      - '.github/workflows/publish-reviewed-bse-2022-maruti-olatech.yml'
  push:
    branches: [main]
    paths:
      - 'data/discovery/bse-2022-maruti-olatech-review-2026-09-28.json'
      - 'data/evidence/bse-2022-maruti-olatech-source-receipt-2026-09-28.json'
      - 'data/verified-bse-listings/2026-09-28-maruti-olatech.json'
      - 'scripts/*maruti-olatech*'
      - '.github/workflows/publish-reviewed-bse-2022-maruti-olatech.yml'
permissions: {contents: read}
concurrency:
  group: bse-2022-maruti-olatech
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Rehearse bounded import and public projection
        run: |
          node scripts/test-reviewed-bse-2022-maruti-olatech.mjs
          node scripts/apply-reviewed-bse-2022-maruti-olatech.mjs --apply
          node scripts/build-published-data.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          node scripts/test-reviewed-bse-2022-maruti-olatech.mjs
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Recompute and publish on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/test-reviewed-bse-2022-maruti-olatech.mjs
            node scripts/apply-reviewed-bse-2022-maruti-olatech.mjs --apply
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs
            node scripts/test-reviewed-bse-2022-maruti-olatech.mjs
            git add data/recovery/2022/nse-issue-information.json data/ipos.json
            git diff --cached --quiet && exit 0
            git commit -m 'data: publish reviewed Maruti and Olatech 2022 IPOs'
            git push origin HEAD:main && exit 0
          done
          exit 1
  verify-live:
    needs: publish
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Verify actual GitHub Pages bytes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            VERIFICATION_DIR="$RUNNER_TEMP/verification/attempt-$attempt" node scripts/verify-bse-2022-maruti-olatech.mjs && exit 0
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2022-maruti-olatech-live
          path: ${{ runner.temp }}/verification
          retention-days: 14
          if-no-files-found: error
