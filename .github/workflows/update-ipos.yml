name: Sync live IPO data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/bse-ipo-sources.json"
      - "data/verified-bse-listings/**"
      - "data/verified-nse-ipos/**"
      - "scripts/apply-reviewed-nse-ipos.mjs"
      - "scripts/test-reviewed-nse-ipos.mjs"
      - "scripts/apply-verified-bse-listings.mjs"
      - "scripts/test-apply-verified-bse-listings.mjs"
      - "scripts/audit-bse-sme-ipo-index.mjs"
      - "scripts/test-audit-bse-sme-ipo-index.mjs"
      - "scripts/audit-historical-coverage.mjs"
      - "scripts/test-audit-historical-coverage.mjs"
      - "scripts/extract-bse-ipo-fields.mjs"
      - "scripts/test-extract-bse-ipo-fields.mjs"
      - "scripts/diagnose-bse-issues.mjs"
      - "scripts/test-diagnose-bse-issues.mjs"
      - "scripts/historical-batch-selection.mjs"
      - "scripts/test-historical-batch-selection.mjs"
      - "scripts/backfill-nse-historical-detail.mjs"
      - "scripts/test-backfill-nse-historical-detail.mjs"
      - "scripts/sync-nse-historical.mjs"
      - "scripts/test-sync-nse-historical.mjs"
      - "scripts/prepare-live-sync-proposal.mjs"
      - "scripts/apply-live-sync-proposal.mjs"
      - "scripts/test-live-sync-semantic-publication.mjs"
      - "scripts/sync-nse-live.mjs"
      - "scripts/test-sync-nse-live.mjs"
      - "scripts/sync-sebi-documents.mjs"
      - "scripts/test-sync-sebi-documents.mjs"
      - "scripts/extract-abridged-fields.mjs"
      - "scripts/test-extract-abridged-fields.mjs"
      - "scripts/extract-prospectus-fields.mjs"
      - "scripts/test-extract-prospectus-fields.mjs"
      - "scripts/fixtures/prospectus-issue-price-layout.json"
      - "scripts/fixtures/prospectus-issue-size-layout.json"
      - "scripts/fixtures/abridged-issue-size-layout.json"
      - "scripts/fixtures/sebi-public-issues-sample.html"
      - "scripts/fixtures/sebi-rhp-detail-sample.html"
      - "scripts/fixtures/sebi-prospectus-detail-sample.html"
      - "scripts/build-published-data.mjs"
      - "scripts/publish-field-status.mjs"
      - "scripts/test-publish-field-status.mjs"
      - "scripts/operator-report.mjs"
      - "scripts/test-operator-report.mjs"
      - "scripts/record-operator-snapshot.mjs"
      - "scripts/test-record-operator-snapshot.mjs"
      - "scripts/validate-operator-state.mjs"
      - "scripts/test-validate-operator-state.mjs"
      - "scripts/diagnose-nse-issue-information.mjs"
      - "scripts/test-diagnose-nse-issue-information.mjs"
      - "scripts/diagnose-nse-ipo-detail.mjs"
      - "scripts/test-diagnose-nse-ipo-detail.mjs"
      - "scripts/extract-nse-ipo-detail-fields.mjs"
      - "scripts/test-extract-nse-ipo-detail-fields.mjs"
      - "scripts/diagnose-nse-past-issues.mjs"
      - "scripts/test-diagnose-nse-past-issues.mjs"
      - "scripts/extract-nse-past-issues-fields.mjs"
      - "scripts/test-extract-nse-past-issues-fields.mjs"
      - ".github/workflows/update-ipos.yml"

permissions:
  contents: write

concurrency:
  group: live-ipo-sync
  cancel-in-progress: true

jobs:
  # PR #342 passed 93 test entry points; exact release trigger, retire after closeout.
  reviewed_irms:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(irms):')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Check reviewed IRMS release before publication
        run: node scripts/test-reviewed-bse-2023-irms.mjs
      - name: Publish exactly the reviewed IRMS batch against latest main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/irms-publication"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp data/ipos.json "$RUNNER_TEMP/irms-publication/before.json"
            node scripts/apply-reviewed-bse-2023-irms.mjs --apply > "$RUNNER_TEMP/irms-publication/import.json"
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {context,expected} from './scripts/apply-reviewed-bse-2023-irms.mjs';
          import {expectedPublic} from './scripts/verify-bse-2023-rvpe.mjs';
          const dir=process.env.RUNNER_TEMP+'/irms-publication';
          const before=JSON.parse(fs.readFileSync(dir+'/before.json')),after=JSON.parse(fs.readFileSync('data/ipos.json'));
          const byId=new Map(after.records.map(r=>[r.id,r]));
          assert.equal(byId.size,after.records.length);
          for(const r of before.records)assert.deepEqual(byId.get(r.id),r,'unrelated_public_record_changed:'+r.id);
          const targets=expected(context()).map(expectedPublic);
          for(const r of targets)assert.deepEqual(byId.get(r.id),r,'reviewed_public_projection_mismatch:'+r.id);
          const added=after.records.filter(r=>!before.records.some(b=>b.id===r.id));
          assert.ok(added.length===0||added.length===4);
          assert.ok(added.every(r=>targets.some(t=>t.id===r.id)));
          fs.writeFileSync(dir+'/preservation.json',JSON.stringify({existing_records_unchanged:before.records.length,added:added.length,published_records:after.records.length},null,2)+'\n');
          NODE
            changed="$(git diff --name-only)"
            while IFS= read -r file; do
              case "$file" in ''|data/recovery/2023/nse-issue-information.json|data/ipos.json) ;; *) echo "Unexpected mutation: $file"; exit 1;; esac
            done <<< "$changed"
            cp data/ipos.json "$RUNNER_TEMP/irms-publication/ipos.json"
            if [ -z "$changed" ]; then git rev-parse HEAD > "$RUNNER_TEMP/irms-publication/data-commit.txt"; exit 0; fi
            git add data/recovery/2023/nse-issue-information.json data/ipos.json
            git commit -m "data(irms): publish four reviewed 2023 IPOs"
            if git push origin HEAD:main; then git rev-parse HEAD > "$RUNNER_TEMP/irms-publication/data-commit.txt"; exit 0; fi
          done
          exit 1
      - name: Retain actual publication outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irms-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/irms-publication
          retention-days: 14
          if-no-files-found: error

  sync:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release(irms):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test BSE issue-summary diagnostic parser
        run: node scripts/test-diagnose-bse-issues.mjs

      - name: Diagnose official BSE IPO coverage
        run: node scripts/diagnose-bse-issues.mjs

      - name: Test BSE detail and listing parsers
        run: node scripts/test-extract-bse-ipo-fields.mjs

      - name: Test live-feed parsing
        run: node scripts/test-sync-nse-live.mjs

      - name: Test SEBI document matching
        run: node scripts/test-sync-sebi-documents.mjs

      - name: Collect NSE live IPO feed
        id: collect_nse
        run: node scripts/sync-nse-live.mjs

      - name: Materialize 2020-2025 NSE historical IPO universes
        run: node scripts/sync-nse-historical.mjs --year=2020-2025

      - name: Apply reviewed BSE listing evidence without network access
        run: node scripts/apply-verified-bse-listings.mjs

      - name: Test and apply reviewed NSE IPO evidence
        run: |
          node scripts/test-reviewed-nse-ipos.mjs
          node scripts/apply-reviewed-nse-ipos.mjs

      - name: Apply retained official BSE IPO sources
        run: node scripts/extract-bse-ipo-fields.mjs

      - name: Backfill historical NSE issue details
        run: node scripts/backfill-nse-historical-detail.mjs

      - name: Audit historical IPO coverage
        run: node scripts/audit-historical-coverage.mjs

      - name: Attach SEBI offer documents
        id: collect_sebi
        run: node scripts/sync-sebi-documents.mjs

      - name: Install PDF text extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Test retained field publication status
        run: node scripts/test-publish-field-status.mjs

      - name: Test Abridged Prospectus field extraction
        run: node scripts/test-extract-abridged-fields.mjs

      - name: Test final Prospectus field extraction
        run: node scripts/test-extract-prospectus-fields.mjs

      - name: Test NSE Issue Information diagnostic parser
        run: node scripts/test-diagnose-nse-issue-information.mjs

      - name: Test NSE ipo-detail diagnostic
        run: node scripts/test-diagnose-nse-ipo-detail.mjs

      - name: Test NSE ipo-detail field extraction
        run: node scripts/test-extract-nse-ipo-detail-fields.mjs

      - name: Test NSE public past-issues final-price extraction
        run: node scripts/test-extract-nse-past-issues-fields.mjs

      - name: Extract NSE public past-issues listing date and final price
        run: node scripts/extract-nse-past-issues-fields.mjs

      - name: Extract NSE Issue Information fields in one pass
        run: node scripts/extract-nse-ipo-detail-fields.mjs --all-fields

      - name: Extract explicit Abridged Prospectus fields
        run: node scripts/extract-abridged-fields.mjs

      - name: Extract explicit final Prospectus fields
        run: node scripts/extract-prospectus-fields.mjs

      - name: Extract explicit final Prospectus issue size
        run: node scripts/extract-prospectus-fields.mjs --issue-size

      - name: Extract explicit final Prospectus minimum bid
        run: node scripts/extract-prospectus-fields.mjs --minimum-bid

      - name: Rebuild published dataset
        id: rebuild
        run: node scripts/build-published-data.mjs

      - name: Check recovery publication
        run: node scripts/build-published-data.mjs --check

      - name: Validate published IPO data
        id: validate_data
        run: node scripts/validate-data.mjs

      - name: Test semantic live-sync publication
        run: node scripts/test-live-sync-semantic-publication.mjs

      - name: Prepare semantic live-sync proposal
        id: live_proposal
        shell: bash
        run: |
          node scripts/prepare-live-sync-proposal.mjs --output=/tmp/live-sync-proposal.json
          changed="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/live-sync-proposal.json','utf8'));const yes=Object.keys(p.recovery||{}).length>0||Object.keys(p.cursors||{}).length>0||p.published_data_changed===true;process.stdout.write(yes?'true':'false')")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Publish source-backed data changes
        id: publish_data
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.live_proposal.outputs.changed }}" != "true" ]; then
            echo "No source-backed IPO data, cursor, or rebuild changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Semantic live publication attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            node scripts/apply-live-sync-proposal.mjs --input=/tmp/live-sync-proposal.json
            # Recheck reviewed NSE identities after rebasing onto latest main.
            node scripts/apply-reviewed-nse-ipos.mjs
            node scripts/build-published-data.mjs
            node scripts/build-published-data.mjs --check
            node scripts/validate-data.mjs

            if [ -z "$(git status --porcelain -- data/recovery data/ipos.json ops/sebi-historical-search.json ops/nse-historical-detail.json)" ]; then
              echo "Latest main already contains all semantic live-sync results."
              exit 0
            fi

            git add data/recovery data/ipos.json
            if [ -f ops/sebi-historical-search.json ]; then git add ops/sebi-historical-search.json; fi
            if [ -f ops/nse-historical-detail.json ]; then git add ops/nse-historical-detail.json; fi
            git commit -m "chore(data): sync official IPO sources"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main advanced during live publication; retrying semantic apply."
          done

          echo "Failed to publish semantic live-sync results after 3 attempts." >&2
          exit 1

      - name: Operator freshness and source-health summary
        if: always()
        env:
          NSE_COLLECTION_OUTCOME: ${{ steps.collect_nse.outcome }}
          SEBI_COLLECTION_OUTCOME: ${{ steps.collect_sebi.outcome }}
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_data.outcome }}
          REPOSITORY_PUBLISH_OUTCOME: ${{ steps.publish_data.outcome }}
        run: node scripts/operator-report.mjs --github-summary

      - name: Persist latest operator snapshot
        if: always()
        env:
          NSE_COLLECTION_OUTCOME: ${{ steps.collect_nse.outcome }}
          SEBI_COLLECTION_OUTCOME: ${{ steps.collect_sebi.outcome }}
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_data.outcome }}
          REPOSITORY_PUBLISH_OUTCOME: ${{ steps.publish_data.outcome }}
        shell: bash
        run: |
          node scripts/record-operator-snapshot.mjs
          node scripts/validate-operator-state.mjs

          snapshot_changed=1
          history_changed=1
          if git ls-files --error-unmatch ops/operator-snapshot.json >/dev/null 2>&1 && git diff --quiet -- ops/operator-snapshot.json; then
            snapshot_changed=0
          fi
          if git ls-files --error-unmatch ops/operator-health-history.json >/dev/null 2>&1 && git diff --quiet -- ops/operator-health-history.json; then
            history_changed=0
          fi
          if [ "$snapshot_changed" -eq 0 ] && [ "$history_changed" -eq 0 ]; then
            echo "Operator snapshot and health history are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/operator-snapshot.json ops/operator-health-history.json
          git commit -m "chore(ops): record operator state"

          # The sync may have left tracked recovery/public-data mutations in the
          # worktree even when rebuild/validation failed. They are deliberately
          # not part of this ops-only commit and must not block or leak into the
          # operator-state publication.
          git reset --hard HEAD

          # Preserve data/Pages bot commits that may have advanced main since
          # checkout before publishing the latest operational snapshot.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
