name: Sync live IPO data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/sync-nse-live.mjs"
      - "scripts/test-sync-nse-live.mjs"
      - "scripts/sync-sebi-documents.mjs"
      - "scripts/test-sync-sebi-documents.mjs"
      - "scripts/extract-abridged-fields.mjs"
      - "scripts/test-extract-abridged-fields.mjs"
      - "scripts/extract-prospectus-fields.mjs"
      - "scripts/test-extract-prospectus-fields.mjs"
      - "scripts/fixtures/prospectus-issue-price-layout.json"
      - "scripts/fixtures/prospectus-issue-size-layout.json"
      - "scripts/fixtures/abridged-issue-size-layout.json"
      - "scripts/fixtures/sebi-public-issues-sample.html"
      - "scripts/fixtures/sebi-rhp-detail-sample.html"
      - "scripts/fixtures/sebi-prospectus-detail-sample.html"
      - "scripts/build-published-data.mjs"
      - "scripts/publish-field-status.mjs"
      - "scripts/test-publish-field-status.mjs"
      - ".github/workflows/update-ipos.yml"

permissions:
  contents: write

concurrency:
  group: live-ipo-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test live-feed parsing
        run: node scripts/test-sync-nse-live.mjs

      - name: Test SEBI document matching
        run: node scripts/test-sync-sebi-documents.mjs

      - name: Collect NSE live IPO feed
        run: node scripts/sync-nse-live.mjs

      - name: Attach SEBI offer documents
        run: node scripts/sync-sebi-documents.mjs

      - name: Install PDF text extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Test retained field publication status
        run: node scripts/test-publish-field-status.mjs

      - name: Test Abridged Prospectus field extraction
        run: node scripts/test-extract-abridged-fields.mjs

      - name: Test final Prospectus field extraction
        run: node scripts/test-extract-prospectus-fields.mjs

      - name: Diagnose final Prospectus minimum bid quantity
        run: node scripts/extract-prospectus-fields.mjs --diagnose-prospectus-min-bid

      - name: Extract explicit Abridged Prospectus fields
        run: node scripts/extract-abridged-fields.mjs

      - name: Extract explicit final Prospectus fields
        run: node scripts/extract-prospectus-fields.mjs

      - name: Extract explicit final Prospectus issue size
        run: node scripts/extract-prospectus-fields.mjs --issue-size

      - name: Rebuild published dataset
        run: node scripts/build-published-data.mjs

      - name: Check recovery publication
        run: node scripts/build-published-data.mjs --check

      - name: Validate published IPO data
        run: node scripts/validate-data.mjs

      - name: Publish source-backed data changes
        shell: bash
        run: |
          if git diff --quiet -- data/recovery data/ipos.json; then
            echo "No source-backed IPO data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery data/ipos.json
          git commit -m "chore(data): sync official IPO sources"
          git push
