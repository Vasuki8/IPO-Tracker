name: Probe P4 modern BSE history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-p4-bse-modern.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch BSE public-issue SPA
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          curl --http1.1 -sS -L --max-time 30 -A "$UA" \
            -H "Accept: text/html,application/xhtml+xml,*/*" \
            "https://www.bseindia.com/markets/PublicIssues/Issuesummary.aspx" \
            -o /tmp/issue-summary.html
          echo "SUMMARY SIZE $(wc -c </tmp/issue-summary.html)"

      - name: Discover and download SPA assets
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin

          root = "https://www.bseindia.com/markets/PublicIssues/Issuesummary.aspx"
          raw = Path('/tmp/issue-summary.html').read_text(encoding='utf-8', errors='ignore')
          assets = [urljoin(root, s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)', raw, re.I)]
          print('ASSETS', len(assets))
          for index, url in enumerate(assets):
              print(index, url)
              subprocess.run([
                  'curl', '--http1.1', '-sS', '-L', '--max-time', '30',
                  '-A', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
                  url, '-o', f'/tmp/asset-{index}.js'
              ], check=False)
          Path('/tmp/assets.txt').write_text('\n'.join(assets), encoding='utf-8')

      - name: Extract API bases and public-issue route strings
        shell: python
        run: |
          import re
          from pathlib import Path

          assets = Path('/tmp/assets.txt').read_text(encoding='utf-8').splitlines()
          needles = (
              'issue', 'ipo', 'publicissue', 'publicissues', 'displayipo',
              'issuesummary', 'homepage', 'bseindiaapi', 'apiurl', 'baseurl'
          )
          for index, url in enumerate(assets):
              path = Path(f'/tmp/asset-{index}.js')
              if not path.exists():
                  continue
              raw = path.read_text(encoding='utf-8', errors='ignore')
              print('\n===', index, url, 'bytes=', len(raw), '===')
              if url.lower().endswith('/env.js'):
                  print('ENV CONTENT')
                  print(raw[:20000])

              # Absolute URLs are especially useful because Angular production
              # bundles often concatenate the API base with short endpoint names.
              urls = []
              for match in re.findall(r'https?://[^"\'`\\\s)]+', raw, re.I):
                  value = match.rstrip(';,}')
                  if value not in urls:
                      urls.append(value)
              print('ABSOLUTE URLS')
              for value in urls[:100]:
                  print(value)

              lower = raw.lower()
              emitted = set()
              print('ROUTE CONTEXT')
              for needle in needles:
                  start = 0
                  while True:
                      pos = lower.find(needle, start)
                      if pos < 0:
                          break
                      snippet = raw[max(0, pos-700):pos+1800]
                      key = snippet[:250]
                      if key not in emitted:
                          emitted.add(key)
                          print('NEEDLE', needle, snippet[:2500])
                      start = pos + len(needle)
                      if len(emitted) >= 80:
                          break
                  if len(emitted) >= 80:
                      break

      - name: Probe likely modern public-issue endpoints
        shell: bash
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          for URL in \
            "https://api.bseindia.com/BseIndiaAPI/api/IPO_HomePageDetail/w" \
            "https://api.bseindia.com/BseIndiaAPI/api/IssueSummary/w" \
            "https://api.bseindia.com/BseIndiaAPI/api/IPOProcessStatus/w" \
            "https://api.bseindia.com/BseIndiaAPI/api/PublicIssue/w"; do
            echo "=== $URL ==="
            curl --http1.1 -sS -L --max-time 20 -A "$UA" \
              -H "Origin: https://www.bseindia.com" \
              -H "Referer: https://www.bseindia.com/markets/PublicIssues/Issuesummary.aspx" \
              -D /tmp/probe-h.txt "$URL" -o /tmp/probe-b.txt || true
            head -5 /tmp/probe-h.txt || true
            head -c 1200 /tmp/probe-b.txt || true
            echo
          done