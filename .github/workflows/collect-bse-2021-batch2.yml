name: Collect BSE 2021 batch2 official sources
on:
  push:
    branches: [data/bse-2021-batch2-20260926]
    paths: [.github/workflows/collect-bse-2021-batch2.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Fetch bounded original official sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/batch2"
          OUT="$RUNNER_TEMP/batch2" node --input-type=module <<'JS'
          import fs from "node:fs"; import path from "node:path"; import {createHash} from "node:crypto"; import {execFileSync} from "node:child_process";
          const out=process.env.OUT,docs=[],errors=[];
          const seeds=[
            ["nureca_filing","https://www.sebi.gov.in/filings/public-issues/feb-2021/nureca-limited_49230.html",true],
            ["nureca_bulletin","https://www.sebi.gov.in/reports-and-statistics/publications/apr-2021/sebi-bulletin-march-2021_49910.html",true],
            ["nureca_identity","https://nsearchives.nseindia.com/corporate/ixbrl/INTEGRATED_FILING_INDAS_120280_16102025210315_iXBRL_WEB.html",false],
            ["paras_filing","https://www.sebi.gov.in/filings/public-issues/sep-2021/paras-defence-and-space-technologies-limited_70271.html",true],
            ["paras_listing","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20210930-7",false]
          ];
          const allowed=v=>{const u=new URL(v);if(u.protocol!=="https:"||u.username||u.password||!["www.sebi.gov.in","sebi.gov.in","www.bseindia.com","bseindia.com","nsearchives.nseindia.com"].includes(u.hostname))throw Error("unsafe_url");return u.href};
          async function get(key,url){const requested_at=new Date().toISOString();let last;for(let attempt=1;attempt<=3;attempt++){try{const r=await fetch(allowed(url),{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,text/html,*/*"}}),final_url=allowed(r.url);if(!r.ok)throw Error("http_"+r.status);const chunks=[];let n=0;for await(const b of r.body){n+=b.length;if(n>60*1024*1024)throw Error("size_limit");chunks.push(Buffer.from(b))}const bytes=Buffer.concat(chunks),pdf=bytes.subarray(0,5).toString()==="%PDF-";if(!pdf&&!/text\/html/i.test(r.headers.get("content-type")||""))throw Error("unexpected_type");const file=key+(pdf?".pdf":".html");fs.writeFileSync(path.join(out,file),bytes);docs.push({key,source_url:url,final_url,requested_at,collected_at:new Date().toISOString(),http_status:r.status,content_type:r.headers.get("content-type"),response_bytes:bytes.length,response_sha256:createHash("sha256").update(bytes).digest("hex"),file,attempt});if(pdf)execFileSync("pdftotext",["-layout",path.join(out,file),path.join(out,key+".txt")]);return{bytes,pdf}}catch(e){last=e;if(attempt<3)await new Promise(r=>setTimeout(r,attempt*2000))}}throw Error(key+":"+last.message)}
          for(const[key,url,follow]of seeds){try{const{bytes,pdf}=await get(key,url);if(follow&&!pdf){const html=bytes.toString("utf8").replace(/&amp;/g,"&"),links=[...new Set((html.match(/https?:\/\/[^\s"'<>]+\.pdf/gi)||[]).map(allowed))];if(links.length!==1)throw Error("expected_one_pdf:"+key+":"+links.length);await get(key+"_pdf",links[0])}}catch(e){errors.push(e.message)}}
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({schema_version:"1.0.0",source_commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,read_only:true,documents:docs,errors},null,2)+"\n");console.log(JSON.stringify({documents:docs.length,errors}));if(errors.length)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2021-batch2-source-bytes
          path: ${{ runner.temp }}/batch2
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
