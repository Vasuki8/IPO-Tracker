name: Probe P2 SEBI filing registers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-sebi-registers.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Inspect SEBI pagination implementation
        shell: bash
        run: |
          uv run python - <<'PY'
          import re,requests,sys
          from bs4 import BeautifulSoup
          sys.path.insert(0,'scripts')
          import update_data as core
          url='https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&smid=12&ssid=15'
          s=requests.Session(); s.headers.update(core.HEADERS)
          r=s.get(url,timeout=30); r.raise_for_status(); raw=r.text
          print('LEN',len(raw))
          for needle in ('function searchFormNewsList','searchFormNewsList =','searchFormNewsList('):
              pos=raw.find(needle)
              if pos>=0:
                  print('=== FUNCTION CONTEXT ===')
                  print(raw[max(0,pos-2500):pos+7000])
                  break
          soup=BeautifulSoup(raw,'html.parser')
          print('=== FORMS ===')
          for form in soup.find_all('form'):
              print('FORM',form.get('id'),form.get('name'),form.get('method'),form.get('action'))
              for tag in form.find_all(['input','select']):
                  print(tag.name,tag.get('type'),tag.get('id'),tag.get('name'),tag.get('value'))
          PY
