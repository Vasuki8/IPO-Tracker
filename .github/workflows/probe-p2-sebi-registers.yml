name: Probe P2 SEBI filing registers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-sebi-registers.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Validate GET-based SEBI issuer search
        shell: bash
        run: |
          uv run python - <<'PY'
          import requests,sys
          from bs4 import BeautifulSoup
          sys.path.insert(0,'scripts')
          import update_data as core
          s=requests.Session(); s.headers.update(core.HEADERS)
          base='https://www.sebi.gov.in/sebiweb/home/HomeAction.do'
          for company in ('SYMBIOTEC PHARMALAB LIMITED','Rays of Belief Limited','Sunshine Pictures Limited','HORIZON INDUSTRIAL PARKS LIMITED','Purple Style Labs Limited'):
              print('\n===',company,'===')
              r=s.get(base,params={'doListingAll':'yes','search':company},timeout=30)
              print('HTTP',r.status_code,r.url,'LEN',len(r.text)); r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              rows=[]
              for tr in soup.select('table tbody tr'):
                  a=tr.select_one('a[href*="/filings/public-issues/"]')
                  if not a: continue
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all('td')]
                  rows.append((cells,' '.join(a.stripped_strings),a.get('href')))
              print('ROWS',len(rows))
              for row in rows[:10]: print(row)
          PY
