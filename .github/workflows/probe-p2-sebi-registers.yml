name: Probe P2 SEBI filing registers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-p2-sebi-registers.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Inspect dedicated SEBI register pagination
        shell: bash
        run: |
          uv run python - <<'PY'
          import requests, sys
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          sys.path.insert(0, 'scripts')
          import update_data as core

          urls={
            'RHP':'https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&smid=11&ssid=15',
            'PROSPECTUS':'https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&smid=12&ssid=15',
          }
          s=requests.Session(); s.headers.update(core.HEADERS)
          for typ, base in urls.items():
              r=s.get(base, timeout=30); r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              print('===',typ,'===')
              for a in soup.select('a[href]'):
                  text=' '.join(a.stripped_strings).strip()
                  href=urljoin(base, a.get('href'))
                  low=(text+' '+href).lower()
                  if any(x in low for x in ('next','page','start','record','pageno','pagination')) or text in {'2','3','4','5','6'}:
                      print(repr(text), href)
              for tag in soup.select('input,select,option,form'):
                  attrs={k:v for k,v in tag.attrs.items() if k in ('name','value','action','id')}
                  raw=str(attrs).lower()
                  if any(x in raw for x in ('page','start','record','offset','pageno')):
                      print(tag.name, attrs)
          PY
