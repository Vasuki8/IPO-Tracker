name: Audit P4 residuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/audit_p4_residuals.py"
      - ".github/workflows/audit-p4-residuals.yml"
  workflow_run:
    workflows:
      - "Finish P4 offer-document gaps"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Build residual P4 audit
        run: python scripts/audit_p4_residuals.py > p4-residuals.json
      - name: Print residual P4 summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("p4-residuals.json").read_text(encoding="utf-8"))
          print("P4 actionable records:", report["actionableRecordCount"])
          print("P4 actionable field gaps:", report["actionableFieldGapCounts"])
          print("Classification candidates:", report["classificationCandidateCount"])
          print("Lot attempt statuses:", report["lotAttemptStatusCountsForMissingLots"])
          print("Term attempt statuses:", report["termAttemptStatusCountsForTermGaps"])
          print("Resolved unavailable records:", report["resolvedUnavailableRecordCount"])
          PY
      - name: Upload residual P4 audit
        uses: actions/upload-artifact@v4
        with:
          name: p4-residuals-${{ github.run_id }}
          path: p4-residuals.json
          if-no-files-found: error
          retention-days: 14
