name: Audit P4 residuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/audit_p4_residuals.py"
      - ".github/workflows/audit-p4-residuals.yml"
  workflow_run:
    workflows:
      - "Finish P4 offer-document gaps"
    types:
      - completed

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Print residual P4 audit
        run: python scripts/audit_p4_residuals.py
