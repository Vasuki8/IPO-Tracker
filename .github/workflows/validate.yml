name: Validate IPO changes

on:
  pull_request:
  push:
    branches: [main, data-correctness-and-reliability]
    paths: ['scripts/**', 'tests/**', '*.js', '.github/workflows/**', 'pyproject.toml', 'uv.lock', 'data/verified_corrections.json']

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check company-page.js
          node --check company.js
          node --check source-health.js
          node --check phase3.js
          node --check phase4.js
          node --check completeness.js
      - name: Run all regression tests together
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build and verify compact public browser payloads
        run: |
          uv run --frozen python scripts/build_company_pages.py
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path

          master_path = Path('data/ipos.json')
          summary_path = Path('data/ipos-summary.json')
          manifest_path = Path('ipo/routes.json')
          master = json.loads(master_path.read_text(encoding='utf-8'))
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          master_count = len(master.get('ipos') or [])
          summary_count = len(summary.get('ipos') or [])
          if summary_count != master_count:
              raise SystemExit(f'public summary count mismatch: {summary_count} != {master_count}')
          if manifest.get('routeCount') != master_count:
              raise SystemExit('company route count does not match master dataset')
          routes = manifest.get('routes') or []
          if not routes:
              raise SystemExit('company route manifest is empty')
          sample = Path('ipo') / routes[0] / 'index.html'
          text = sample.read_text(encoding='utf-8')
          if 'id="ipo-profile-data"' not in text:
              raise SystemExit('generated company route is missing embedded profile data')

          master_bytes = master_path.stat().st_size
          summary_bytes = summary_path.stat().st_size
          if summary_bytes >= master_bytes:
              raise SystemExit('compact public summary is not smaller than the canonical dataset')
          ratio = summary_bytes / master_bytes * 100 if master_bytes else 0
          print(f'Public dashboard payload: {summary_bytes:,} bytes vs {master_bytes:,} bytes master ({ratio:.1f}%)')
          PY
      - name: Validate reviewed data corrections
        run: |
          uv run --frozen python scripts/apply_corrections.py
          uv run --frozen python scripts/enforce_final_prospectus_policy.py
          uv run --frozen python scripts/validate_data.py --strict
          uv run --frozen python scripts/build_missing_queue.py
          uv run --frozen python scripts/phase_status.py
          uv run --frozen python scripts/build_performance_summary.py
      - name: Verify compact support artifacts
        run: |
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path

          queue_path = Path('data/missing_queue.json')
          performance_path = Path('data/performance_summary.json')
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          performance = json.loads(performance_path.read_text(encoding='utf-8'))

          if queue.get('queueCount') != len(queue.get('queue') or []):
              raise SystemExit('queueCount does not match persisted queue length')
          if queue.get('formatVersion') != 2:
              raise SystemExit('expected compact missing-queue format v2')
          if performance.get('listedRecords') != len(performance.get('records') or []):
              raise SystemExit('performance listedRecords does not match persisted records')
          if performance.get('formatVersion') != 2:
              raise SystemExit('expected compact performance-summary format v2')

          queue_bytes = queue_path.stat().st_size
          performance_bytes = performance_path.stat().st_size
          # Pass-2 baselines were 642,593 and 402,413 bytes respectively.
          if queue_bytes >= 642_593:
              raise SystemExit(f'missing queue did not shrink: {queue_bytes:,} bytes')
          if performance_bytes >= 402_413:
              raise SystemExit(f'performance summary did not shrink: {performance_bytes:,} bytes')
          print(f'Missing queue: {queue_bytes:,} bytes (baseline 642,593)')
          print(f'Performance summary: {performance_bytes:,} bytes (baseline 402,413)')
          PY
