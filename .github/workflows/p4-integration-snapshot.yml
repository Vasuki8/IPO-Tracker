name: Recover exact P4 integration snapshots

on:
  pull_request:
    paths: ['.github/workflows/p4-integration-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain immutable public repository history for offline integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-recovery"
          for sha in cf906df7ccc9bcf40881743b0af39480858a612e 4707df1e82337e3a7b8bac0838bbaa30c3d200be d5e5d0580360a87dffc35b69e674886848b55005 a503531ded368c4eb53ba09cf5c2aafef3391c38; do
            git fetch --no-tags origin "$sha"
            test "$(git rev-parse "$sha^{commit}")" = "$sha"
            git update-ref "refs/recovery/$sha" "$sha"
          done
          git bundle create "$RUNNER_TEMP/p4-recovery/repository.bundle" --all
          git bundle verify "$RUNNER_TEMP/p4-recovery/repository.bundle"
          git show-ref > "$RUNNER_TEMP/p4-recovery/refs.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/p4-recovery/head-tree.txt"
          git diff --exit-code
          cd "$RUNNER_TEMP/p4-recovery"
          sha256sum repository.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: p4-integration-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-recovery/
          retention-days: 14
