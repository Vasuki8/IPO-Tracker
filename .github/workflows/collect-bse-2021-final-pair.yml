name: Collect final BSE 2021 pair evidence
on:
  push:
    branches: [data/bse-2021-final-pair-20260927]
    paths: [.github/workflows/collect-bse-2021-final-pair.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch original official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs";import path from "node:path";import {createHash} from "node:crypto";import {execFileSync} from "node:child_process";
          const out=process.env.OUT,docs=[
            ["sigachi_final","https://www.sebi.gov.in/sebi_data/attachdocs/nov-2021/1636518664579.pdf"],
            ["sigachi_track","https://www.sebi.gov.in/sebi_data/attachdocs/aug-2023/1693311018812.pdf"],
            ["adeshwar_prospectus","https://www.bseindia.com/corporates/download/374911/SME_IPO%20Open/2.%20Adeshwar%20Meditex%20Limited%20-%20Prospectus_20210610150935.pdf"],
            ["adeshwar_track","https://www.sebi.gov.in/sebi_data/attachdocs/dec-2022/1670404259679.pdf"]
          ],receipt=[];const allowed=new Set(["www.sebi.gov.in","sebi.gov.in","www.bseindia.com","bseindia.com"]);
          for(const[key,url]of docs){let last;for(let attempt=1;attempt<=3;attempt++){try{const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(60000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});if(!r.ok||!allowed.has(new URL(r.url).hostname))throw Error("bad_"+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf");const pdf=path.join(out,key+".pdf"),txt=path.join(out,key+".txt");fs.writeFileSync(pdf,b);execFileSync("pdftotext",["-layout",pdf,txt]);receipt.push({key,source_url:url,final_url:r.url,http_status:r.status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt});break}catch(e){last=e;if(attempt===3)throw e;await new Promise(r=>setTimeout(r,attempt*1500));}}}
          const read=k=>fs.readFileSync(path.join(out,k+".txt"),"utf8").replace(/\s+/g," ");
          const sf=read("sigachi_final"),st=read("sigachi_track"),ap=read("adeshwar_prospectus"),at=read("adeshwar_track");
          const must=(x,m)=>{if(!x)throw Error(m)};
          must(/SIGACHI INDUSTRIES LIMITED/i.test(sf)&&/INITIAL PUBLIC OFFERING/i.test(sf),"sigachi_identity");
          must(/Monday,?\s*November 1,?\s*2021/i.test(sf)&&/Wednesday,?\s*November 3,?\s*2021/i.test(sf),"sigachi_offer_dates");
          must(/Sigachi Industries Limited/i.test(st)&&/12,?542\.85/.test(st)&&/163/.test(st)&&/November 15,?\s*2021/i.test(st),"sigachi_track");
          must(/ADESHWAR MEDITEX LIMITED/i.test(ap)&&/INITIAL PUBLIC ISSUE/i.test(ap)&&/25/.test(ap)&&/975\.00/.test(ap)&&/SME Platform of BSE/i.test(ap),"adeshwar_terms");
          must(/June 15,?\s*2021/i.test(ap)&&/June 18,?\s*2021/i.test(ap),"adeshwar_offer_dates");
          must(/Adeshwar Meditex Ltd/i.test(at)&&/9\.75/.test(at)&&/25/.test(at)&&/28-06-21/.test(at),"adeshwar_track");
          const result={schema_version:"1.0.0",status:"complete",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt};fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify(result,null,2)+"\n");console.log(JSON.stringify({documents:receipt.length,bytes:result.total_response_bytes,hashes:receipt.map(d=>[d.key,d.response_sha256])}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2021-final-pair-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
