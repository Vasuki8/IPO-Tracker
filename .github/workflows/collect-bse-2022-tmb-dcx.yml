name: Collect TMB and DCX 2022 evidence
on:
  push:
    branches: [data/bse-2022-tmb-dcx-20260927]
    paths: [.github/workflows/collect-bse-2022-tmb-dcx.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/collect-bse-2022-tmb-dcx.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch original official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs";import path from "node:path";import {createHash} from "node:crypto";import {execFileSync} from "node:child_process";
          const out=process.env.OUT,receipt=[];
          const docs=[
            ["tmb_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/sep-2022/1663570839596.pdf","pdf"],
            ["tmb_listing","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20220914-31","html"],
            ["dcx_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/nov-2022/1667796864708.pdf","pdf"],
            ["dcx_listing","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20221110-32","html"]
          ];
          for(const[key,url,type]of docs){
            const file=path.join(out,key+"."+type);
            execFileSync("curl",["--fail","--location","--retry","4","--retry-all-errors","--retry-delay","2","--connect-timeout","20","--max-time","150","--user-agent","Mozilla/5.0","--output",file,url],{stdio:"inherit"});
            const b=fs.readFileSync(file);
            if(type==="pdf"){if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf:"+key);execFileSync("pdftotext",["-layout",file,path.join(out,key+".txt")]);}
            receipt.push({key,source_url:url,http_status:200,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),download_method:"curl_retry_4",type});
          }
          const clean=s=>String(s).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi," ").replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g," ").replace(/&nbsp;|&#160;/gi," ").replace(/&amp;/gi,"&").replace(/\s+/g," ").trim();
          for(const k of ["tmb_prospectus","dcx_prospectus"]){const t=fs.readFileSync(path.join(out,k+".txt"),"utf8").replace(/\s+/g," ");console.log(k,t.match(/.{0,180}(?:TAMILNAD MERCANTILE BANK LIMITED|DCX SYSTEMS LIMITED|Offer Price|Issue Price|Bid\/Offer Opens|Bid\/Offer Closes|minimum bid|Market Lot).{0,260}/i)?.[0]||"no-sample");}
          for(const k of ["tmb_listing","dcx_listing"]){const t=clean(fs.readFileSync(path.join(out,k+".html"),"utf8"));console.log(k,t.match(/.{0,180}(?:Tamilnad Mercantile Bank Limited|DCX Systems Limited).{0,500}/i)?.[0]||"no-sample");}
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({schema_version:"1.0.0",status:"collected",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt},null,2)+"\n");
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: bse-2022-tmb-dcx-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
