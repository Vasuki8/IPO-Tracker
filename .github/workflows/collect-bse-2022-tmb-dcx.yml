name: Collect TMB and DCX 2022 evidence
on:
  push:
    branches: [data/bse-2022-tmb-dcx-20260927]
    paths: [.github/workflows/collect-bse-2022-tmb-dcx.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/collect-bse-2022-tmb-dcx.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch original official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          OUT="$RUNNER_TEMP/evidence" node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import {createHash} from "node:crypto";
          import {execFileSync} from "node:child_process";
          const out=process.env.OUT,receipt=[];
          const docs=[
            ["tmb_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/sep-2022/1663570839596.pdf"],
            ["tmb_track","https://www.sebi.gov.in/sebi_data/attachdocs/dec-2023/1702623912451.PDF"],
            ["dcx_prospectus","https://www.sebi.gov.in/sebi_data/attachdocs/nov-2022/1667796864708.pdf"],
            ["dcx_track","https://www.sebi.gov.in/sebi_data/attachdocs/nov-2023/1700224103192.pdf"]
          ];
          for(const [key,url] of docs){
            let b=null,finalUrl=url,status=null,attempt=0,last=null;
            for(attempt=1;attempt<=6;attempt++){
              try{
                const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(180000),headers:{"user-agent":"Mozilla/5.0","accept":"application/pdf,*/*"}});
                status=r.status;finalUrl=r.url;
                if(!r.ok)throw Error("bad_status:"+r.status);
                b=Buffer.from(await r.arrayBuffer());
                if(b.subarray(0,5).toString()!=="%PDF-")throw Error("not_pdf:"+key);
                break;
              }catch(e){last=e;b=null;if(attempt===6)throw last;await new Promise(r=>setTimeout(r,attempt*2000));}
            }
            const pdf=path.join(out,key+".pdf"),txt=path.join(out,key+".txt");
            fs.writeFileSync(pdf,b);
            execFileSync("pdftotext",["-layout",pdf,txt]);
            receipt.push({key,source_url:url,final_url:finalUrl,http_status:status,response_bytes:b.length,response_sha256:createHash("sha256").update(b).digest("hex"),collected_at:new Date().toISOString(),attempt,download_method:"node_fetch_retry_6"});
          }
          const pats=[/TAMILNAD MERCANTILE BANK LIMITED/i,/DCX SYSTEMS LIMITED/i,/Offer Price.{0,180}/i,/Issue Price.{0,180}/i,/Bid\/Offer Opens.{0,180}/i,/Bid\/Offer Closes.{0,180}/i,/minimum bid.{0,180}/i,/Market Lot.{0,180}/i,/September 15,?\s*2022/i,/November 11,?\s*2022/i];
          for(const [key] of docs){
            const t=fs.readFileSync(path.join(out,key+".txt"),"utf8").replace(/\s+/g," ");
            console.log("DOC",key);
            for(const p of pats){const m=t.match(p);if(m)console.log(m[0]);}
          }
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({schema_version:"1.0.0",status:"collected",workflow_run_id:process.env.GITHUB_RUN_ID,total_response_bytes:receipt.reduce((n,d)=>n+d.response_bytes,0),documents:receipt},null,2)+"\n");
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: bse-2022-tmb-dcx-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
