name: Collect BSE 2023 SSEK source evidence

on:
  push:
    branches: ["work/bse-2023-ssek-source-review-20260929"]
    paths:
      - "data/discovery/bse-2023-ssek-source-plan-2026-09-29.json"
      - "scripts/audit-bse-2023-ssek-identities.mjs"
      - "scripts/collect-bse-2023-ssek-evidence.mjs"
      - "scripts/test-bse-2023-ssek-evidence.mjs"
      - ".github/workflows/collect-bse-2023-ssek-evidence.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/discovery/bse-2023-ssek-source-plan-2026-09-29.json"
      - "scripts/audit-bse-2023-ssek-identities.mjs"
      - "scripts/collect-bse-2023-ssek-evidence.mjs"
      - "scripts/test-bse-2023-ssek-evidence.mjs"
      - ".github/workflows/collect-bse-2023-ssek-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bse-2023-ssek-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate bounded source plan and collector
        run: node scripts/test-bse-2023-ssek-evidence.mjs
      - name: Reconcile exact identities across every recovery year
        run: node scripts/audit-bse-2023-ssek-identities.mjs
      - name: Keep current queue and publication reproducible
        run: |
          node scripts/check-bse-2023-progress.mjs
          node scripts/check-bse-2022-disposition.mjs
          node scripts/check-retained-bse-snapshot.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code

  sources:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect original SEBI responses without importing records
        run: node scripts/collect-bse-2023-ssek-evidence.mjs --out="${{ runner.temp }}/ssek-evidence"
      - name: Retain complete or partial collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-2023-ssek-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssek-evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
