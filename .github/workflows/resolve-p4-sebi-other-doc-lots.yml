name: Resolve P4 SEBI other-document lot sizes

on:
  workflow_dispatch:
  push:
    branches:
      - p4-sebi-other-docs-lots
    paths:
      - "scripts/backfill_recent_sebi_other_docs_lot_sizes.py"
      - "tests/test_sebi_other_docs_lot_backfill.py"
      - ".github/workflows/resolve-p4-sebi-other-doc-lots.yml"

permissions:
  contents: write

concurrency:
  group: ipo-data-refresh
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Test safeguards
        run: |
          uv run python -m unittest discover -s tests -p "test_sebi_other_docs_lot_backfill.py" -v
          uv run python -m unittest discover -s tests -p "test_recent_offer_terms.py" -v
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Backfill P4 lots from SEBI Other Documents
        run: |
          uv run python scripts/backfill_recent_sebi_other_docs_lot_sizes.py --max-listing-pages 40 --limit 125 --max-pdfs 5

      - name: Publish only genuine IPO-data gains
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"
          GENERATED_DATA="$(git hash-object /tmp/generated-ipos.json)"
          if [ "$GENERATED_DATA" = "$BASE_DATA" ]; then
            echo "No SEBI Other Documents lot-size gains; IPO dataset unchanged."
            exit 0
          fi

          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during SEBI other-doc pass; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if git diff --quiet -- data/ipos.json; then
            echo "No genuine IPO-data gain after rebasing on main."
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: advance P4 lot sizes from SEBI other documents"
          git push origin HEAD:main

      - name: Report residual P4 lot queue
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/missing_queue.json > /tmp/current-missing-queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/current-missing-queue.json').read_text(encoding='utf-8'))
          rows = [
              row for row in payload.get('queue') or []
              if row.get('priorityLabel') == 'P4 recent history (2y)'
              and 'exchange.lotSize' in (row.get('missingFields') or [])
          ]
          print('P4 lotSize actionable residuals:', len(rows))
          print('Residual IDs:', [row.get('id') for row in rows[:40]])
          PY
