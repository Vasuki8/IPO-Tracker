name: Research BSE 2021 batch3 official sources
on:
  push:
    branches: [research/bse-2021-batch3-20260927]
    paths: [.github/workflows/research-bse-2021-batch3.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Fetch official discovery documents
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/batch3"
          OUT="$RUNNER_TEMP/batch3" node --input-type=module <<'JS'
          import fs from "node:fs";import path from "node:path";import {createHash} from "node:crypto";
          const out=process.env.OUT,docs=[],errors=[];
          const seeds=[
            ["paras_bse_notice","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20210930-7"],
            ["paras_sebi_filing","https://www.sebi.gov.in/filings/public-issues/sep-2021/paras-defence-and-space-technologies-limited_70271.html"],
            ["sigachi_bse_notice","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20211112-2"],
            ["sigachi_sebi_filing","https://www.sebi.gov.in/filings/public-issues/oct-2021/sigachi-industries-limited_53518.html"],
            ["latteys_bse_notice","https://www.bseindia.com/markets/MarketInfo/DispNewNoticesCirculars.aspx?page=20210630-28"],
            ["latteys_sebi_search","https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=3&ssid=15&smid=11"]
          ];
          const okhost=u=>["www.bseindia.com","bseindia.com","www.sebi.gov.in","sebi.gov.in"].includes(new URL(u).hostname);
          async function get(key,url){let last;for(let attempt=1;attempt<=2;attempt++){try{const r=await fetch(url,{redirect:"follow",signal:AbortSignal.timeout(30000),headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/pdf,*/*"}});if(!r.ok||!okhost(r.url))throw Error("bad_"+r.status);const b=Buffer.from(await r.arrayBuffer());const file=key+(b.subarray(0,5).toString()==="%PDF-"?".pdf":".html");fs.writeFileSync(path.join(out,file),b);docs.push({key,url,final_url:r.url,status:r.status,bytes:b.length,sha256:createHash("sha256").update(b).digest("hex"),file,attempt});return}catch(e){last=e;if(attempt<2)await new Promise(r=>setTimeout(r,1500))}}errors.push(key+":"+last.message)}
          for(const [k,u] of seeds)await get(k,u);
          fs.writeFileSync(path.join(out,"receipt.json"),JSON.stringify({documents:docs,errors},null,2)+"\n");console.log(JSON.stringify({documents:docs.length,errors}));if(errors.length===seeds.length)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2021-batch3-research
          path: ${{ runner.temp }}/batch3
          retention-days: 3
          if-no-files-found: error
