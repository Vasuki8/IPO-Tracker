name: Probe Phase 4.5A NSE primary-market report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-nse-report.yml"

permissions:
  contents: read

concurrency:
  group: phase45a-nse-report-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official July 2026 NSE primary-market report
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://nsearchives.nseindia.com/web/mediaattachment/2026-08/Primary_Market_data__July26_20260814112232.xlsx" \
            -o /tmp/primary-market.xlsx
          ls -lh /tmp/primary-market.xlsx

      - name: Print workbook sheet names and first non-empty rows
        shell: python
        run: |
          import re
          import zipfile
          import xml.etree.ElementTree as ET

          path = "/tmp/primary-market.xlsx"
          NS = {"m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
          REL_NS = {"r": "http://schemas.openxmlformats.org/package/2006/relationships"}
          DOC_REL = "{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id"

          def col_index(ref):
              letters = re.match(r"[A-Z]+", ref or "A").group(0)
              out = 0
              for ch in letters:
                  out = out * 26 + (ord(ch) - 64)
              return out - 1

          with zipfile.ZipFile(path) as zf:
              shared = []
              if "xl/sharedStrings.xml" in zf.namelist():
                  root = ET.fromstring(zf.read("xl/sharedStrings.xml"))
                  for si in root.findall("m:si", NS):
                      shared.append("".join(t.text or "" for t in si.iterfind(".//m:t", NS)))

              wb = ET.fromstring(zf.read("xl/workbook.xml"))
              rels = ET.fromstring(zf.read("xl/_rels/workbook.xml.rels"))
              targets = {rel.attrib["Id"]: rel.attrib["Target"] for rel in rels.findall("r:Relationship", REL_NS)}

              for sheet in wb.findall(".//m:sheet", NS):
                  name = sheet.attrib.get("name")
                  target = targets.get(sheet.attrib.get(DOC_REL))
                  if not target:
                      continue
                  target = target.lstrip("/")
                  xml_path = target if target.startswith("xl/") else "xl/" + target
                  print(f"\n=== SHEET: {name} ({xml_path}) ===")
                  root = ET.fromstring(zf.read(xml_path))
                  printed = 0
                  for row in root.findall(".//m:sheetData/m:row", NS):
                      values = {}
                      for cell in row.findall("m:c", NS):
                          ref = cell.attrib.get("r", "A1")
                          idx = col_index(ref)
                          typ = cell.attrib.get("t")
                          if typ == "inlineStr":
                              text = "".join(t.text or "" for t in cell.iterfind(".//m:t", NS))
                          else:
                              node = cell.find("m:v", NS)
                              raw = node.text if node is not None else ""
                              if typ == "s" and raw:
                                  try:
                                      text = shared[int(raw)]
                                  except Exception:
                                      text = raw
                              else:
                                  text = raw
                          text = " ".join(str(text or "").split())
                          if text:
                              values[idx] = text
                      if not values:
                          continue
                      width = min(max(values) + 1, 24)
                      row_values = [values.get(i, "") for i in range(width)]
                      print(f"row {row.attrib.get('r')}: {row_values}")
                      printed += 1
                      if printed >= 100:
                          break
