name: Collect Ratnaveer Valiant ESAF Plaza evidence
on:
  push:
    branches: [data/bse-2023-ratnaveer-valiant-esaf-plaza-20260928]
    paths: [.github/workflows/collect-2023-rvpe.yml]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Retain baseline and official original responses
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/evidence"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/baseline-commit.txt"
          git archive --format=tar.gz HEAD > "$OUT/baseline.tar.gz"
          python - <<'PY'
          import os, json, re, hashlib, subprocess, html
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlparse
          out=Path(os.environ['OUT']); docs=[]; errors=[]
          allowed={'www.sebi.gov.in','www.bseindia.com','www.valiantlabs.in'}
          now=lambda: datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          def fetch(key,url,official=True):
              host=urlparse(url).hostname
              if official and host not in allowed: raise ValueError('unsupported_host:'+host)
              suffix='.pdf' if re.search(r'\.pdf(?:$|\?)',url,re.I) else '.html'
              dest=out/(key+suffix); requested=now()
              proc=subprocess.run(['curl','--fail','--location','--retry','2','--retry-delay','2','--connect-timeout','20','--max-time','150','--user-agent','Mozilla/5.0','--output',str(dest),'--write-out','%{http_code}\n%{url_effective}\n',url],capture_output=True,text=True,timeout=470)
              if proc.returncode: raise ValueError('fetch_failed:'+key+':'+proc.stderr[-250:])
              status,final=proc.stdout.strip().splitlines()[-2:]
              if status!='200' or (official and urlparse(final).hostname not in allowed): raise ValueError('invalid_final_response:'+key)
              b=dest.read_bytes(); item={'key':key,'source_url':url,'final_url':final,'http_status':200,'requested_at':requested,'collected_at':now(),'response_bytes':len(b),'response_sha256':hashlib.sha256(b).hexdigest(),'file':dest.name,'authority':'official_primary' if official else 'link_discovery_only'}
              if suffix=='.pdf':
                  if not b.startswith(b'%PDF-'): raise ValueError('not_pdf:'+key)
                  info=subprocess.check_output(['pdfinfo',str(dest)],text=True)
                  item['pdf_pages']=int(re.search(r'^Pages:\s*(\d+)',info,re.M)[1])
                  subprocess.run(['pdftotext','-layout',str(dest),str(out/(key+'.txt'))],check=True)
              docs.append(item); print(json.dumps(item),flush=True)
              return b.decode('utf-8',errors='replace') if suffix=='.html' else ''
          landings={
            'ratnaveer':'https://www.sebi.gov.in/filings/public-issues/sep-2023/ratnaveer-precision-engineering-limited-prospectus_76730.html',
            'esaf':'https://www.sebi.gov.in/filings/public-issues/nov-2023/esaf-small-finance-bank-limited-prospectus_79039.html',
            'plaza':'https://www.sebi.gov.in/filings/public-issues/nov-2023/plaza-wires-limited-prospectus_78758.html'}
          for key,url in landings.items():
              try:
                  text=fetch(key+'_landing',url)
                  links=list(dict.fromkeys(html.unescape(x) for x in re.findall(r'https://www\.sebi\.gov\.in/[^\s\'\"<>]+\.pdf',text,re.I)))
                  if len(links)!=1: raise ValueError('ambiguous_pdf_links:'+key+':'+repr(links))
                  fetch(key+'_prospectus',links[0])
              except Exception as e: errors.append(str(e)); print(str(e),flush=True)
          direct={
            'valiant_prospectus':'https://www.valiantlabs.in/assets/images/investors/prospectus.pdf',
            'valiant_annual':'https://www.bseindia.com/xml-data/corpfiling/AttachHis/b50a737b-15bb-407c-b7e8-382773330878.pdf',
            'esaf_annual':'https://www.bseindia.com/xml-data/corpfiling/AttachHis/02511851-de0e-48bb-9216-3ecde6953ba9.pdf',
            'plaza_annual':'https://www.bseindia.com/xml-data/corpfiling/AttachHis/3a468c8e-8ab9-4b54-82f2-b42ddc574310.pdf'}
          for key,url in direct.items():
              try: fetch(key,url)
              except Exception as e: errors.append(str(e)); print(str(e),flush=True)
          try:
              text=fetch('ratnaveer_link_discovery','https://www.screener.in/company/RATNAVEER/',False)
              anchors=re.findall(r'<a\b([^>]+)>(.*?)</a>',text,re.S|re.I)
              urls=[]
              for attrs,label in anchors:
                  if 'Annual Report 2024' not in re.sub('<[^>]+>',' ',label): continue
                  m=re.search(r'href=[\'\"]([^\'\"]+)',attrs)
                  if m: urls.append(html.unescape(m[1]))
              if len(urls)!=1: raise ValueError('ambiguous_annual_link:'+repr(urls))
              fetch('ratnaveer_annual',urls[0])
          except Exception as e: errors.append(str(e)); print(str(e),flush=True)
          receipt={'schema_version':'1.0.0','status':'collected_not_approved','workflow_run_id':os.environ['GITHUB_RUN_ID'],'documents':docs,'total_response_bytes':sum(d['response_bytes'] for d in docs if d['authority']=='official_primary'),'errors':errors,'collection_completed_at':now()}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-2023-rvpe-original-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error
