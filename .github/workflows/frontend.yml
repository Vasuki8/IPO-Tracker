name: Frontend browser checks

on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'scripts/build_company_pages.py'
      - 'scripts/public_quality.py'
      - 'scripts/source_review_holds.py'
      - 'data/public_display_holds.json'
      - 'data/verified_corrections.json'
      - 'data/reviewed_correction_evidence.json'
      - 'data/reviewed_correction_evidence/**'
      - 'scripts/reviewed*.py'
      - 'scripts/apply_corrections.py'
      - 'scripts/publish_transaction.py'
      - 'scripts/update_data.py'
      - 'scripts/run_update.py'
      - 'tests/frontend*'
      - 'tests/verify_public_release.py'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'scripts/build_company_pages.py'
      - 'scripts/public_quality.py'
      - 'scripts/source_review_holds.py'
      - 'data/public_display_holds.json'
      - 'data/verified_corrections.json'
      - 'data/reviewed_correction_evidence.json'
      - 'data/reviewed_correction_evidence/**'
      - 'scripts/reviewed*.py'
      - 'scripts/apply_corrections.py'
      - 'scripts/publish_transaction.py'
      - 'scripts/update_data.py'
      - 'scripts/run_update.py'
      - 'tests/frontend*'
      - 'tests/verify_public_release.py'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8000/
      SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Rebuild and verify public trust projections
        run: |
          uv run --frozen python scripts/build_company_pages.py
          git diff --exit-code -- data/ipos.json
          node --test tests/public_quality.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/ipo-playwright" "$SMOKE_ARTIFACT_DIR"
          cd "$RUNNER_TEMP/ipo-playwright"
          npm install --no-save --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Serve the site and test real browser interactions
        run: |
          export NODE_PATH="$RUNNER_TEMP/ipo-playwright/node_modules"
          python3 -m http.server 8000 --bind 127.0.0.1 > "$SMOKE_ARTIFACT_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/', timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit('Local frontend server did not start')
          PY
          node tests/frontend_smoke.cjs
          node tests/frontend_quality_layout.cjs
          node tests/frontend_source_holds.cjs
          node tests/frontend_bse_authority.cjs
          uv run --frozen python tests/verify_public_release.py --expected-commit "$(git rev-parse HEAD)" --base-url "$BASE_URL" > "$SMOKE_ARTIFACT_DIR/public-release.json"
      - name: Rehearse bounded reviewed composition in an isolated site
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/reviewed-site"
          mkdir -p "$candidate"
          tar --exclude=.git --exclude=.venv --exclude=artifacts -cf - . | tar -xf - -C "$candidate"
          uv run --frozen python scripts/reviewed_corrections.py --ids emmvee --bundle "$RUNNER_TEMP/reviewed-bundle"
          cp "$RUNNER_TEMP/reviewed-bundle/proposed.json" "$candidate/data/ipos.json"
          uv run --frozen python "$candidate/scripts/build_company_pages.py"
          export NODE_PATH="$RUNNER_TEMP/ipo-playwright/node_modules"
          export BASE_URL=http://127.0.0.1:8001/
          export SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR/reviewed-candidate"
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          python3 -m http.server 8001 --bind 127.0.0.1 --directory "$candidate" > "$SMOKE_ARTIFACT_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/frontend_reviewed_composition.cjs
          git diff --exit-code -- data/ipos.json data/pending_updates.json
      - name: Rehearse bounded reviewed intermediaries in an isolated site
        shell: bash
        run: |
          set -euo pipefail
          ready="$(uv run --frozen python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from reviewed_evidence import load_groups
          groups = load_groups()
          ids = {g['identity']['id'] for g in groups if g.get('kind') == 'intermediaries'}
          print('yes' if {'snehaa', 'sacheerome'} <= ids else 'no')
          PY
          )"
          if [[ "$ready" != 'yes' ]]; then
            echo 'The paired reviewed intermediary evidence is not staged; no rehearsal requested'
            exit 0
          fi
          candidate="$RUNNER_TEMP/reviewed-intermediary-site"
          mkdir -p "$candidate"
          tar --exclude=.git --exclude=.venv --exclude=artifacts -cf - . | tar -xf - -C "$candidate"
          uv run --frozen python scripts/reviewed_corrections.py --ids snehaa,sacheerome --bundle "$RUNNER_TEMP/reviewed-intermediary-bundle"
          cp "$RUNNER_TEMP/reviewed-intermediary-bundle/proposed.json" "$candidate/data/ipos.json"
          uv run --frozen python "$candidate/scripts/build_company_pages.py"
          export REVIEWED_CANDIDATE_ROOT="$candidate"
          export NODE_PATH="$RUNNER_TEMP/ipo-playwright/node_modules"
          export BASE_URL=http://127.0.0.1:8002/
          export SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR/reviewed-intermediaries"
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          python3 -m http.server 8002 --bind 127.0.0.1 --directory "$candidate" > "$SMOKE_ARTIFACT_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/frontend_reviewed_intermediaries.cjs
          git diff --exit-code -- data/ipos.json data/pending_updates.json
      - name: Rehearse bounded reviewed financials in an isolated site
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/reviewed-financial-site"
          mkdir -p "$candidate"
          tar --exclude=.git --exclude=.venv --exclude=artifacts --exclude=.cache -cf - . | tar -xf - -C "$candidate"
          uv run --frozen python scripts/reviewed_corrections.py --ids htel,kissht --bundle "$RUNNER_TEMP/reviewed-financial-bundle"
          cp "$RUNNER_TEMP/reviewed-financial-bundle/proposed.json" "$candidate/data/ipos.json"
          uv run --frozen python "$candidate/scripts/build_company_pages.py"
          export REVIEWED_CANDIDATE_ROOT="$candidate"
          export NODE_PATH="$RUNNER_TEMP/ipo-playwright/node_modules"
          export BASE_URL=http://127.0.0.1:8003/
          export SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR/reviewed-financials"
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          python3 -m http.server 8003 --bind 127.0.0.1 --directory "$candidate" > "$SMOKE_ARTIFACT_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/frontend_reviewed_financials.cjs
          git diff --exit-code -- data/ipos.json data/pending_updates.json
      - name: Retain screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/frontend/
          if-no-files-found: warn
          retention-days: 14
