name: Collect four-issuer continuation snapshots
on:
  push:
    branches: [data/bse-2023-four-mainboard-20260928]
    paths: [.github/workflows/collect-four-continuation-snapshot.yml]
permissions: {contents: read}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Retain committed source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/continuation"
          git rev-parse HEAD > "$RUNNER_TEMP/continuation/branch-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/continuation/branch.tar.gz"
          git fetch --depth=1 origin main
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/continuation/main-commit.txt"
          git archive --format=tar.gz FETCH_HEAD > "$RUNNER_TEMP/continuation/main.tar.gz"
          cd "$RUNNER_TEMP/continuation"
          sha256sum *.tar.gz > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: four-issuer-continuation-snapshots
          path: ${{ runner.temp }}/continuation
          retention-days: 3
          if-no-files-found: error
