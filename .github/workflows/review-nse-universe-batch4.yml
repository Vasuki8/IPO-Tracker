name: Review pinned NSE universe batch4

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/review-nse-universe-batch4.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Retain exact source revision
        run: |
          mkdir -p "$RUNNER_TEMP/nse-batch4"
          git archive --format=zip HEAD > "$RUNNER_TEMP/nse-batch4/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/nse-batch4/source-commit.txt"

      - name: Collect bounded issuer-specific official evidence without importing
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';

          const out = path.join(process.env.RUNNER_TEMP, 'nse-batch4');
          const queuePath = 'data/discovery/ipo-universe-review-2026-09-25-batch4.json';
          const queueBytes = fs.readFileSync(queuePath);
          const queue = JSON.parse(queueBytes);
          assert.equal(queue.auto_import_allowed, false);
          assert.equal(queue.candidates.length, 15);
          assert.equal(queue.candidates[0].nse_symbol, 'RFBL');
          assert.equal(queue.candidates.at(-1).nse_symbol, 'SHREEDHAR');
          assert.equal(new Set(queue.candidates.map(c => c.nse_symbol)).size, 15);

          const hash = b => createHash('sha256').update(b).digest('hex');
          const nseHome = 'https://www.nseindia.com/market-data/all-upcoming-issues-ipo';
          const headers = {
            'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
            'accept': 'application/json,text/plain,*/*',
            'accept-language': 'en-US,en;q=0.9',
            'referer': nseHome,
            'cache-control': 'no-cache'
          };
          try {
            const landing = await fetch(nseHome, { headers, signal: AbortSignal.timeout(20000) });
            if (landing.ok) headers.cookie = (landing.headers.getSetCookie?.() || []).map(v => v.split(';')[0]).join('; ');
          } catch (e) {
            console.log('Landing unavailable:', e.message);
          }

          const rows = [];
          async function get(url, file, useNseHeaders = true) {
            const requested_at = new Date().toISOString();
            try {
              const response = await fetch(url, {
                headers: useNseHeaders ? headers : { 'user-agent': headers['user-agent'], 'accept': '*/*' },
                signal: AbortSignal.timeout(30000)
              });
              const body = Buffer.from(await response.arrayBuffer());
              fs.writeFileSync(path.join(out, file), body);
              return {
                url, final_url: response.url, status: response.status,
                content_type: response.headers.get('content-type'),
                requested_at, collected_at: new Date().toISOString(),
                file, sha256: hash(body), bytes: body.length
              };
            } catch (e) {
              return { url, requested_at, collected_at: new Date().toISOString(), error: String(e.message) };
            }
          }

          rows.push({kind:'past', ...await get('https://www.nseindia.com/api/public-past-issues', 'past.json')});
          for (const c of queue.candidates) {
            const series = c.board === 'SME' ? 'SME' : 'EQ';
            const s = c.nse_symbol;
            assert.match(s, /^[A-Z0-9-]+$/);
            rows.push({
              symbol:s, kind:'ipo_detail',
              ...await get('https://www.nseindia.com/api/ipo-detail?symbol=' + encodeURIComponent(s) + '&series=' + series, s + '-ipo.json')
            });
            await new Promise(r => setTimeout(r, 180));
          }

          // Explicit review signals: retain independent official exchange evidence.
          rows.push({
            symbol:'QMSMEDI', kind:'migration_approval',
            ...await get('https://nsearchives.nseindia.com/corporate/QMS_16062026194113_SdMigrationApproval.pdf', 'QMSMEDI-migration-approval.pdf', false)
          });
          rows.push({
            symbol:'12VPT28A', kind:'debt_listing_circular',
            ...await get('https://nsearchives.nseindia.com/content/circulars/CML74788.pdf', '12VPT28A-nse-circular.pdf', false)
          });
          rows.push({
            kind:'migration_index',
            ...await get('https://www.nseindia.com/static/companies-listing/raising-capital-public-issues-emerge-selecting-a-migration-to-main-board', 'nse-migration-index.html', true)
          });
          rows.push({
            kind:'deployed_baseline',
            ...await get('https://vasuki8.github.io/IPO-Tracker/data/ipos.json?batch4=' + process.env.GITHUB_RUN_ID, 'deployed-baseline.json', false)
          });

          fs.writeFileSync(path.join(out, 'sources.json'), JSON.stringify({
            schema_version:'1.0.0',
            generated_at:new Date().toISOString(),
            run_id:process.env.GITHUB_RUN_ID,
            source_commit_sha:process.env.GITHUB_SHA,
            input:{path:queuePath,sha256:hash(queueBytes)},
            rows
          }, null, 2) + '\n');

          console.log(JSON.stringify(rows.map(({symbol,kind,status,bytes,error}) => ({symbol,kind,status,bytes,error})), null, 2));
          JS

      - name: Confirm production data was not modified
        run: git diff --exit-code -- data ops assets

      - name: Retain original responses including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-universe-batch4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nse-batch4
          retention-days: 14
          if-no-files-found: error
