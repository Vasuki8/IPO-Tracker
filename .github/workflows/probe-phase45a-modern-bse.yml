name: Probe Phase 4.5A modern BSE history API

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-modern-bse.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe BSE 2026 historical IPO list
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          BASE="https://api.bseindia.com/BseIndiaAPI/api/MoreCompanyN/w"
          for QS in \
            "?Fromdt=2026&company=&flag=1&type=2" \
            "?Fromdt=2026&company=&flag=2&type=2" \
            "?Fromdt=2026&company=&flag=&type=1"; do
            echo "=== $QS ==="
            curl --http1.1 -sS -L --max-time 30 -A "$UA" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Origin: https://www.bseindia.com" \
              -H "Referer: https://www.bseindia.com/markets/PublicIssues/IPOIssues" \
              -w "\nHTTP:%{http_code} SIZE:%{size_download}\n" \
              "$BASE$QS" | head -c 60000
            echo
          done

      - name: Check P2 issuer hits
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          names = [
            'ABH HEALTHCARE','ANNU PROJECTS','ASHUTOSH FIBRE','AUGMONT ENTERPRISES','DEEPA JEWELLERS',
            'ESDS SOFTWARE','GAJA ALTERNATIVE','HORIZON INDUSTRIAL','HY-TECH ENGINEERS','KANOHAR ELECTRICALS',
            'LALITHAA JEWELLERY','LUMINO INDUSTRIES','MADHUR KNIT','PRANAV CONSTRUCTIONS','PRIORITY JEWELS',
            'PURPLE STYLE','QUALIANCE INTERNATIONAL','RAYS OF BELIEF','SHANKESH JEWELLERS','SHANTI INORGANICS',
            'SKYTECH INFINITE','SKYWAYS AIR','SUMAX ENGINEERING','SUNSHINE PICTURES','SYMBIOTEC PHARMALAB',
            'ASSET RECONSTRUCTION COMPANY','GLASS WALL SYSTEMS','KARAMTARA ENGINEERING','LCC PROJECTS',
            'MANIPAL PAYMENT','PRASOL CHEMICALS','STEAMHOUSE INDIA'
          ]
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bseindia.com/markets/PublicIssues/IPOIssues','Origin':'https://www.bseindia.com','Accept':'application/json'}
          all_rows=[]
          for flag in ('1','2'):
            url=f'https://api.bseindia.com/BseIndiaAPI/api/MoreCompanyN/w?Fromdt=2026&company=&flag={flag}&type=2'
            req=urllib.request.Request(url,headers=headers)
            data=json.loads(urllib.request.urlopen(req,timeout=30).read().decode())
            rows=data.get('Table') or []
            print('flag',flag,'rows',len(rows),'keys',sorted(rows[0].keys()) if rows else [])
            all_rows.extend(rows)
          hits=0
          for row in all_rows:
            company=str(row.get('Scrip_Name') or row.get('Scrip_name') or row.get('Company_Name') or row.get('COMPANY') or '').upper()
            if any(n in company or (company and company in n) for n in names):
              hits += 1
              print('HIT',company,row)
          print('hits',hits)
