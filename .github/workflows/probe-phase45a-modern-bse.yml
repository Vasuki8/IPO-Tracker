name: Probe P2 official document coverage

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-modern-bse.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Inspect P2 documents
        shell: python
        run: |
          import json
          payload=json.load(open('data/ipos.json',encoding='utf-8'))
          queue=json.load(open('data/missing_queue.json',encoding='utf-8'))
          p2=[q for q in queue['queue'] if q.get('priority')==2]
          by_id={r.get('id'):r for r in payload['ipos']}
          print('P2',len(p2))
          with_docs=0
          for q in p2:
            r=by_id.get(q['id'],{})
            docs=r.get('documents') or []
            if docs: with_docs+=1
            print('\n===',q['id'],q['company'],'missing=',q['missingFields'],'docs=',len(docs),'===')
            for d in docs:
              print(json.dumps({k:d.get(k) for k in ('type','title','url','source','filedDate','sourcePage')},ensure_ascii=False))
          print('WITH_DOCS',with_docs,'NO_DOCS',len(p2)-with_docs)
