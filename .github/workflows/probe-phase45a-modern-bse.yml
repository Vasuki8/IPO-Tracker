name: Probe Phase 4.5A modern BSE history API

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-modern-bse.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch BSE production JS
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          curl --http1.1 -fL --retry 3 --retry-all-errors --retry-delay 2 -A "$UA" \
            -H "Referer: https://www.bseindia.com/markets/PublicIssues/DisplayIPO" \
            "https://www.bseindia.com/assets/includenew/js/main-5C6S24SS.js" -o /tmp/main.js

      - name: Locate DisplayIPO detail component API calls
        shell: python
        run: |
          import re
          raw=open('/tmp/main.js',encoding='utf-8',errors='ignore').read()
          needles=['Minimum Bid Quantity','Market Lot','Issue Size – No. of Shares','Blank ASBA Form','Sponsor Bank','Cut off Amount']
          seen=set()
          for needle in needles:
            start=0
            while True:
              pos=raw.find(needle,start)
              if pos<0: break
              chunk=raw[max(0,pos-7000):pos+12000]
              apis=sorted(set(re.findall(r'["\'](/?[A-Za-z0-9_./-]+/w(?:\?[^"\']*)?)["\']',chunk)))
              key=tuple(apis)
              if key and key not in seen:
                seen.add(key)
                print('===',needle,'===')
                print('\n'.join(apis))
                print(chunk)
              start=pos+len(needle)

      - name: Print API-like strings near query parameter names
        shell: python
        run: |
          import re
          raw=open('/tmp/main.js',encoding='utf-8',errors='ignore').read()
          for needle in ['IPONo','Scrip_cd','startdt','idtype']:
            print('###',needle)
            for m in list(re.finditer(needle,raw))[:40]:
              chunk=raw[max(0,m.start()-1800):m.start()+3500]
              apis=sorted(set(re.findall(r'["\']([^"\']+/w[^"\']*)["\']',chunk)))
              if apis:
                print('\n'.join(apis))
