name: Probe Phase 4.5A NSE past issue fields

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-modern-bse.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Inspect raw NSE past issue records
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from datetime import date
          import scripts.update_data as core

          client=core.NSEClient()
          rows=client.past(date(2026,8,1), date(2026,9,13))
          print('ROWS',len(rows))
          targets={'ABH','ANNU','ASHUTOSH','AUGMONT','DEEPA','ESDS','GAJA','HORIZONIND','HTEL','KANOHAR','LALITHAA','LUMINO','MADHURKNIT','PRANAV','PRIORITY','PERNIASPOP','QUALIANCE','MOMSBELIEF','SHANKESH','SHANTIINOR','SKYTECH','SKYWAYS','SUMAX','SUNSHINE','SYMBIOTEC','ARCIL','GLASSWALL','KARAMTARA','LCCPROJECT','MPIMANIPAL','PRASOLCHEM','STEAMHOUSE'}
          for row in rows:
            symbol=str(row.get('symbol') or row.get('nseSymbol') or row.get('securitySymbol') or '').upper()
            company=str(row.get('companyName') or row.get('company') or row.get('issuerName') or row.get('name') or '')
            key=core.canonical_company(company)
            if symbol in targets or any(t in key or key in t for t in targets if len(t)>5):
              print('\n===',symbol,company,'===')
              print(json.dumps(row,indent=2,ensure_ascii=False,sort_keys=True))
              print('NORMALIZED',json.dumps(core.normalize_nse_record(row,'past'),indent=2,ensure_ascii=False))
          PY
