name: Probe Phase 4.5A NSE monthly ordering

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-phase45a-modern-bse.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Inspect discovered NSE monthly reports and parsed date ranges
        shell: bash
        run: |
          uv run python - <<'PY'
          import requests
          from scripts import enrich_nse_primary_market_reports_v2 as v2
          import scripts.enrich_nse_primary_market_reports as base
          import scripts.update_data as core

          s=requests.Session(); s.headers.update(core.HEADERS)
          urls=v2.discover_report_urls(s, 0)
          print('DISCOVERED',len(urls))
          for i,u in enumerate(urls[:80]): print(i,u)
          print('--- FIRST 30 PARSED ---')
          for i,u in enumerate(urls[:30]):
            try:
              rows=base.parse_report_rows(base.read_xlsx_rows(base.download_report(s,u)),u)
              dates=sorted([r.get('openDate') for r in rows if r.get('openDate')])
              print(i,'rows',len(rows),'min',dates[0] if dates else None,'max',dates[-1] if dates else None,u)
              for r in rows:
                if r.get('openDate','').startswith('2026-08') or r.get('openDate','').startswith('2026-09'):
                  print('  RECENT',r.get('symbol'),r.get('company'),r.get('openDate'))
            except Exception as e:
              print(i,'ERR',type(e).__name__,str(e)[:180],u)
          PY
