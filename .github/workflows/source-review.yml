name: Preview source repairs

on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/offer_parser.py', 'scripts/final_prospectus_parser.py', 'scripts/final_prospectus_policy.py', 'scripts/run_offer_documents.py', 'scripts/run_issuer_offer_docs.py', 'scripts/review_source_repairs.py', 'scripts/collect_nse_offer_filings_final_policy.py', 'scripts/enforce_final_prospectus_policy.py', 'scripts/collect_price_history.py', 'scripts/performance_tracking.py', 'scripts/performance_metrics.py', 'scripts/validate_data.py', 'tests/test_*price*.py', 'tests/test_performance_tracking.py', 'tests/test_final_prospectus_source_policy.py', 'tests/test_financial_source_layouts.py', 'tests/fixtures/**', '.github/workflows/source-review.yml']

permissions:
  contents: read

concurrency:
  group: source-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Test parser before source preview
        run: uv run --frozen python -m unittest discover -s tests -q
      - name: Preview Final Prospectus document repairs
        run: |
          uv run --frozen python scripts/collect_nse_offer_filings_final_policy.py --limit 150 --documents-limit 10
          uv run --frozen python scripts/run_offer_documents.py --limit 30 --workers 3
          uv run --frozen python scripts/run_issuer_offer_docs.py --priority-max 4 --limit 20
          uv run --frozen python scripts/enforce_final_prospectus_policy.py
          uv run --frozen python scripts/review_source_repairs.py --limit 100
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: source-review-${{ github.run_id }}
          path: |
            data/source_review.json
            data/ipos.json
          retention-days: 14

  baselines:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Test baseline collectors
        run: uv run --frozen python -m unittest discover -s tests -q
      - name: Preview Final-Prospectus baseline and dated market history
        run: |
          uv run --frozen python scripts/enforce_final_prospectus_policy.py
          uv run --frozen python scripts/collect_price_history.py --limit 30
          uv run --frozen python scripts/validate_data.py --strict
          uv run --frozen python scripts/build_performance_summary.py
          uv run --frozen python -c 'import json; p=json.load(open("data/ipos.json")); [print("BASELINE_RECORD " + json.dumps({k:r.get(k) for k in ("id","listing","performance","staticSourcePolicy")})) for r in p["ipos"] if r.get("listing") or r.get("performance")]'
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: baseline-preview-${{ github.run_id }}
          path: |
            data/ipos.json
            data/performance_summary.json
          retention-days: 14
