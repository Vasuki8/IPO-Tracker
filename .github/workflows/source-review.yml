name: Preview source repairs

on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/offer_parser.py', 'scripts/final_prospectus_parser.py', 'scripts/final_prospectus_policy.py', 'scripts/final_prospectus_identity.py', 'scripts/p4_offer_parser.py', 'scripts/p4_offer_layouts.py', 'scripts/objects_of_issue_checks.py', 'scripts/run_p4_offer_residuals.py', 'data/verified_corrections.json', 'scripts/run_offer_documents.py', 'scripts/run_issuer_offer_docs.py', 'scripts/enrich_issuer_offer_docs.py', 'scripts/issuer_offer_registry.py', 'scripts/review_source_repairs.py', 'scripts/collect_nse_offer_filings_final_policy.py', 'scripts/enrich_sebi_priority_registers_v2.py', 'scripts/enrich_sebi_document_links.py', 'scripts/enforce_final_prospectus_policy.py', 'scripts/build_missing_queue.py', 'scripts/collect_price_history.py', 'scripts/performance_tracking.py', 'scripts/performance_metrics.py', 'scripts/validate_data.py', 'tests/test_*price*.py', 'tests/test_performance_tracking.py', 'tests/test_final_prospectus_source_policy.py', 'tests/test_sebi_priority_registers_v2.py', 'tests/test_financial_source_layouts.py', 'tests/test_p4_offer*.py', 'tests/test_objects*.py', 'tests/test_final_objects*.py', 'tests/fixtures/**', '.github/workflows/source-review.yml']

permissions:
  contents: read

concurrency:
  group: source-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Test parser before source preview
        run: uv run --frozen python -m unittest discover -s tests -q
      - name: Preview Final Prospectus document repairs
        run: |
          uv run --frozen python scripts/apply_corrections.py
          uv run --frozen python scripts/enforce_final_prospectus_policy.py
          uv run --frozen python scripts/build_missing_queue.py
          uv run --frozen python scripts/enrich_sebi_priority_registers_v2.py --priority-max 4 --search-limit 30
          uv run --frozen python scripts/enrich_sebi_document_links.py --priority-max 4 --limit 30
          uv run --frozen python scripts/collect_nse_offer_filings_final_policy.py --limit 150 --documents-limit 10
          uv run --frozen python scripts/run_offer_documents.py --limit 30 --workers 3
          uv run --frozen python scripts/run_issuer_offer_docs.py --priority-max 4 --limit 30
          uv run --frozen python -c 'import json; from scripts.issuer_offer_registry import VALIDATED_OFFER_DOCUMENTS; p=json.load(open("data/ipos.json")); [print("ISSUER_SOURCE_REPAIR " + json.dumps({"id":r["id"],"extraction":r.get("issuerDocumentExtraction")}, sort_keys=True)) for r in p["ipos"] if r.get("id") in VALIDATED_OFFER_DOCUMENTS]'
          uv run --frozen python scripts/enforce_final_prospectus_policy.py
          uv run --frozen python scripts/review_source_repairs.py --limit 100 --residual-limit 30
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: source-review-${{ github.run_id }}
          path: |
            data/source_review.json
            data/ipos.json
            data/missing_queue.json
          retention-days: 14

  baselines:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Test baseline collectors
        run: uv run --frozen python -m unittest discover -s tests -q
      - name: Preview Final-Prospectus baseline and dated market history
        run: |
          uv run --frozen python scripts/apply_corrections.py
          uv run --frozen python scripts/enforce_final_prospectus_policy.py
          uv run --frozen python scripts/build_missing_queue.py
          uv run --frozen python scripts/collect_price_history.py --limit 30
          uv run --frozen python scripts/validate_data.py --strict
          uv run --frozen python scripts/build_performance_summary.py
          uv run --frozen python -c 'import json; p=json.load(open("data/ipos.json")); [print("BASELINE_RECORD " + json.dumps({k:r.get(k) for k in ("id","listing","performance","staticSourcePolicy")})) for r in p["ipos"] if r.get("listing") or r.get("performance")]'
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: baseline-preview-${{ github.run_id }}
          path: |
            data/ipos.json
            data/missing_queue.json
            data/performance_summary.json
          retention-days: 14
