name: Materialize reviewed NSE batch8
on:
  push:
    branches: ['backend/nse-universe-batch8-20260925']
    paths: ['.github/workflows/materialize-nse-batch8.yml', 'scripts/materialize-nse-batch8.mjs']
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/nse-universe-batch8-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore exact reviewed source archive
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const r=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:10886636012,archive_format:'zip'});
            const b=Buffer.from(r.data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='7169cbd2c166521850ac2fac44c4f4be808440df1ffc0acd45951cd84b2df1bb')throw new Error('source_archive_hash_mismatch');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/batch8-source.zip',b);
      - name: Materialize reviewed decisions without changing production data
        env:
          SOURCE_DIR: ${{ runner.temp }}/batch8-source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/batch8-source" "$RUNNER_TEMP/batch8-materialization"
          unzip -q "$RUNNER_TEMP/batch8-source.zip" -d "$RUNNER_TEMP/batch8-source"
          node scripts/materialize-nse-batch8.mjs | tee "$RUNNER_TEMP/batch8-materialization/source-validation.json"
      - name: Test preservation and pre/post-publication safety
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-extract-nse-ipo-detail-fields.mjs
          node scripts/test-reviewed-nse-ipos.mjs | tee "$RUNNER_TEMP/batch8-materialization/tests.txt"
          node scripts/test-reviewed-nse-publication.mjs | tee "$RUNNER_TEMP/batch8-materialization/rehearsal.json"
          node scripts/apply-reviewed-nse-ipos.mjs --check
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code -- data/recovery data/ipos.json ops assets scripts/apply-reviewed-nse-ipos.mjs scripts/extract-nse-ipo-detail-fields.mjs
          git diff --check
      - name: Commit only reviewed evidence and test integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-reviewed-nse-ipos.mjs data/verified-nse-ipos/2026-09-25-batch8.json data/discovery/nse-universe-batch8-review-2026-09-25.json
          git commit -m 'feat(data): retain twelve reviewed NSE batch8 IPOs'
          git push origin HEAD:refs/heads/backend/nse-universe-batch8-20260925
          git archive --format=zip HEAD > "$RUNNER_TEMP/batch8-materialization/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/batch8-materialization/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nse-batch8-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch8-materialization
          retention-days: 14
          if-no-files-found: error
