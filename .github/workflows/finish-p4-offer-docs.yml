name: Finish P4 offer-document gaps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_p4_record_repairs.py"
      - "scripts/apply_p4_record_repairs_v2.py"
      - "scripts/apply_verified_offer_residuals_v2.py"
      - "scripts/apply_verified_offer_shareholding_residuals.py"
      - "scripts/enrich_issuer_offer_docs.py"
      - "scripts/enrich_sebi_priority_registers_v2.py"
      - "scripts/enrich_sebi_document_links.py"
      - "scripts/run_offer_docs_v13.py"
      - "scripts/run_offer_docs_v14.py"
      - "scripts/run_offer_docs_progressive.py"
      - "scripts/run_issuer_offer_docs.py"
      - "scripts/run_issuer_offer_docs_v3.py"
      - "scripts/run_issuer_offer_docs_v4.py"
      - "tests/test_p4_record_repairs.py"
      - "tests/test_p4_record_repairs_v2.py"
      - "tests/test_offer_docs_v13.py"
      - "tests/test_offer_docs_v14.py"
      - "tests/test_offer_docs_progressive.py"
      - "tests/test_issuer_offer_docs_v3.py"
      - "tests/test_issuer_offer_docs_v4.py"
      - "tests/test_verified_offer_residuals_v2.py"
      - "tests/test_verified_offer_shareholding_residuals.py"
      - "tests/test_sebi_document_links.py"
      - "tests/test_sebi_priority_registers_v2.py"
      - ".github/workflows/finish-p4-offer-docs.yml"
  workflow_run:
    workflows:
      - "P4 NSE issue-term backfill"
    types:
      - completed
  schedule:
    # Daily fallback after the lot-size and issue-term maintenance windows.
    - cron: "37 16 * * *"

permissions:
  contents: write

concurrency:
  # Keep duplicate Finish-P4 runs serialized without competing with unrelated
  # IPO data workflows. GitHub retains at most one pending run per concurrency
  # group even when cancel-in-progress is false, so the old shared
  # `ipo-data-refresh` group allowed other workflows to evict this one before
  # a job ever started. Publication steps already guard against stale data.
  group: finish-p4-offer-docs
  cancel-in-progress: false

jobs:
  verified-p4-fast-path:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run P4 parser and repair regressions
        run: |
          uv run python -m unittest discover -s tests -p "test_p4_record_repairs.py" -v
          uv run python -m unittest discover -s tests -p "test_p4_record_repairs_v2.py" -v
          uv run python -m unittest discover -s tests -p "test_offer_docs_v13.py" -v
          uv run python -m unittest discover -s tests -p "test_offer_docs_v14.py" -v
          uv run python -m unittest discover -s tests -p "test_issuer_offer_docs_v3.py" -v
          uv run python -m unittest discover -s tests -p "test_issuer_offer_docs_v4.py" -v
          uv run python -m unittest discover -s tests -p "test_verified_lot_sizes.py" -v
          uv run python -m unittest discover -s tests -p "test_verified_recent_issue_terms.py" -v
          uv run python -m unittest discover -s tests -p "test_verified_recent_offer_fields.py" -v
          uv run python -m unittest discover -s tests -p "test_verified_offer_residuals_v2.py" -v
          uv run python -m unittest discover -s tests -p "test_verified_offer_shareholding_residuals.py" -v
          uv run python -m unittest discover -s tests -p "test_data_completeness.py" -v
          uv run python -m unittest discover -s tests -p "test_missing_queue.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Apply verified P4 fast path
        shell: bash
        run: |
          # Apply deterministic/source-registered repairs before expensive PDF
          # scanning, then rebuild the queue so already-resolved offer records
          # do not consume a bounded issuer-document slot. Verified documents
          # remain capped at ten per pass because deep extraction can inspect
          # hundreds of pages per issuer. Current-parser successes are skipped;
          # a parser-version or document-URL change automatically re-enables them.
          uv run python scripts/apply_p4_record_repairs_v2.py
          uv run python scripts/apply_verified_lot_sizes.py
          uv run python scripts/apply_verified_recent_issue_terms.py
          uv run python scripts/apply_verified_offer_residuals_v2.py
          uv run python scripts/apply_verified_offer_shareholding_residuals.py
          uv run python scripts/build_missing_queue.py
          uv run python scripts/run_issuer_offer_docs_v4.py --priority-max 4 --limit 10
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish verified P4 gains safely
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"

          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during verified P4 pass; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/)" ]; then
            echo "No verified P4 gains to publish"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: apply verified P4 fast path"
          git push origin HEAD:main

  bounded-p4-residual-discovery:
    needs: verified-p4-fast-path
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout freshly updated main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run residual discovery regressions
        run: |
          uv run python -m unittest discover -s tests -p "test_sebi_priority_registers_v2.py" -v
          uv run python -m unittest discover -s tests -p "test_sebi_document_links.py" -v
          uv run python -m unittest discover -s tests -p "test_offer_docs_v13.py" -v
          uv run python -m unittest discover -s tests -p "test_offer_docs_progressive.py" -v

      - name: Record starting data revision
        run: git rev-parse HEAD:data/ipos.json > /tmp/base-data-blob

      - name: Run bounded residual discovery
        shell: bash
        run: |
          # Generic network discovery is deliberately bounded. The previous
          # unbounded mode could spend 30 seconds per unresolved issuer and hit
          # the workflow timeout before verified documents were ever published.
          uv run python scripts/enrich_sebi_priority_registers_v2.py --priority-max 4 --search-limit 12
          uv run python scripts/enrich_sebi_document_links.py --priority-max 4 --limit 24
          uv run python scripts/run_offer_docs_progressive.py --limit 12
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

      - name: Publish bounded residual gains safely
        shell: bash
        run: |
          cp data/ipos.json /tmp/generated-ipos.json
          BASE_DATA="$(cat /tmp/base-data-blob)"

          git fetch origin main
          REMOTE_DATA="$(git rev-parse origin/main:data/ipos.json)"
          if [ "$REMOTE_DATA" != "$BASE_DATA" ]; then
            echo "Remote IPO data changed during residual P4 discovery; refusing stale publication."
            exit 0
          fi

          git reset --hard origin/main
          cp /tmp/generated-ipos.json data/ipos.json
          uv run python scripts/build_company_pages.py
          uv run python scripts/audit_data_completeness.py
          uv run python scripts/build_missing_queue.py

          if [ -z "$(git status --porcelain -- data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/)" ]; then
            echo "No bounded residual P4 gains to publish"
            exit 0
          fi

          git config user.name "ipo-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json data/completeness.json data/missing_queue.json docs/DATA_QUALITY.md ipo/
          git commit -m "data: advance bounded P4 residual discovery"
          git push origin HEAD:main

      - name: Report P4 completion metrics
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:data/completeness.json > /tmp/current-completeness.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/current-completeness.json').read_text(encoding='utf-8'))
          recent = ((payload.get('coverage') or {}).get('recentExchange2Y') or {})
          offer = ((payload.get('coverage') or {}).get('offerDocumentEligible') or {})
          print('P4 score:', (payload.get('scores') or {}).get('recentExchange2Y'))
          for key in ('priceBand', 'lotSize', 'issueSizeCr', 'issueComposition'):
              print(key, recent.get(key))
          for key in ('registrar', 'leadManagers', 'promoters', 'objectsOfIssue', 'financials', 'promoterShareholding'):
              print(key, offer.get(key))
          PY
