name: Collect Mish Designs 2023 evidence

on:
  push:
    branches:
      - work/bse-2023-mish-source-collection-20261005
    paths:
      - 'data/discovery/bse-2023-mish-source-plan-2026-10-05.json'
      - 'scripts/collect-bse-2023-mish-evidence.mjs'
      - 'scripts/test-bse-2023-mish-evidence.mjs'
      - '.github/workflows/collect-bse-2023-mish-evidence.yml'
  pull_request:
    paths:
      - 'data/discovery/bse-2023-mish-source-plan-2026-10-05.json'
      - 'scripts/collect-bse-2023-mish-evidence.mjs'
      - 'scripts/test-bse-2023-mish-evidence.mjs'
      - 'data/evidence/bse-2023-mish-source-receipt-2026-10-05.json'
      - '.github/workflows/collect-bse-2023-mish-evidence.yml'

permissions:
  contents: read

concurrency:
  group: bse-2023-mish-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Mish source collector
        run: node scripts/test-bse-2023-mish-evidence.mjs
      - name: Validate current queue and public projection
        run: |
          node scripts/check-bse-2023-progress.mjs
          node scripts/check-bse-2022-disposition.mjs
          node scripts/check-retained-bse-snapshot.mjs
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code

  sources:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect Mish issuer and BSE source bytes without importing
        id: collect
        continue-on-error: true
        run: node scripts/collect-bse-2023-mish-evidence.mjs --out="$RUNNER_TEMP/mish-evidence"
      - name: Validate retained evidence bytes
        if: always() && steps.collect.outcome == 'success'
        run: node scripts/collect-bse-2023-mish-evidence.mjs --validate-dir="$RUNNER_TEMP/mish-evidence"
      - name: Retain complete or partial Mish source collection
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: bse-2023-mish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mish-evidence
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Record source archive identity
        if: always() && steps.evidence.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'Mish source artifact: %s\nDigest: %s\nURL: %s\nPublication import allowed: false\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Surface incomplete collection
        if: always()
        run: test "${{ steps.collect.outcome }}" = "success"
