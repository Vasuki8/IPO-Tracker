name: Materialize reviewed NSE batch7
on:
  push:
    branches: ['backend/nse-universe-batch7-20260925']
    paths: ['.github/workflows/materialize-nse-batch7.yml', 'scripts/materialize-nse-batch7.mjs']
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/nse-universe-batch7-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore exact reviewed source archive
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const r=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:10884545129,archive_format:'zip'});
            const b=Buffer.from(r.data);
            if(crypto.createHash('sha256').update(b).digest('hex')!=='4196efe544c31deee32ebd6d642e11d5f904266aee97a10b43c96f392dd27da6')throw new Error('source_archive_hash_mismatch');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/batch7-source.zip',b);
      - name: Materialize locally reviewed decisions and bounded date support
        env:
          SOURCE_DIR: ${{ runner.temp }}/batch7-source
        run: |
          mkdir -p "$RUNNER_TEMP/batch7-source" "$RUNNER_TEMP/batch7-materialization"
          unzip -q "$RUNNER_TEMP/batch7-source.zip" -d "$RUNNER_TEMP/batch7-source"
          node scripts/materialize-nse-batch7.mjs | tee "$RUNNER_TEMP/batch7-materialization/source-validation.json"
      - name: Test preservation and pre/post-publication safety
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/apply-reviewed-nse-ipos.mjs
          node scripts/test-extract-nse-ipo-detail-fields.mjs
          node scripts/test-reviewed-nse-ipos.mjs | tee "$RUNNER_TEMP/batch7-materialization/tests.txt"
          node scripts/test-reviewed-nse-publication.mjs | tee "$RUNNER_TEMP/batch7-materialization/rehearsal.json"
          node scripts/apply-reviewed-nse-ipos.mjs --check
          node scripts/build-published-data.mjs --check
          node scripts/validate-data.mjs
          git diff --exit-code -- data/recovery data/ipos.json ops assets
          git diff --check
      - name: Commit only reviewed source evidence and tested parser support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-reviewed-nse-ipos.mjs scripts/test-reviewed-nse-ipos.mjs data/verified-nse-ipos/2026-09-25-batch7.json data/discovery/nse-universe-batch7-review-2026-09-25.json
          git commit -m 'feat(data): retain thirteen reviewed NSE batch7 IPOs'
          git push origin HEAD:refs/heads/backend/nse-universe-batch7-20260925
          git archive --format=zip HEAD > "$RUNNER_TEMP/batch7-materialization/source-snapshot.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/batch7-materialization/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nse-batch7-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch7-materialization
          retention-days: 14
          if-no-files-found: error
