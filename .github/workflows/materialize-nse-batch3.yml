          p.write_text(text.replace(old, 'fields_verified: audit.checked_fields, batches: batches.map(b => { const a = auditReviewedPublication({ batch: b, recovery, data, checkedAt }); return { manifest: b.manifest_path, issuers: a.checked_issuers, facts: a.checked_fields, status: a.status }; }), idempotent:'))
          PY
      - name: Verify preservation, idempotency, publication and contract
        run: |
          set -euo pipefail
          node scripts/test-reviewed-nse-ipos.mjs | tee "$RUNNER_TEMP/materialization/tests.jsonl"
          node scripts/test-reviewed-nse-publication.mjs | tee "$RUNNER_TEMP/materialization/rehearsal.json"
          node scripts/apply-reviewed-nse-ipos.mjs --check
